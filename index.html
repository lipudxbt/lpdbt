function executeFeiyingSkill(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
    G.sp--;

    addLog('系统', fighter.name + ' 使用了【风纪·尺出缭判】', 'skill-use');

    addXiaodian(10);
    addLog('系统', '获得10笑点', 'buff');

    const enemies = getAliveEnemies();
    const targetIdx = enemies.findIndex(e => e.id === target.id);
    if (targetIdx === -1) return;

    let totalDmg = 0, totalTrueX = 0;

    const rMain = calcDamage(fighter, target, fighter.baseAtk * 3.0, '物理', fighter.label, false);
    target.hp = Math.max(0, target.hp - rMain.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败!'); }
    totalDmg += rMain.finalDmg;
    totalTrueX += rMain.trueDmgXilian;

    const adjIndices = [];
    if (targetIdx > 0) adjIndices.push(targetIdx - 1);
    if (targetIdx < enemies.length - 1) adjIndices.push(targetIdx + 1);
    for (const idx of adjIndices) {
        const adj = enemies[idx];
        if (!adj.alive) continue;
        const rAdj = calcDamage(fighter, adj, fighter.baseAtk * 1.5, '物理', fighter.label, false);
        adj.hp = Math.max(0, adj.hp - rAdj.finalDmg);
        if (adj.hp <= 0) { adj.alive = false; addLog('系统', adj.name + ' 被击败!'); }
        totalDmg += rAdj.finalDmg;
        totalTrueX += rAdj.trueDmgXilian;
    }

    if (hasGoodShow(fighter)) {
        let huanleTotal = 0;
        const hitTargets = [target, ...adjIndices.map(i => enemies[i])].filter(t => t && t.alive);
        hitTargets.forEach(t => {
            const h = calcHuanleDamage(fighter, t, 0.16, '物理');
            t.hp = Math.max(0, t.hp - h.finalDmg);
            if (t.hp <= 0) { t.alive = false; addLog('系统', t.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });
        if (huanleTotal > 0) addLog('系统', '欢愉伤害：' + huanleTotal, 'dmg-true');
    }

    addLog('战斗', fighter.name + ' 战技 -> ' + target.name + '及相邻 ' + totalDmg + ' 总伤害', 'dmg-physical');

    const energyGain = Math.round(30 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + energyGain, fighter.maxEnergy);
    onFeiyingEnergyGained(fighter, energyGain);

    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, [target, ...adjIndices.map(i => enemies[i])], true);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeFeiyingUlt(fighter, mainTarget) {
    if (!fighter || !fighter.alive) return;
    if (fighter.energy < 240) {
        addLog('系统', '能量不足，需要240能量');
        G.isUltInterrupt = false;
        G.ultSelecting[fighter.charId] = false;
        renderAll();
        return;
    }

    addLog('系统', fighter.name + ' 使用了【剑歌·神鬼无赦】', 'skill-use');

    fighter.energy = Math.max(0, fighter.energy - 240);
    addLog('系统', '消耗240能量，剩余' + fighter.energy, 'buff');

    const enemies = getAliveEnemies();
    let totalDmg = 0, totalTrueX = 0;

    enemies.forEach(e => {
        const r = calcDamage(fighter, e, fighter.baseAtk * 1.6, '物理', fighter.label, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        totalDmg += r.finalDmg;
        totalTrueX += r.trueDmgXilian;
    });

    const enemyCount = enemies.filter(e => e.alive).length;
    let bounceCount = 5;
    if (enemyCount >= 3) bounceCount = 6;
    else if (enemyCount === 2) bounceCount = 7;
    else if (enemyCount === 1) bounceCount = 9;

    addLog('系统', '行迹1【瞰众乐】：敌人' + enemyCount + '个，弹射次数' + bounceCount, 'buff');

    const bouncedTargets = [];
    for (let i = 0; i < bounceCount; i++) {
        const aliveEnemies = enemies.filter(e => e.alive);
        if (aliveEnemies.length === 0) break;
        const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        const rBounce = calcDamage(fighter, target, fighter.baseAtk * 1.2, '物理', fighter.label, false);
        if (target.alive) {
            target.hp = Math.max(0, target.hp - rBounce.finalDmg);
            if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败!'); }
        }
        totalDmg += rBounce.finalDmg;
        totalTrueX += rBounce.trueDmgXilian;
        bouncedTargets.push(target);
    }

    if (hasGoodShow(fighter)) {
        const xiaodianForCalc = Math.max(getTotalGoodShow(fighter), 480);
        const savedXiaodian = fighter.goodShow.xiaodian;
        fighter.goodShow.xiaodian = xiaodianForCalc;
        updateGoodShowSummary(fighter);

        let huanleTotal = 0;

        enemies.forEach(e => {
            if (!e.alive) return;
            const h = calcHuanleDamage(fighter, e, 0.24, '物理');
            e.hp = Math.max(0, e.hp - h.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });

        bouncedTargets.forEach(t => {
            if (!t.alive) return;
            const h = calcHuanleDamage(fighter, t, 0.28, '物理');
            t.hp = Math.max(0, t.hp - h.finalDmg);
            if (t.hp <= 0) { t.alive = false; addLog('系统', t.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });

        fighter.goodShow.xiaodian = savedXiaodian;
        updateGoodShowSummary(fighter);

        if (huanleTotal > 0) addLog('系统', '欢愉伤害：' + huanleTotal + '（按' + xiaodianForCalc + '好活计算）', 'dmg-true');
    }

    addLog('战斗', fighter.name + ' 终结技 -> 总伤害 ' + totalDmg, 'dmg-physical');

    const ultEnergyGain = Math.round(5 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + ultEnergyGain, fighter.maxEnergy);
    onFeiyingEnergyGained(fighter, ultEnergyGain);

    G.ultSelecting[fighter.charId] = false;
    G.isUltInterrupt = false;
    G.processing = false;
    renderAll();

    if (processPendingUlts()) return;

    const cf = getCurrentFighter();
    if (cf) showSkillSelection(cf);
    else setTimeout(() => processNextAction(), 300);
}

function executeFeiyingHuanleSkill(fighter) {
    if (!fighter || !fighter.alive) return;
    addLog('系统', fighter.name + ' 使用了欢愉技【绯色·不乐即斩】', 'skill-use');

    if (fighter.hasLC) {
        G.enemies.forEach(e => {
            if (e.alive) {
                e.debuff_feiyingLC = 15;
                e.debuff_feiyingLCDuration = 2;
            }
        });
        addLog('系统', '光锥【邂逅于下一个花季】：敌方受到伤害+15%（2回合）', 'buff');
    }

    const enemies = getAliveEnemies();
    let totalDmg = 0, totalTrueX = 0;

    enemies.forEach(e => {
        const r = calcHuanleDamage(fighter, e, 1.10, '物理');
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        totalDmg += r.finalDmg;
        totalTrueX += r.trueDmgXilian;
    });

    addGoodShowLayer(fighter, 5, 2);
    onFeiyingGoodShowGained(fighter, 5);

    const huanleEnergyGain = Math.round(5 * (1 + getEnergyRechargeBonus(fighter)));

}

window.getEnergyRechargeBonus = function(fighter) {
    let bonus = 0;
    if (typeof _origGetEnergyRechargeBonus_feiying === 'function') {
        bonus = _origGetEnergyRechargeBonus_feiying(fighter);
    }

    if (fighter && fighter.alive && fighter.charId === 'feiying' && fighter.hasLC) {
        bonus += 0.10;
        const maxEnergy = fighter.maxEnergy || 480;
        const excess = Math.min(Math.max(maxEnergy - 120, 0), 360);
        bonus += (excess / 10) * 0.003;
    }

    return bonus;
};

window.updateFighterStats = function(f) {
    if (!f || !f.alive) return;
    if (typeof _origUpdateFighterStats_feiying === 'function') {
        _origUpdateFighterStats_feiying(f);
    }

    if (f.charId === 'feiying' && f.hasLC) {
        f.critDmg += 0.60;
        if (f.spirit && f.spirit.alive) f.spirit.critDmg = f.critDmg;
    }

    if (f.charId === 'feiying') {
        f.critRate = Math.min(f.critRate + 0.30, 1.0);
        f.huanleDu = getFeiyingHuanleDu(f);
    }
};

window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '物理';
    if (typeof _origCalcHuanleDamage_feiying === 'function') {
        const result = _origCalcHuanleDamage_feiying(attacker, defender, skillMultiplier, element);
        if (defender.debuff_feiyingLC && defender.debuff_feiyingLC > 0) {
            result.finalDmg = Math.round(result.finalDmg * (1 + defender.debuff_feiyingLC / 100));
            result.trueDmgXilian = Math.round(result.trueDmgXilian * (1 + defender.debuff_feiyingLC / 100));
        }
        if (defender.debuff_fox && defender.debuff_fox > 0) {
            result.finalDmg = Math.round(result.finalDmg * (1 + defender.debuff_fox / 100));
            result.trueDmgXilian = Math.round(result.trueDmgXilian * (1 + defender.debuff_fox / 100));
        }
        return result;
    }
    return { finalDmg: 0, trueDmgQingge: 0, trueDmgXilian: 0 };
};

window.executeUlt = function(fighter) {
    if (!fighter || !fighter.alive) return;
    if (fighter.charId === 'feiying') {
        showFeiyingUltTargetChoice(fighter);
        return;
    }
    if (typeof _origExecuteUlt_feiying === 'function') _origExecuteUlt_feiying(fighter);
};

window.doUlt = function(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;

    G.ultSelecting = G.ultSelecting || {};
    if (G.ultSelecting[charId]) return;

    if (!G.pendingUlts.find(u => u.charId === charId)) {
        G.pendingUlts.push({ charId: charId });
        addLog('系统', f.name + ' 终结技已排队', 'special');
    }

    if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress) {
        renderAll();
        return;
    }

    processPendingUlts();
    renderAll();
};

window.processPendingUlts = function() {
    if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress) {
        return true;
    }

    if (G.feiyingFoxQueue && G.feiyingFoxQueue.length > 0) {
        if (G.isUltInterrupt) return true;
        const fox = G.feiyingFoxQueue.shift();
        G.isUltInterrupt = true;
        executeFoxAttack(fox.fighter);
        G.isUltInterrupt = false;
        G.processing = false;
        renderAll();
        return processPendingUlts();
    }

    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
        if (G.isUltInterrupt) return true;
        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return processPendingUlts();
    }

    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;

    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();

    if (f.charId === 'feiying') {
        if (f.energy < 240) {
            addLog('系统', '绯英能量不足240，终结技跳过', 'special');
            return processPendingUlts();
        }
        G.isUltInterrupt = true;
        showFeiyingUltTargetChoice(f);
        return true;
    }

    if (f.charId === 'yinlang') {
        if ((f.hiddenScore || 0) < 60) {
            addLog('系统', '隐藏分不足，终结技跳过', 'special');
            return processPendingUlts();
        }
        G.isUltInterrupt = true;
        showYinlangUltTargetChoice(f);
        return true;
    }

    if (f.charId === 'xilian') {
        if ((f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
            addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    } else if (f.charId !== 'yaoguang') {
        if (f.energy < f.maxEnergy) {
            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    }

    G.isUltInterrupt = true;
    executeUlt(f);
    return true;
};

window.advanceActionValue = function() {
    const cur = G.actionQueue[G.currentActionIdx];
    if (cur && cur.type === 'ally' && cur.fighter && !cur.isSpirit) {
        if (typeof tickGoodShowLayers === 'function') {
            tickGoodShowLayers(cur.fighter);
        }
    }
    if (typeof _origAdvanceActionValue_feiying === 'function') {
        _origAdvanceActionValue_feiying();
    }
};

window.buildActionQueue = function() {
    G.fighters.forEach(f => {
        if (f.charId === 'feiying' && f.alive && !f._feiyingInited) {
            initFeiyingFighter(f);
            f._feiyingInited = true;
        }
        if (f.path === '欢愉' && f.alive && !f.goodShowList) {
            initGoodShowList(f);
        }
        if (f.charId === 'feiying' && f.alive) {
            updateFeiyingHuanleDu(f);
        }
    });

    G.enemies.forEach(e => {
        if (e.debuff_fox && e.debuff_foxDuration > 0) {
            e.debuff_foxDuration--;
            if (e.debuff_foxDuration <= 0) e.debuff_fox = 0;
        }
        if (e.debuff_feiyingLC && e.debuff_feiyingLCDuration > 0) {
            e.debuff_feiyingLCDuration--;
            if (e.debuff_feiyingLCDuration <= 0) e.debuff_feiyingLC = 0;
        }
    });

    if (typeof _origBuildActionQueue_feiying === 'function') {
        _origBuildActionQueue_feiying();
    }
};

function showFeiyingUltTargetChoice(fighter) {

};

    f.goodShow = { xiaodian: 0, duration: 0 };
    f.goodShowMax = 50;
    f.paramNum = 104;
    f.bonusHuanle = 0;

    f.trace2GainedThisRound = 0;

// ========== 抵御值 ==========
function getZhenzhuBarrier(fighter) {
    if (!fighter || fighter.charId !== 'zhenzhu' || !fighter.alive) return 0;
    return Math.floor((fighter.goodShow.xiaodian || 0)) * 200;
}

function consumeZhenzhuBarrier(amount) {
    const zhenzhu = getAllyById('zhenzhu');
    if (!zhenzhu || !zhenzhu.alive) return 0;
    const goodShowAvailable = Math.floor(zhenzhu.goodShow.xiaodian || 0);
    if (goodShowAvailable <= 0 || amount <= 0) return 0;
    const wantedGoodShow = Math.ceil(amount / 200);
    const actualGoodShow = Math.min(goodShowAvailable, wantedGoodShow);
    const actualBlocked = actualGoodShow * 200;
    if (zhenzhu.goodShowList && zhenzhu.goodShowList.length > 0) {
        let remain = actualGoodShow;
        for (const layer of zhenzhu.goodShowList) {
            if (remain <= 0) break;
            const take = Math.min(Math.floor(layer.xiaodian), remain);
            layer.xiaodian -= take;
            remain -= take;
        }
        zhenzhu.goodShowList = zhenzhu.goodShowList.filter(l => l.xiaodian > 0);
        updateGoodShowSummary(zhenzhu);
    }
    return actualBlocked;
}

// ========== 欢愉度 ==========
function getZhenzhuHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'zhenzhu' || !fighter.alive) return 0;
    const def = fighter.def || 0;
    let bonus = 0;
    if (def >= 2400) {
        bonus = 32;
        const over = Math.min(Math.floor((def - 2400) / 100), 36);
        bonus += over * 3;
    }
    return bonus;
}

function updateZhenzhuHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'zhenzhu') return;
    updateFighterStats(fighter);
    fighter.huanleDu = getZhenzhuHuanleDu(fighter);
}

// ========== 覆盖 addGoodShowLayer ==========
var _origAddGoodShowLayer_zhenzhu = window.addGoodShowLayer;
window.addGoodShowLayer = function(fighter, xiaodian, duration) {
    if (fighter && fighter.charId === 'zhenzhu') {
        if (!fighter.goodShowList) fighter.goodShowList = [];
        fighter.goodShowList = fighter.goodShowList.filter(l => l.duration >= 9999);
        let currentTotal = 0;
        fighter.goodShowList.forEach(l => { currentTotal += Math.floor(l.xiaodian); });
        xiaodian = Math.floor(xiaodian);
        const max = 50;
        const wouldBe = currentTotal + xiaodian;
        const newTotal = Math.min(wouldBe, max);
        const overflow = Math.max(0, wouldBe - max);
        const hadTemp = fighter.goodShowList.some(l => l.temp);
        fighter.goodShowList = [{ xiaodian: newTotal, duration: 9999 }];
        if (hadTemp) fighter.goodShowList[0].temp = true;
        updateGoodShowSummary(fighter);
        if (overflow > 0) {
            const feiying = getAllyById('feiying');
            if (feiying && feiying.alive && typeof onFeiyingGoodShowGained === 'function') {
                onFeiyingGoodShowGained(feiying, overflow);
            }
        }
        return;
    }
    if (typeof _origAddGoodShowLayer_zhenzhu === 'function') {
        _origAddGoodShowLayer_zhenzhu(fighter, xiaodian, duration);
    }
};

var _origUpdateGoodShowSummary_zhenzhu = window.updateGoodShowSummary;
window.updateGoodShowSummary = function(fighter) {
    if (fighter && fighter.charId === 'zhenzhu') {
        if (!fighter.goodShowList) fighter.goodShowList = [];
        let total = 0;
        let maxDur = 0;
        fighter.goodShowList = fighter.goodShowList.filter(l => l.duration > 0 && l.xiaodian > 0);
        for (const layer of fighter.goodShowList) {
            layer.xiaodian = Math.floor(layer.xiaodian);
            total += layer.xiaodian;
            maxDur = Math.max(maxDur, layer.duration);
        }
        fighter.goodShow = { xiaodian: total, duration: maxDur };
        return;
    }
    if (typeof _origUpdateGoodShowSummary_zhenzhu === 'function') {
        _origUpdateGoodShowSummary_zhenzhu(fighter);
    }
};

var _origTickGoodShowLayers_zhenzhu = window.tickGoodShowLayers;
window.tickGoodShowLayers = function(fighter) {
    if (!fighter || !fighter.alive) return;
    if (fighter.charId === 'zhenzhu') return;
    if (typeof _origTickGoodShowLayers_zhenzhu === 'function') {

};

var _origUpdateFighterStats_zhenzhu = window.updateFighterStats;
window.updateFighterStats = function(f) {
    if (!f || !f.alive) return;

};

// ========== 覆盖 showSkillSelection ==========
var _origShowSkillSelection_zhenzhu = window.showSkillSelection;

        document.getElementById('skillButtons').innerHTML = '<span style="color:#ff6666;">角色已阵亡</span>';
        return;
    }
    const zhenzhu = getAllyById('zhenzhu');
    if (zhenzhu && zhenzhu.alive && fighter.charId !== 'zhenzhu' && !G.zhenzhuExtraTurnActive && !G.isInSecretExecution) {
        const turnKey = G.round + '_' + G.currentActionIdx;
        if (fighter._zhenzhuTurnKey !== turnKey) {
            fighter._zhenzhuTurnKey = turnKey;
            if (zhenzhu.trace2GainedThisRound < 50) {
                const gain = Math.min(5, 50 - zhenzhu.trace2GainedThisRound);
                zhenzhu.trace2GainedThisRound += gain;
                addGoodShowLayer(zhenzhu, gain, 9999);
                addLog('系统', '真珠行迹2：' + fighter.name + '回合开始，真珠获得' + gain + '好活', 'buff');
            }
        }
    }
    if (fighter.charId === 'zhenzhu') {
        if (!G.zhenzhuExtraTurnActive && !G.isInSecretExecution) {
            fighter.trace2GainedThisRound = 0;
        }
        showZhenzhuSkillSelection(fighter);
        return;
    }
    if (typeof _origShowSkillSelection_zhenzhu === 'function') {
        _origShowSkillSelection_zhenzhu(fighter);
    }
};

function showZhenzhuSkillSelection(fighter) {
    const c = document.getElementById('skillButtons');
    const cd = CHAR_DATA[fighter.charId];
    const sp = G.sp > 0;
    const ultReady = fighter.energy >= fighter.maxEnergy;
    const hasDeepLearning = fighter.deepLearning && fighter.deepLearning.charges > 0 && fighter.deepLearning.target;
    let h = '<span class="current-actor-indicator">当前行动: ' + fighter.name + '</span>';
    if (hasDeepLearning) {
        const model = getAllyById(fighter.deepLearning.target);
        const isHuanle = model && CHAR_DATA[model.charId] && CHAR_DATA[model.charId].path === '欢愉';
        const enhanceName = isHuanle ? '【行笔，幻造星月】' : '【行笔，绘制末浪】';
        h += '<button class="btn" id="btnEnhancedBasic" style="background:linear-gradient(145deg,#1a4a5a,#103040);border:1px solid #6edcf0;color:#d0f8ff;box-shadow:0 0 14px rgba(110,220,240,0.6);">' + enhanceName + '</button>';
    } else {
        h += '<button class="btn" id="btnBasic">【' + cd.skills.basic.name + '】</button>';
    }
    h += '<button class="btn ' + (sp ? '' : 'btn-danger') + '" id="btnSkill"' + (sp ? '' : ' disabled') + '>【' + cd.skills.skill.name + '】</button>';
    h += '<button class="btn ' + (ultReady ? 'btn-warning' : '') + '" id="btnUlt"' + (ultReady ? '' : ' disabled') + '>【' + cd.skills.ultimate.name + '】</button>';
    const barrier = getZhenzhuBarrier(fighter);
    h += '<span style="color:#6ec6f8;">欢愉度:' + (fighter.huanleDu||0) + '% 好活:' + Math.floor(fighter.goodShow.xiaodian||0) + '/50 抵御:' + barrier + '</span>';
    if (hasDeepLearning) {
        h += '<span style="color:#ffd966;">深度学习(' + fighter.deepLearning.charges + ')</span>';
    }
    c.innerHTML = h;
    if (hasDeepLearning) {
        document.getElementById('btnEnhancedBasic').addEventListener('click', () => executeZhenzhuEnhancedBasic(fighter));
    } else {
        document.getElementById('btnBasic').addEventListener('click', () => showEnemySelection(fighter, 'basic'));
    }
    const skillBtn = document.getElementById('btnSkill');
    if (skillBtn && !skillBtn.disabled) skillBtn.addEventListener('click', () => executeZhenzhuSkill(fighter));
    const ultBtn = document.getElementById('btnUlt');
    if (ultBtn && !ultBtn.disabled) ultBtn.addEventListener('click', () => doUlt(fighter.charId));
}

// ========== 真珠大招选队友（两次点击） ==========
function showZhenzhuUltTargetChoice(fighter) {
    const allies = getAliveAllies().filter(a => a.charId !== 'zhenzhu');
    if (allies.length === 0) {
        addLog('系统', '没有可选目标，真珠大招无法释放');
        G.isUltInterrupt = false;
        G.ultSelecting[fighter.charId] = false;
        G._pendingSecretUlt = false;
        if (G.isInSecretExecution && typeof continueSecretPhase === 'function') {
            continueSecretPhase();
            return;
        }
        const cf = getCurrentFighter();
        if (cf) showSkillSelection(cf);
        else { G.processing = false; setTimeout(() => processNextAction(), 100); }
        return;
    }
    const c = document.getElementById('skillButtons');
    let selectedId = null;

    function render() {
        let h = '<span style="color:#ffd966;font-size:13px;">真珠终结技 - 选择美学底本（再点一次确认）:</span>';
        allies.forEach(a => {
            const isSel = selectedId === a.charId;
            const style = isSel
                ? 'display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;background:linear-gradient(145deg,#1a4a5a,#0e2a3a);border:2px solid #6ec6f8;box-shadow:0 0 16px #6ec6f8;color:#d0f8ff;'
                : 'display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;';
            h += '<button class="btn' + (isSel ? ' btn-warning' : ' btn-primary') + '" data-ally-id="' + a.charId + '" style="' + style + '">' +
                '<span>' + a.name + '</span><span style="font-size:9px;color:#7aa9ff;">HP ' + Math.round(a.hp) + '/' + Math.round(a.maxHp) + '</span></button>';
        });
        c.innerHTML = h;

        c.querySelectorAll('button[data-ally-id]').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-ally-id');
                if (selectedId === targetId) {
                    this.disabled = true;
                    const target = getAllyById(targetId);
                    if (target && target.alive) executeZhenzhuUlt(fighter, target);
                } else {
                    selectedId = targetId;
                    render();
                }
            });
        });
    }
    render();
}

// ========== 覆盖 doUlt ==========
var _origDoUlt_zhenzhu = window.doUlt;
window.doUlt = function(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    if (f.buffs && f.buffs.zhenzhuTrace3) {
        const zhenzhu = getAllyById('zhenzhu');
        if (zhenzhu && zhenzhu.alive) {
            zhenzhu.energy = Math.min(zhenzhu.energy + 90, zhenzhu.maxEnergy);
            addLog('系统', '真珠行迹3触发：' + f.name + '释放大招，真珠+90能量（固定）', 'buff');
        }
        delete f.buffs.zhenzhuTrace3;
    }
    if (charId === 'zhenzhu') {
        G.ultSelecting = G.ultSelecting || {};
        if (G.ultSelecting[charId]) return;
        if (f.energy < f.maxEnergy) {
            addLog('系统', '真珠能量不足');
            return;
        }
        const anyUltSelecting = G.ultSelecting && Object.values(G.ultSelecting).some(v => v);
        if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress || G.zhenzhuExtraTurnActive || anyUltSelecting || G.isUltInterrupt) {
            if (!G.pendingUlts.find(u => u.charId === charId)) {
                G.pendingUlts.push({ charId: charId, force: true });
                addLog('系统', f.name + ' 终结技已排队', 'special');
            }
            renderAll();
            return;
        }
        G.ultSelecting[charId] = true;
        G.isUltInterrupt = true;
        showZhenzhuUltTargetChoice(f);
        renderAll();
        return;
    }
    const anyUltSelectingOther = G.ultSelecting && Object.values(G.ultSelecting).some(v => v);
    if (G.zhenzhuExtraTurnActive || G.huohuaTrapInProgress || G.yinlangEnhancedInProgress || (anyUltSelectingOther && !G.ultSelecting[charId])) {
        if (!G.pendingUlts.find(u => u.charId === charId)) {
            G.pendingUlts.push({ charId: charId, force: true });
            addLog('系统', f.name + ' 终结技已排队', 'special');
        }
        renderAll();
        return;
    }
    if (typeof _origDoUlt_zhenzhu === 'function') {
        _origDoUlt_zhenzhu(charId);
    }
};

// ========== 真珠普攻 ==========
function executeZhenzhuBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【' + CHAR_DATA.zhenzhu.skills.basic.name + '】', 'skill-use');
    const r = calcDamage(fighter, target, fighter.def * 0.90, '冰', fighter.name, false);
    target.hp = Math.max(0, target.hp - r.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    addLog('战斗', fighter.name + ' 普攻 -> ' + target.name + ' ' + r.finalDmg + ' 伤害', 'dmg-ice');
    const energyGain = Math.round(20 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + energyGain, fighter.maxEnergy);
    G.sp = Math.min(G.sp + 1, G.maxSp);
    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, [target], false);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

// ========== 真珠强化普攻 ==========
function executeZhenzhuEnhancedBasic(fighter) {
    if (!fighter || !fighter.alive) return;
    if (!fighter.deepLearning || fighter.deepLearning.charges <= 0) {
        addLog('系统', '深度学习已结束');
        return;
    }
    const model = getAllyById(fighter.deepLearning.target);
    if (!model || !model.alive) {
        addLog('系统', '美学底本已阵亡，深度学习结束');
        fighter.deepLearning = null;
        showZhenzhuSkillSelection(fighter);
        return;
    }
    const isHuanle = CHAR_DATA[model.charId] && CHAR_DATA[model.charId].path === '欢愉';
    const skillName = isHuanle ? '行笔，幻造星月' : '行笔，绘制末浪';
    addLog('系统', fighter.name + ' 使用了【' + skillName + '】', 'skill-use');
    const enemies = getAliveEnemies();
    let totalDmg = 0;
    enemies.forEach(e => {
        const r = calcDamage(fighter, e, fighter.def * 1.0, '冰', fighter.name, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
        totalDmg += r.finalDmg;
    });
    addLog('战斗', fighter.name + ' 强化普攻 -> 全体 ' + totalDmg + ' 伤害', 'dmg-ice');
    const healVal = Math.round(fighter.def * 0.08 + 160);
    const healBonus = 1 + (fighter.huanleDu || 0) * 0.20 / 100;
    let totalHeal = 0;
    G.fighters.forEach(f => {
        if (f.alive) {
            const h = Math.round(healVal * healBonus);
            if (typeof healWithRecord === 'function') { healWithRecord(f, h); }
            else { f.hp = Math.min(f.maxHp, f.hp + h); }
            totalHeal += h;
        }
    });
    const alive = getAliveAllies();
    if (alive.length > 0) {
        let lowest = alive[0];
        alive.forEach(f => { if (f.hp / f.maxHp < lowest.hp / lowest.maxHp) lowest = f; });
        const h2 = Math.round(healVal * healBonus);
        if (typeof healWithRecord === 'function') { healWithRecord(lowest, h2); }
        else { lowest.hp = Math.min(lowest.maxHp, lowest.hp + h2); }
        totalHeal += h2;
    }
    addLog('治疗', '真珠强化普攻治疗：+' + totalHeal, 'heal');
    if (isHuanle) {
        let huanleTotal = 0;
        enemies.forEach(e => {
            if (!e.alive) return;
            const h = calcHuanleDamage(model, e, 0.60, '冰');
            e.hp = Math.max(0, e.hp - h.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
            huanleTotal += h.finalDmg;
        });
        addLog('系统', '底本欢愉伤害：' + huanleTotal, 'dmg-true');
    }
    const energyGain = Math.round(30 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + energyGain, fighter.maxEnergy);
    G.sp = Math.min(G.sp + 1, G.maxSp);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

// ========== 真珠大招 ==========
// ★ 修复：秘技阶段给底本额外回合时，立即触发（不等其他秘技）
function executeZhenzhuUlt(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    if (target.charId === 'zhenzhu') { addLog('系统', '不能选择自己为美学底本'); return; }
    addLog('系统', fighter.name + ' 使用了【鉴映灵魂的底色】-> ' + target.name, 'skill-use');

    fighter.energy = 0;
    addGoodShowLayer(fighter, 20, 9999);
    addLog('系统', '真珠获得20好活', 'buff');

    G.zhenzhuAestheticModel = target.charId;
    addLog('系统', target.name + ' 成为【美学底本】', 'special');

    fighter.deepLearning = { target: target.charId, charges: 3 };
    addLog('系统', '真珠进入【深度学习】，充能3', 'special');

    const huanleCount = G.fighters.filter(f => f.alive && CHAR_DATA[f.charId] && CHAR_DATA[f.charId].path === '欢愉').length;
    let advancePct = 0;
    if (huanleCount === 1) advancePct = 10;
    else if (huanleCount === 2) advancePct = 15;
    else if (huanleCount >= 3) advancePct = 30;

    if (advancePct > 0 && typeof applyActionAdvance === 'function') {
        applyActionAdvance(target, advancePct, { reason: '美学底本' });
    }

    if (huanleCount >= 4) {
        // ★ 秘技阶段：立即触发额外回合
        if (G.isInSecretExecution) {
            addLog('系统', target.name + ' 获得1个额外回合（秘技阶段立即触发）', 'special');
            // ★ 前置标志：让秘技循环在 100ms 窗口内也等待
            G.extraTurnPendingStart = target.charId;
            setTimeout(function() {
                G.extraTurnPendingStart = null;
                if (typeof startZhenzhuExtraTurn === 'function') {
                    startZhenzhuExtraTurn(target);
                }
            }, 100);
        } else {
            G.zhenzhuExtraTurnQueue.push({ fighter: target, charId: target.charId });
            addLog('系统', target.name + ' 获得1个额外回合（排队）', 'special');
        }
    }

    if (CHAR_DATA[target.charId] && CHAR_DATA[target.charId].path === '欢愉') {
        target.buffs = target.buffs || {};
        target.buffs.zhenzhuTrace3 = { desc: '下次大招回真珠90能量', duration: 999 };
    }

window.processPendingUlts = function() {
    if (G.zhenzhuExtraTurnActive) return true;
    if (G.isInSecretExecution) return true;
    if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress) return true;

    if (G.feiyingFoxQueue && G.feiyingFoxQueue.length > 0) {
        if (G.isUltInterrupt) return true;
        const fox = G.feiyingFoxQueue.shift();
        G.isUltInterrupt = true;
        executeFoxAttack(fox.fighter);
        G.isUltInterrupt = false;
        G.processing = false;
        renderAll();
        return processPendingUlts();
    }

    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
        if (G.isUltInterrupt) return true;
        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return processPendingUlts();
    }

    if (G.pendingUlts && G.pendingUlts.length > 0) {
        if (!G.isUltInterrupt) {
            const next = G.pendingUlts.shift();
            const f = getAllyById(next.charId);
            if (!f || !f.alive) return processPendingUlts();

            if (f.charId === 'zhenzhu') {
                if (!next.force && f.energy < f.maxEnergy) {
                    addLog('系统', '真珠能量不足，终结技跳过', 'special');
                    return processPendingUlts();
                }
                G.isUltInterrupt = true;
                showZhenzhuUltTargetChoice(f);
                return true;
            }

            if (f.charId === 'feiying') {
                if (!next.force && f.energy < 240) {
                    addLog('系统', '绯英能量不足240，终结技跳过', 'special');
                    return processPendingUlts();
                }
                G.isUltInterrupt = true;
                showFeiyingUltTargetChoice(f);
                return true;
            }

            if (f.charId === 'yinlang') {
                if (!next.force && (f.hiddenScore || 0) < 60) {
                    addLog('系统', '隐藏分不足，终结技跳过', 'special');
                    return processPendingUlts();
                }
                G.isUltInterrupt = true;
                showYinlangUltTargetChoice(f);
                return true;
            }

            if (f.charId === 'xilian') {
                if (!next.force && (f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
                    addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
                    return processPendingUlts();
                }
            } else if (f.charId !== 'yaoguang' && f.charId !== 'aha') {
                if (!next.force && f.energy < f.maxEnergy) {
                    addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
                    return processPendingUlts();
                }
            }
            G.isUltInterrupt = true;
            executeUlt(f);
            return true;
        }
        return true;
    }

    if (G.zhenzhuExtraTurnQueue && G.zhenzhuExtraTurnQueue.length > 0) {
        if (G.isUltInterrupt) return true;
        const entry = G.zhenzhuExtraTurnQueue.shift();
        startZhenzhuExtraTurn(entry.fighter);
        return true;
    }
    return false;
};

// ===== js/25_healing_optimizer.js =====
// 治疗日志优化：按角色汇总显示
console.log('[治疗优化] 已加载');

(function() {
    if (!G.healingCollector) {
        G.healingCollector = { perChar: {}, flushTimer: null };
    }

    window.recordHealing = function(target, amount) {
        if (!target || amount <= 0) return;
        const col = G.healingCollector;
        const key = target.charId || target.name;
        if (!col.perChar[key]) {
            col.perChar[key] = { name: target.short || target.name || '角色', amount: 0 };
        }
        col.perChar[key].amount += Math.round(amount);
        if (col.flushTimer) clearTimeout(col.flushTimer);
        col.flushTimer = setTimeout(flushHealingLog, 60);
    };

    // 治疗并记录（即使满血也记录名义治疗量）
    window.healWithRecord = function(target, amount) {
        if (!target || !target.alive) return 0;
        amount = Math.round(amount);
        if (amount <= 0) return 0;
        const old = target.hp;
        target.hp = Math.min(target.maxHp, target.hp + amount);
        const actual = target.hp - old;
        recordHealing(target, amount); // 记录名义治疗量（含溢出）
        return actual;
    };

    function flushHealingLog() {
        const col = G.healingCollector;
        const entries = Object.values(col.perChar);
        col.perChar = {};
        col.flushTimer = null;
        if (entries.length === 0) return;
        let total = 0;
        entries.forEach(e => { total += e.amount; });
        if (total <= 0) return;
        entries.sort((a, b) => b.amount - a.amount);
        const parts = entries.map(e => e.name + '<span style="color:#5fe6a0;">+' + e.amount + '</span>');
        const text = '治疗 ' + parts.join(' ') + '  总:' + total;
        G.log.push({ time: new Date().toLocaleTimeString(), text: text, type: 'heal' });
        if (G.log.length > 200) G.log.shift();
        if (typeof renderLog === 'function') renderLog();
    }

    const _origAddLog = window.addLog;
    window.addLog = function(type, text, cls) {
        if (cls === 'heal') return;
        return _origAddLog(type, text, cls);
    };

    function installHPWatcher(fighter) {
        if (!fighter || fighter._hpWatcherInstalled) return;
        let _hp = fighter.hp;
        try {
            Object.defineProperty(fighter, 'hp', {
                configurable: true,
                enumerable: true,
                get() { return _hp; },
                set(v) {
                    const old = _hp;
                    _hp = v;
                    if (v > old) {
                        const amount = v - old;
                        if (amount > 0) recordHealing(fighter, amount);
                    }
                }
            });
            fighter._hpWatcherInstalled = true;
        } catch(e) {}
    }

    function installAllWatchers() {
        if (G.fighters && G.fighters.length) {
            G.fighters.forEach(f => { if (f) installHPWatcher(f); });
        }
    }

    const _origStartBattle = window.startBattle;
    window.startBattle = function() {
        if (typeof _origStartBattle === 'function') _origStartBattle();
        installAllWatchers();
        setTimeout(installAllWatchers, 10);
        setTimeout(installAllWatchers, 100);
        setTimeout(installAllWatchers, 500);
    };

    const _origBuildActionQueue = window.buildActionQueue;
    window.buildActionQueue = function() {
        if (typeof _origBuildActionQueue === 'function') _origBuildActionQueue();
        installAllWatchers();
    };

    const _origResetBattle = window.resetBattle;
    window.resetBattle = function() {
        G.healingCollector.perChar = {};
        if (G.healingCollector.flushTimer) {
            clearTimeout(G.healingCollector.flushTimer);
            G.healingCollector.flushTimer = null;
        }
        if (typeof _origResetBattle === 'function') _origResetBattle();
    };

    window.addEventListener('load', function() {
        setTimeout(installAllWatchers, 200);
    });
    setInterval(function() {
        if (G.battleActive && G.fighters && G.fighters.length) installAllWatchers();
    }, 500);
})();

// 通用额外回合机制
// ★ 修复：finishExtraTurn 秘技阶段：先处理 pendingUlts，再交还秘技循环
//   （之前直接 continueSecretPhase 导致排队大招被忽略，秘技抢先跑）

console.log('[ExtraTurn] loaded');

(function() {
    if (G.zhenzhuExtraTurnActive === undefined) G.zhenzhuExtraTurnActive = false;
    if (G.zhenzhuExtraTurnFighter === undefined) G.zhenzhuExtraTurnFighter = null;
    if (G.zhenzhuExtraTurnQueue === undefined) G.zhenzhuExtraTurnQueue = [];
    if (G.zhenzhuTempXiaodian === undefined) G.zhenzhuTempXiaodian = 0;

    function clearTempLayers(fighter) {
        if (!fighter) return;
        if (fighter.goodShowList) {
            fighter.goodShowList = fighter.goodShowList.filter(l => !l.temp);
            updateGoodShowSummary(fighter);
        }
        if (G.zhenzhuTempXiaodian > 0) {
            G.ahaMoment.xiaodian = Math.max(0, G.ahaMoment.xiaodian - G.zhenzhuTempXiaodian);
            G.zhenzhuTempXiaodian = 0;
        }
    }

    function forcePassTurn(fighter) {
        if (!fighter) return;
        var maxOther = -Infinity;
        G.actionQueue.forEach(u => {
            if (!u) return;
            if (u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit) return;
            if (typeof u.av === 'number' && u.av > maxOther) maxOther = u.av;
        });
        if (maxOther === -Infinity) return;
        var newAv = maxOther + 0.0001;
        fighter.av = newAv;
        G.actionQueue.forEach(u => {
            if (u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit) {
                u.av = newAv;
            }
        });
        G.actionQueue.sort((a, b) => a.av - b.av);
        G.currentActionIdx = 0;
        renderAll();
    }

    // ========== 开始额外回合 ==========
    window.startZhenzhuExtraTurn = function(fighter) {
        if (!fighter || !fighter.alive) {
            G.zhenzhuExtraTurnActive = false;
            G.zhenzhuExtraTurnFighter = null;
            setTimeout(() => processNextAction(), 100);
            return;
        }
        G.zhenzhuExtraTurnActive = true;
        G.zhenzhuExtraTurnFighter = fighter;
        G.isUltInterrupt = false;
        G.processing = false;

        var wasCurrentActor = false;
        if (!G.isInSecretExecution && !G.ahaMomentInProgress && !G.zhenzhuExtraTurnActive) {
            var curEntry = G.actionQueue[G.currentActionIdx];
            if (curEntry && curEntry.type === 'ally' && curEntry.charId === fighter.charId && !curEntry.isSpirit) {
                wasCurrentActor = true;
            }
        }
        fighter._extraTurnWasCurrentActor = wasCurrentActor;
        fighter._extraTurnSavedAv = fighter.av;

        addLog('系统', '【' + fighter.name + '】的额外回合开始', 'special');
        if (!fighter.goodShowList) fighter.goodShowList = [];
        fighter.goodShowList.push({ xiaodian: 30, duration: 2, temp: true });
        updateGoodShowSummary(fighter);
        if (typeof addXiaodian === 'function') {
            addXiaodian(60);
        } else {
            G.ahaMoment = G.ahaMoment || { active: false, spd: 0, av: 0, xiaodian: 0, scheduledNewXiaodian: 0 };
            G.ahaMoment.xiaodian += 60;
        }
        G.zhenzhuTempXiaodian = 60;
        addLog('系统', fighter.name + ' 获得30好活和60笑点（临时）', 'buff');
        renderAll();
        showSkillSelection(fighter);
    };

    // ========== 结束额外回合 ==========
    function finishExtraTurn(fighter) {
        G.zhenzhuExtraTurnActive = false;
        G.zhenzhuExtraTurnFighter = null;
        if (fighter) {
            clearTempLayers(fighter);

            if (fighter._extraTurnSavedAv !== undefined) {
                fighter.av = fighter._extraTurnSavedAv;
                delete fighter._extraTurnSavedAv;
            }
            if (fighter._extraTurnWasCurrentActor) {
                fighter._extraTurnPendingOriginalTurn = true;
            }
            delete fighter._extraTurnWasCurrentActor;

            G.actionQueue.forEach(u => {
                if (u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit) {
                    u.av = fighter.av;
                }
            });

            addLog('系统', '【' + fighter.name + '】的额外回合结束', 'special');
        }
        G.isUltInterrupt = false;
        G.processing = false;
        buildActionQueue();
        G.currentActionIdx = 0;
        renderAll();

        // ============================================================
        // ★ 关键修复：先处理排队大招，再走秘技/正常流程
        // ============================================================
        const hasPending = G.pendingUlts && G.pendingUlts.length > 0;
        console.log('[ExtraTurn] finishExtraTurn hasPending=' + hasPending
            + ' isInSecretExecution=' + G.isInSecretExecution
            + ' pending=' + JSON.stringify((G.pendingUlts || []).map(u => u.charId)));

        if (hasPending) {
            // 秘技阶段：走 secretTryProcessUlt（保持 isInSecretExecution = true）
            if (G.isInSecretExecution && typeof secretTryProcessUlt === 'function') {
                // secretTryProcessUlt 会检查额外回合标志，此时已清
                if (secretTryProcessUlt()) {
                    console.log('[ExtraTurn] 秘技阶段：排队大招已处理');
                    return;
                }
            } else if (typeof processPendingUlts === 'function') {
                if (processPendingUlts()) {
                    console.log('[ExtraTurn] 排队大招已处理');
                    return;
                }
            }
        }

        // 无排队大招：秘技阶段交还秘技循环
        if (G.isInSecretExecution) {
            console.log('[ExtraTurn] 秘技阶段，交还秘技循环');
            if (typeof continueSecretPhase === 'function') {
                G._secretWaitingUlt = false;
                continueSecretPhase();
            }
            return;
        }

        // 正常阶段：继续战斗
        setTimeout(() => processNextAction(), 200);
    }

    window.endZhenzhuExtraTurn = function(fighter) {
        if (!G.zhenzhuExtraTurnActive) return;
        finishExtraTurn(fighter);
    };

    // ========== Hook advanceActionValue ==========
    var _origAdvanceActionValue_et = window.advanceActionValue;
    window.advanceActionValue = function() {
        if (G.zhenzhuExtraTurnActive) {
            finishExtraTurn(G.zhenzhuExtraTurnFighter);
            return;
        }
        var cur = G.actionQueue[G.currentActionIdx];
        var pendingFighter = (cur && cur.type === 'ally' && cur.fighter && cur.fighter._extraTurnPendingOriginalTurn) ? cur.fighter : null;
        if (typeof _origAdvanceActionValue_et === 'function') {
            _origAdvanceActionValue_et();
        }
        if (pendingFighter) {
            delete pendingFighter._extraTurnPendingOriginalTurn;
            forcePassTurn(pendingFighter);
        }
    };

    // ========== Hook processNextAction ==========
    var _origProcessNextAction_et = window.processNextAction;
    window.processNextAction = function() {
        if (G.zhenzhuExtraTurnActive) return;
        if (typeof _origProcessNextAction_et === 'function') {
            _origProcessNextAction_et();
        }
    };

    // ========== Hook processPendingUlts ==========
    var _origProcessPendingUlts_et = window.processPendingUlts;
    window.processPendingUlts = function() {
        if (G.zhenzhuExtraTurnActive) return true;
        var result = false;
        if (typeof _origProcessPendingUlts_et === 'function') {
            result = _origProcessPendingUlts_et();
        }
        if (result) return true;
        if (G.zhenzhuExtraTurnQueue && G.zhenzhuExtraTurnQueue.length > 0) {
            if (G.isUltInterrupt) return true;
            const entry = G.zhenzhuExtraTurnQueue.shift();
            startZhenzhuExtraTurn(entry.fighter);
            return true;
        }
        return false;
    };

    // ========== Hook 火花强化普攻 ==========
    if (typeof window.executeHuohuaEnhancedBasic === 'function') {
        var _origHHE_et = window.executeHuohuaEnhancedBasic;
        window.executeHuohuaEnhancedBasic = function(fighter, mainTarget) {
            var wasExtra = G.zhenzhuExtraTurnActive && G.zhenzhuExtraTurnFighter === fighter;
            var wasPending = fighter && fighter._extraTurnPendingOriginalTurn;
            if (typeof _origHHE_et === 'function') {
                _origHHE_et(fighter, mainTarget);
            }
            if (wasExtra) {
                finishExtraTurn(fighter);
            } else if (wasPending) {
                delete fighter._extraTurnPendingOriginalTurn;
                forcePassTurn(fighter);
            }
        };
    }

    // ========== Hook 银狼强普最后一击 ==========
    if (typeof window.executeYinlangFinalHit === 'function') {
        var _origYFH_et = window.executeYinlangFinalHit;
        window.executeYinlangFinalHit = function(fighter, accumulatedDamage) {
            var wasExtra = G.zhenzhuExtraTurnActive && G.zhenzhuExtraTurnFighter === fighter;
            var wasPending = fighter && fighter._extraTurnPendingOriginalTurn;
            if (typeof _origYFH_et === 'function') {
                _origYFH_et(fighter, accumulatedDamage);
            }
            if (wasExtra) {
                finishExtraTurn(fighter);
            } else if (wasPending) {
                delete fighter._extraTurnPendingOriginalTurn;
                forcePassTurn(fighter);
            }
        };
    }

    console.log('[ExtraTurn] hooks installed');
})();

// ========== 天赋2：欢愉负债 ==========
function applyAhaTalent2DebtToTargets(targets, totalDamage) {
    const aha = getAllyById('aha');
    if (!aha || !aha.alive) return;
    if (!targets || !targets.length) return;
    if (totalDamage <= 0) return;
    targets.forEach(t => {
        if (!t || !t.alive) return;
        if (!t.baseMaxHp) t.baseMaxHp = t.maxHp;
        const addDebt = totalDamage * 0.25 / targets.length;
        const maxDebt = t.baseMaxHp * 0.10;
        t.ahaDebt = Math.min((t.ahaDebt || 0) + addDebt, maxDebt);
        t.maxHp = Math.max(1, t.baseMaxHp - t.ahaDebt);
        if (t.hp > t.maxHp) t.hp = t.maxHp;
    });

// ========== 阿哈时刻：阿哈最后执行 + 全部结束后统一处理排队大招 ==========
var _origProcessAhaAction_aha = window.processAhaAction;
window.processAhaAction = function() {
    if (G.ahaMomentInProgress) return;
    if (!G.ahaMoment.active) return;

    const huanleFighters = getHuanleFighters().slice().sort((a, b) => (a.paramNum || 999) - (b.paramNum || 999));
    const aha = huanleFighters.find(f => f.charId === 'aha');
    const others = huanleFighters.filter(f => f.charId !== 'aha');
    const sequence = [];
    others.forEach(f => { if (f.alive) sequence.push(f); });
    if (aha && aha.alive) sequence.push(aha);

    addLog('系统', '阿哈时刻开始', 'special');
    G.ahaMomentInProgress = true;
    G.ahaInAhaMoment = true;
    G.ahaMomentTotalDamage = 0;

    let idx = 0;
    function runNext() {
        if (idx >= sequence.length) {
            finish();
            return;
        }
        const f = sequence[idx];
        idx++;
        if (f && f.alive && typeof f.huanleSkill === 'function') {
            try { f.huanleSkill(); } catch(e) { console.error(e); }
        }
        const c = document.getElementById('skillButtons');
        if (c) {
            c.innerHTML = '<span data-transition="1" style="color:#f0c060;font-size:13px;">' + f.name + ' 欢愉技释放中...</span>';
        }
        if (typeof renderActionBar === 'function') renderActionBar();
        setTimeout(runNext, 1000);
    }

    function finish() {
        G.ahaInAhaMoment = false;
        G.isUltInterrupt = false;
        G.ultSelecting = {};

        const totalXiaodian = G.ahaMoment.xiaodian;
        huanleFighters.forEach(f => {
            if (f.alive && typeof grantGoodShow === 'function') {
                grantGoodShow(f, totalXiaodian);
            }
        });
        if (G.huanleUpgrade) {
            const remain = Math.round(totalXiaodian * 0.10);
            G.ahaMoment.xiaodian = remain;
            addLog('系统', '欢愉万相：返还10%笑点 (' + remain + ')', 'special');
        } else {
            G.ahaMoment.xiaodian = 0;
        }
        G.ahaMoment.scheduledNewXiaodian = huanleFighters.length;
        G.ahaTalent1Waiting = true;
        addLog('系统', '阿哈时刻结束', 'special');

        G.ahaMomentInProgress = false;
        if (typeof advanceAhaActionValue === 'function') advanceAhaActionValue();
        if (typeof renderAll === 'function') renderAll();

        setTimeout(function() {
            if (G.pendingUlts && G.pendingUlts.length > 0) {
                if (typeof processPendingUlts === 'function') {
                    if (processPendingUlts()) return;
                }
            }
            if (typeof processNextAction === 'function') processNextAction();
        }, 300);
    }

    runNext();
};

// ============================================================
// ★ 新增：覆盖 executeExtraAhaMoment（额外阿哈时刻）
//   原因：09_yaoguang.js 里的原版是一次性 for 循环，无停顿
//   改为：与 processAhaAction 一致，逐人 1 秒执行
// ============================================================
window.executeExtraAhaMoment = function(extraAha) {
    if (G.ahaMomentInProgress) {
        // 已在阿哈时刻中，避免重入
        return;
    }
    if (!G.ahaMoment) {
        G.ahaMoment = { active: false, spd: 0, av: 0, xiaodian: 0, scheduledNewXiaodian: 0 };
    }

    const huanleFighters = getHuanleFighters().slice().sort((a, b) => (a.paramNum || 999) - (b.paramNum || 999));
    const aha = huanleFighters.find(f => f.charId === 'aha');
    const others = huanleFighters.filter(f => f.charId !== 'aha');
    const sequence = [];
    others.forEach(f => { if (f.alive) sequence.push(f); });
    if (aha && aha.alive) sequence.push(aha);

    addLog('系统', '额外阿哈时刻开始', 'special');
    G.ahaMomentInProgress = true;
    G.ahaInAhaMoment = true;
    G.ahaMomentTotalDamage = 0;

    // 银狼无敌玩家状态切换
    const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
    if (yinlang && yinlang.invinciblePlayer) {
        yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
    }

    // 固定笑点替换
    const fixedXiaodian = extraAha.fixedXiaodian || 0;
    const savedXiaodian = G.ahaMoment.xiaodian;
    G.ahaMoment.xiaodian = fixedXiaodian;

    let idx = 0;
    function runNext() {
        if (idx >= sequence.length) {
            finish();
            return;
        }
        const f = sequence[idx];
        idx++;
        if (f && f.alive && typeof f.huanleSkill === 'function') {
            try { f.huanleSkill(); } catch(e) { console.error(e); }
        }
        const c = document.getElementById('skillButtons');
        if (c) {
            c.innerHTML = '<span data-transition="1" style="color:#f0c060;font-size:13px;">' + f.name + ' 欢愉技释放中...</span>';
        }
        if (typeof renderActionBar === 'function') renderActionBar();
        setTimeout(runNext, 1000);
    }

    function finish() {
        G.ahaInAhaMoment = false;

        // 恢复银狼欢愉技
        if (yinlang) {
            yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
        }

        // 恢复笑点
        G.ahaMoment.xiaodian = savedXiaodian;

        // 好活当赏按固定笑点结算
        huanleFighters.forEach(f => {
            if (f.alive && typeof grantGoodShow === 'function') {
                grantGoodShow(f, fixedXiaodian);
            }
        });
        addLog('系统', '额外阿哈时刻结束', 'special');

        G.ahaMomentInProgress = false;
        G.isUltInterrupt = false;
        G.processing = false;
        if (typeof renderAll === 'function') renderAll();

        setTimeout(function() {
            // 秘技阶段优先恢复秘技循环
            if (G.isInSecretExecution) {
                if (typeof continueSecretPhase === 'function') continueSecretPhase();
                return;
            }
            // 非秘技阶段：处理排队大招/额外阿哈/继续战斗
            if (G.pendingUlts && G.pendingUlts.length > 0) {
                if (typeof processPendingUlts === 'function') {
                    if (processPendingUlts()) return;
                }
            }
            if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
                if (typeof processPendingUlts === 'function') {
                    if (processPendingUlts()) return;
                }
            }
            const cf = getCurrentFighter();
            if (cf && cf.alive) showSkillSelection(cf);
            else if (typeof processNextAction === 'function') processNextAction();
        }, 300);
    }

    runNext();
};

console.log('[HuanleUpgrade] loaded');

(function() {

    if (G.huanleUpgradeTurns === undefined) G.huanleUpgradeTurns = 0;

    // ========== 升格激活/失活：给欢愉角色挂 buff ==========
    function applyUpgradeBuff() {
        G.fighters.forEach(f => {
            if (!f.alive) return;
            if (f.path !== '欢愉') return;
            f.buffs = f.buffs || {};
            f.buffs.huanleUpgrade = { desc: '欢愉万相', duration: 999 };
        });
    }

        G.fighters.forEach(f => {
            if (!f.alive) return;
            if (f.buffs && f.buffs.huanleUpgrade) delete f.buffs.huanleUpgrade;
        });
    }

    var _lastUpgradeState = G.huanleUpgrade;
    setInterval(function() {
        if (G.huanleUpgrade !== _lastUpgradeState) {
            _lastUpgradeState = G.huanleUpgrade;
            if (G.huanleUpgrade) applyUpgradeBuff();
            else removeUpgradeBuff();
            renderAll();
        }
    }, 200);

    // ========== 属性刷新：升格提供的加成 ==========
    var _origUpdateFighterStats_upg = window.updateFighterStats;
    window.updateFighterStats = function(f) {
        if (!f || !f.alive) return;
        _origUpdateFighterStats_upg(f);
        if (!G.huanleUpgrade) return;
        if (f.charId === 'yinlang') f.critDmg += 0.40;
        if (f.charId === 'huohua') f.critDmg += 0.30;
    };

    // ========== 真珠：上限 50→75 ==========
    var _origAddGoodShowLayer_upg = window.addGoodShowLayer;
    window.addGoodShowLayer = function(fighter, xiaodian, duration) {
        if (fighter && fighter.charId === 'zhenzhu' && G.huanleUpgrade) {
            if (!fighter.goodShowList) fighter.goodShowList = [];
            fighter.goodShowList = fighter.goodShowList.filter(l => l.duration >= 9999);
            let currentTotal = 0;
            fighter.goodShowList.forEach(l => { currentTotal += Math.floor(l.xiaodian); });
            xiaodian = Math.floor(xiaodian);
            const max = 75;
            const wouldBe = currentTotal + xiaodian;
            const newTotal = Math.min(wouldBe, max);
            const overflow = Math.max(0, wouldBe - max);
            const hadTemp = fighter.goodShowList.some(l => l.temp);
            fighter.goodShowList = [{ xiaodian: newTotal, duration: 9999 }];
            if (hadTemp) fighter.goodShowList[0].temp = true;
            updateGoodShowSummary(fighter);
            if (overflow > 0) {
                const feiying = getAllyById('feiying');
                if (feiying && feiying.alive && typeof onFeiyingGoodShowGained === 'function') {
                    onFeiyingGoodShowGained(feiying, overflow);
                }
            }
            // 绯英累计绝活共赏
            const feiying = getAllyById('feiying');
            if (feiying && feiying.alive) {
                feiying.accumulatedGoodShow = (feiying.accumulatedGoodShow || 0) + xiaodian;
                while (feiying.accumulatedGoodShow >= 500) {
                    feiying.accumulatedGoodShow -= 500;
                    feiying.nextUltBonus = (feiying.nextUltBonus || 0) + 0.50;
                    addLog('系统', '升格：绯英累计500绝活共赏 → 下次大招倍率+50%', 'buff');
                }
            }
            return;
        }
        if (typeof _origAddGoodShowLayer_upg === 'function') {
            _origAddGoodShowLayer_upg(fighter, xiaodian, duration);
        }
        // 绯英累计
        if (G.huanleUpgrade && fighter && fighter.charId === 'feiying') {
            fighter.accumulatedGoodShow = (fighter.accumulatedGoodShow || 0) + xiaodian;
            while (fighter.accumulatedGoodShow >= 500) {
                fighter.accumulatedGoodShow -= 500;
                fighter.nextUltBonus = (fighter.nextUltBonus || 0) + 0.50;
                addLog('系统', '升格：绯英累计500绝活共赏 → 下次大招倍率+50%', 'buff');

    var _origEnd_extra_upg = window.endZhenzhuExtraTurn;
    window.endZhenzhuExtraTurn = function(fighter) {
        const wasActive = G.zhenzhuExtraTurnActive;
        const goodShowBefore = fighter && fighter.goodShowList ? fighter.goodShowList.filter(l => l.temp).reduce((s, l) => s + l.xiaodian, 0) : 0;
        const xiaodianBefore = G.zhenzhuTempXiaodian || 0;
        if (typeof _origEnd_extra_upg === 'function') {
            _origEnd_extra_upg(fighter);
        }
        if (wasActive && G.huanleUpgrade && fighter) {
            const keepGoodShow = Math.floor(goodShowBefore * 0.10);
            const keepXiaodian = Math.floor(xiaodianBefore * 0.10);
            if (keepGoodShow > 0 && fighter.goodShowList) {
                fighter.goodShowList.push({ xiaodian: keepGoodShow, duration: 2 });
                updateGoodShowSummary(fighter);
            }
            if (keepXiaodian > 0 && G.ahaMoment) {
                G.ahaMoment.xiaodian += keepXiaodian;
            }
            if (keepGoodShow > 0 || keepXiaodian > 0) {
                addLog('系统', '升格：真珠额外回合保留10%（' + keepGoodShow + '好活 +' + keepXiaodian + '笑点）', 'buff');
            }
        }
    };

    var _origAddYinlangHiddenScore_upg = window.addYinlangHiddenScore;
    if (typeof window.addYinlangHiddenScore === 'function') {

        if (f.energy > f.maxEnergy) {

            f.overflowEnergy = Math.min((f.overflowEnergy || 0) + overflow, 60);

    var _origExecuteFeiyingUlt_upg = window.executeFeiyingUlt;

                fighter.nextUltBonus = 0;

            if (typeof _origExecuteFeiyingUlt_upg === 'function') {

            if (G.huanleUpgrade && fighter && fighter.overflowEnergy > 0) {
                const restore = fighter.overflowEnergy;
                fighter.overflowEnergy = 0;
                fighter.energy = Math.min(fighter.energy + restore, fighter.maxEnergy + 60);

        };

    setInterval(function() {

    // ========== UI：升格视觉 ==========
    function applyUpgradeVisuals() {

        ['#teamPanel', '#skillButtons'].forEach(sel => {
            const root = document.querySelector(sel);
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const nodes = [];
            let n;
            while (n = walker.nextNode()) {
                const t = n.textContent;
                if (t.includes('/50') && (t.includes('好活') || t.includes('绝活共赏'))) {
                    nodes.push(n);
                }
            }
            nodes.forEach(node => {
                node.textContent = node.textContent.replace(/\/50/g, '/' + max);

        if (!G.huanleUpgrade) return;

                const newText = node.textContent.replace(/笑点/g, '爽点').replace(/好活当赏/g, '绝活共赏');

    // CSS

        styleEl.textContent = `
            .char-card.huanle-upgraded::before {

                border-radius: 14px;

        document.head.appendChild(styleEl);

    injectUpgradeStyle();

    function applyUpgradeGlow() {
        const tp = document.getElementById('teamPanel');
        if (!tp) return;
        const cards = tp.querySelectorAll('.char-card');
        cards.forEach(card => card.classList.remove('huanle-upgraded'));

        G.fighters.forEach(f => {

            const slotIdx = G.team.indexOf(f.charId);
            if (slotIdx < 0) return;

    var _origRenderAll_upg = window.renderAll;
    window.renderAll = function() {
        if (typeof _origRenderAll_upg === 'function') _origRenderAll_upg();
        applyUpgradeVisuals();
        applyUpgradeGlow();

// ===== js/29_action_advance.js =====
// 100% 拉条：av = min(队列) + 0.001，并同步时钟到 min
// 这样显示约等于 0，排在当前行动者之后

console.log('[ActionAdvance] loaded');

(function() {
    window.applyActionAdvance = function(fighter, percent, options) {
        options = options || {};
        if (!fighter || !fighter.alive || percent <= 0) {
            return { applied: false, reason: 'invalid' };
        }

        // 队列最小 av（当前行动者的 av）
        let minAv = (typeof G.globalAv === 'number' && !isNaN(G.globalAv)) ? G.globalAv : 0;
        if (G.actionQueue && G.actionQueue.length > 0) {
            for (const u of G.actionQueue) {
                if (typeof u.av === 'number' && u.av < minAv) minAv = u.av;
            }
        }

        if (fighter.av <= minAv + 0.001) {
            if (options.log !== false) {
                addLog('系统', fighter.name + ' 已在行动中，行动提前无效', 'buff');
            }
            return { applied: false, reason: 'acting' };
        }

        const oldAv = fighter.av;

        if (percent >= 100) {
            // ★ 时钟同步到 minAv
            if (minAv > (G.globalAv || 0)) {
                G.globalAv = minAv;
            }
            // ★ 银狼 av = minAv + 0.001（显示约 0，排在当前行动者之后）
            fighter.av = minAv + 0.001;

            if (G.actionQueue && G.actionQueue.length > 0) {
                G.actionQueue.forEach(u => {
                    if (u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit) {
                        u.av = fighter.av;
                    }
                });
                G.actionQueue.sort((a, b) => a.av - b.av);
                // 恢复 currentActionIdx 到原当前行动者
                // 找到原当前行动者（minAv 对应的那个）
                const origIdx = G.actionQueue.findIndex(u =>
                    Math.abs(u.av - minAv) < 0.0001 &&
                    !(u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit)
                );
                if (origIdx >= 0) {
                    G.currentActionIdx = origIdx;
                } else {
                    G.currentActionIdx = 0;
                }
            }
        } else {
            const actionInterval = calcActionValue(fighter.spd);
            const advanceAmount = actionInterval * (percent / 100);
            fighter.av = Math.max(minAv, fighter.av - advanceAmount);
            if (G.actionQueue) {
                G.actionQueue.forEach(u => {
                    if (u.type === 'ally' && u.charId === fighter.charId && !u.isSpirit) {
                        u.av = fighter.av;
                    }
                });
                G.actionQueue.sort((a, b) => a.av - b.av);
            }
        }

        if (options.log !== false) {
            const src = options.reason ? '（' + options.reason + '）' : '';
            if (percent >= 100) {
                addLog('系统', fighter.name + ' 行动提前' + percent + '%' + src + '，立即行动', 'buff');
            } else {
                addLog('系统', fighter.name + ' 行动提前' + percent + '%' + src, 'buff');
            }
        }

        if (options.flash !== false) {
            if (typeof forceRenderActionBar === 'function') forceRenderActionBar();
            if (typeof flashActionBarSlot === 'function') flashActionBarSlot(fighter.charId);
            if (typeof flashCard === 'function') flashCard(fighter.charId);
        }

        return { applied: true, oldAv: oldAv, newAv: fighter.av };
    };

    window.applyImmediateAction = function(fighter, options) {
        options = options || {};
        options.reason = options.reason || '立即行动';
        return window.applyActionAdvance(fighter, 100, options);
    };

    console.log('[ActionAdvance] hooks installed');
})();

// ===== js/30_extra_aha.js =====
// 额外阿哈时刻 —— 独立模块
// 覆盖 09_yaoguang.js 和 27_aha.js 里的旧版 executeExtraAhaMoment
//
// ★ 新增：G.battleGeneration 代次检查
//   reset 时递增代次，所有异步循环发现代次变了立刻退出，防止残留

console.log('[ExtraAha] loaded');

(function() {
    window.executeExtraAhaMoment = function(extraAha) {
        // 已在阿哈时刻中，避免重入
        if (G.ahaMomentInProgress) {
            console.warn('[ExtraAha] 已在阿哈时刻中，跳过本次额外阿哈');
            return;
        }
        if (!G.ahaMoment) {
            G.ahaMoment = { active: false, spd: 0, av: 0, xiaodian: 0, scheduledNewXiaodian: 0 };
        }

        // ★ 记录本次执行的代次
        const myGen = G.battleGeneration || 0;

        // 收集欢愉角色，按 paramNum 升序，阿哈永远最后
        const huanleFighters = getHuanleFighters().slice().sort((a, b) => (a.paramNum || 999) - (b.paramNum || 999));
        const aha = huanleFighters.find(f => f.charId === 'aha');
        const others = huanleFighters.filter(f => f.charId !== 'aha');
        const sequence = [];
        others.forEach(f => { if (f.alive) sequence.push(f); });
        if (aha && aha.alive) sequence.push(aha);

        // 固定笑点（爻光大招 20、阿哈秘技 20、默认 0）
        const fixedXiaodian = (extraAha && extraAha.fixedXiaodian) || 0;
        const savedXiaodian = G.ahaMoment.xiaodian;

        addLog('系统', '额外阿哈时刻开始', 'special');

        // 银狼无敌玩家状态 → 替换欢愉技
        const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
        if (yinlang && yinlang.invinciblePlayer) {
            yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
        }

        // 状态标记
        G.ahaMomentInProgress = true;
        G.extraAhaActive = true;
        G.ahaInAhaMoment = true;
        G.ahaMomentTotalDamage = 0;
        G.ahaMoment.xiaodian = fixedXiaodian;

        let idx = 0;

        function runNext() {
            // ★ 代次检查：reset 后立刻退出
            if ((G.battleGeneration || 0) !== myGen) {
                console.log('[ExtraAha] 代次变化，终止本次额外阿哈');
                return;
            }
            if (!G.battleActive) {
                console.log('[ExtraAha] 战斗已结束，终止本次额外阿哈');
                return;
            }

            if (idx >= sequence.length) {
                finish();
                return;
            }

            // 每轮重新确认标志
            G.ahaMomentInProgress = true;
            G.extraAhaActive = true;

            const f = sequence[idx];
            idx++;

            if (f && f.alive && typeof f.huanleSkill === 'function') {
                try {
                    f.huanleSkill();
                } catch (e) {
                    console.error('[ExtraAha] huanleSkill error', f.charId, e);
                }
            }

            // 与 processAhaAction 一致：显示"XX 欢愉技释放中..."
            const c = document.getElementById('skillButtons');
            if (c) {
                c.innerHTML = '<span data-transition="1" style="color:#f0c060;font-size:13px;">' +
                    (f ? f.name : '') + ' 欢愉技释放中...</span>';
            }
            if (typeof renderActionBar === 'function') renderActionBar();

            setTimeout(runNext, 1000);
        }

        function finish() {
            // ★ 代次检查
            if ((G.battleGeneration || 0) !== myGen) return;
            if (!G.battleActive) {
                // 战斗已结束，只清标志
                G.ahaMomentInProgress = false;
                G.extraAhaActive = false;
                G.ahaInAhaMoment = false;
                return;
            }

            G.ahaInAhaMoment = false;

            // 恢复银狼欢愉技
            if (yinlang) {
                yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
            }

            // 恢复原笑点
            G.ahaMoment.xiaodian = savedXiaodian;

            // 好活当赏按固定笑点结算
            huanleFighters.forEach(f => {
                if (f.alive && typeof grantGoodShow === 'function') {
                    grantGoodShow(f, fixedXiaodian);
                }
            });

            addLog('系统', '额外阿哈时刻结束', 'special');

            // 先解除 extraAhaActive，延迟再解除 ahaMomentInProgress
            setTimeout(function() {
                // ★ 代次检查
                if ((G.battleGeneration || 0) !== myGen) return;
                if (!G.battleActive) {
                    G.ahaMomentInProgress = false;
                    G.extraAhaActive = false;
                    return;
                }

                G.ahaMomentInProgress = false;
                G.extraAhaActive = false;
                G.isUltInterrupt = false;
                G.processing = false;
                if (typeof renderAll === 'function') renderAll();

                // 再等 200ms 处理排队大招
                setTimeout(function() {
                    // ★ 代次检查
                    if ((G.battleGeneration || 0) !== myGen) return;
                    if (!G.battleActive) return;

                    // 秘技阶段：交还给秘技循环
                    if (G.isInSecretExecution) {
                        if (typeof continueSecretPhase === 'function') continueSecretPhase();
                        return;
                    }
                    // 排队大招优先
                    if (G.pendingUlts && G.pendingUlts.length > 0) {
                        if (typeof processPendingUlts === 'function') {
                            if (processPendingUlts()) return;
                        }
                    }
                    // 还有别的额外阿哈就接着放
                    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
                        if (typeof processPendingUlts === 'function') {
                            if (processPendingUlts()) return;
                        }
                    }
                    // 回到当前行动者
                    const cf = getCurrentFighter();
                    if (cf && cf.alive) showSkillSelection(cf);
                    else if (typeof processNextAction === 'function') processNextAction();
                }, 200);
            }, 100);
        }

        runNext();
    };

    console.log('[ExtraAha] hooks installed');
})();

                    addLog('系统', '真珠行迹3触发：' + fighter.name + '释放大招，真珠+90能量（固定）', 'buff');
                }
                delete fighter.buffs.zhenzhuTrace3;
            }

            clearUltChoiceLock();
            if (typeof renderAll === 'function') renderAll();

            if (G._pendingSecretUlt) {
                G._pendingSecretUlt = false;
                G.ultSelecting = {};
                G.isUltInterrupt = false;
                G._secretWaitingUlt = false;
                setTimeout(function() {
                    if (G.zhenzhuExtraTurnActive) return;
                    if (tryResumeSpiritBurst()) return;
                    if (G.pendingUlts && G.pendingUlts.length > 0) {
                        if (typeof secretTryProcessUlt === 'function') {
                            if (secretTryProcessUlt()) return;
                        }
                    }
                    if (typeof continueSecretPhase === 'function') continueSecretPhase();
                }, 300);
                return r;
            }

            setTimeout(function() {
                if (isAhaOrExtraLocked()) return;
                if (G.zhenzhuExtraTurnActive) return;

                if (G.pendingUlts && G.pendingUlts.length > 0) {
                    if (G.isInSecretExecution && typeof secretTryProcessUlt === 'function') {
                        if (secretTryProcessUlt()) return;
                    }
                    if (typeof processPendingUlts === 'function') {
                        if (processPendingUlts()) return;
                    }
                }

                // ★ 队列处理完，恢复自爆
                if (tryResumeSpiritBurst()) return;

                if (G.isInSecretExecution && G._secretSkillsRun && typeof continueSecretPhase === 'function') {
                    continueSecretPhase();
                }
            }, 300);
            return r;
        };
    });

    var _origAfterXilianUlt_24 = window.afterXilianUlt;
    if (typeof _origAfterXilianUlt_24 === 'function') {
        window.afterXilianUlt = function(fighter) {
            clearUltChoiceLock();
            return _origAfterXilianUlt_24.apply(this, arguments);
        };
    }

    // ========== resetBattle ==========
    var _origResetBattle_24 = window.resetBattle;
    window.resetBattle = function() {
        G.globalAv = 0;
        G.isTransitioning = false;
        G.transitionStartTime = 0;
        G.transitionTimer = null;
        G.currentActorName = null;
        G.pauseUntil = 0;
        G.pauseLabel = null;
        G.isInSecretExecution = false;
        G._secretSkillsRun = false;
        G._secretWaitingUlt = false;
        G.extraAhaActive = false;
        G.ultChoiceOpen = null;
        G.extraTurnPendingStart = null;
        G.activeActorId = null;
        G._flashTargets = {};
        G._flashBarTargets = {};
        G.pendingSpiritBurst = null;
        if (typeof _origResetBattle_24 === 'function') _origResetBattle_24();
    };

    console.log('[ActionDisplay] hooks installed');
})();

</script>
