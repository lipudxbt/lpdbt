<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>崩铁模拟器</title>
    <style>
/* ============================================================
   style.css —— 崩铁模拟器 v5
   新 UI：崩铁实战视角（金橙 + 深蓝黑）
   老 UI：经典深空玻璃（紫蓝 + 冰蓝）
   主题：黑夜（默认）/ 白天
   ============================================================ */

:root {
    --panel-bg-1: rgba(22, 30, 48, 0.95);
    --panel-bg-2: rgba(12, 18, 32, 0.98);
    --panel-bg-soft-1: rgba(15, 21, 36, 0.75);
    --panel-bg-soft-2: rgba(10, 14, 26, 0.75);
    --panel-bg-mid-1: rgba(15, 21, 36, 0.9);
    --panel-bg-mid-2: rgba(10, 14, 26, 0.9);
    --panel-hover-1: rgba(30, 40, 62, 0.95);
    --panel-hover-2: rgba(18, 26, 42, 0.98);
    --app-bg-1: rgba(20, 28, 46, 0.92);
    --app-bg-2: rgba(10, 14, 26, 0.96);
    --action-bg-1: rgba(12, 18, 32, 0.95);
    --action-bg-2: rgba(15, 21, 36, 0.95);
    --slot-bg-1: rgba(22, 30, 48, 0.9);
    --slot-bg-2: rgba(12, 18, 32, 0.9);
    --sub-bg-1: rgba(8, 12, 20, 0.7);
    --sub-bg-2: rgba(24, 32, 48, 0.85);
    --avatar-bg-1: #2a3650;
    --avatar-bg-2: #1a2438;
    --input-bg: rgba(10, 16, 24, 0.6);
    --shadow-color: rgba(0, 0, 0, 0.35);
    --shadow-deep: rgba(0, 0, 0, 0.6);
    --modal-mask: rgba(4, 6, 12, 0.85);

    /* 高光色（黑夜用白，白天覆盖） */
    --glow-bar: rgba(255, 255, 255, 0.25);
    --glow-bar-strong: rgba(255, 255, 255, 0.3);
    --glow-inset: rgba(255, 255, 255, 0.05);
    --glow-inset-soft: rgba(255, 255, 255, 0.03);
    --btn-top-line: rgba(255, 255, 255, 0.05);
    --enemy-hp-label: #ffffff;

    --text-primary: #e8e2d0;
    --text-secondary: #9aa4bc;
    --text-muted: #5a6280;
    --text-dim: #3a4258;

    --border-dim: rgba(180, 160, 100, 0.12);
    --border-mid: rgba(180, 160, 100, 0.25);
    --border-gold: rgba(200, 168, 90, 0.45);
    --border-gold-bright: rgba(232, 200, 128, 0.8);
    --gold: #c8a85a;
    --gold-bright: #e8c880;
    --gold-glow: rgba(232, 200, 128, 0.45);
    --gold-text-on-accent: #fff8e0;
    --ice: #7ac0e8;
    --ice-glow: rgba(122, 192, 232, 0.45);
    --danger: #d84848;
    --danger-bright: #f06060;

    --card-active-bg-1: rgba(52, 42, 22, 0.95);
    --card-active-bg-2: rgba(30, 24, 12, 0.98);

    --r-xs: 6px;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --r-xl: 24px;

    --t-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    --t-smooth: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============================================================
   ★ 老 UI 配色（深空玻璃 · 紫蓝调）
   ============================================================ */
body.ui-old {
    --panel-bg-1: rgba(16, 22, 34, 0.72);
    --panel-bg-2: rgba(16, 22, 34, 0.72);
    --panel-bg-soft-1: rgba(16, 22, 34, 0.72);
    --panel-bg-soft-2: rgba(16, 22, 34, 0.72);
    --panel-bg-mid-1: rgba(16, 22, 34, 0.78);
    --panel-bg-mid-2: rgba(16, 22, 34, 0.78);
    --panel-hover-1: rgba(22, 30, 46, 0.82);
    --panel-hover-2: rgba(22, 30, 46, 0.82);
    --app-bg-1: rgba(12, 16, 26, 0.78);
    --app-bg-2: rgba(12, 16, 26, 0.78);
    --action-bg-1: rgba(16, 22, 36, 0.78);
    --action-bg-2: rgba(16, 22, 36, 0.78);
    --slot-bg-1: rgba(16, 22, 36, 0.78);
    --slot-bg-2: rgba(16, 22, 36, 0.78);
    --sub-bg-1: rgba(12, 18, 30, 0.6);
    --sub-bg-2: rgba(28, 38, 56, 0.6);
    --avatar-bg-1: rgba(50, 62, 86, 0.9);
    --avatar-bg-2: rgba(34, 44, 64, 0.9);
    --input-bg: rgba(10, 16, 26, 0.72);

    --border-dim: rgba(255, 255, 255, 0.06);
    --border-mid: rgba(255, 255, 255, 0.1);
    --border-gold: rgba(140, 170, 240, 0.3);
    --border-gold-bright: rgba(154, 168, 255, 0.7);

    --gold: #9aa8ff;
    --gold-bright: #b8c4ff;
    --gold-glow: rgba(140, 170, 240, 0.4);
    --gold-text-on-accent: #e8ecff;

    --card-active-bg-1: rgba(56, 46, 22, 0.85);
    --card-active-bg-2: rgba(36, 30, 14, 0.9);
}

/* 老 UI 背景（深空） */
body.ui-old {
    background: radial-gradient(ellipse at 20% 15%, #1a2035 0%, #0a0d18 45%, #05070c 100%);
}

/* 老 UI 按钮（平滑圆角，不带切角，不带金线） */
body.ui-old .btn {
    background: linear-gradient(145deg, rgba(34, 44, 64, 0.75), rgba(22, 30, 48, 0.85));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
body.ui-old .btn::before {
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
}
body.ui-old .btn:hover {
    background: linear-gradient(145deg, rgba(46, 58, 82, 0.85), rgba(30, 40, 62, 0.9));
    border-color: rgba(140, 170, 240, 0.25);
    box-shadow: 0 0 16px rgba(100, 140, 220, 0.2), 0 2px 8px rgba(0, 0, 0, 0.25);
}
body.ui-old .btn-primary {
    background: linear-gradient(135deg, #2e4a7a, #3e5f9e);
    border-color: rgba(120, 160, 240, 0.35);
    box-shadow: 0 2px 12px rgba(60, 100, 200, 0.3);
}
body.ui-old .btn-primary:hover {
    background: linear-gradient(135deg, #3a5a92, #4e72b8);
    box-shadow: 0 0 20px rgba(90, 140, 240, 0.4);
}
body.ui-old .btn-danger {
    background: linear-gradient(135deg, #6a2438, #8a3050);
    border-color: rgba(220, 90, 120, 0.3);
}
body.ui-old .btn-danger:hover {
    background: linear-gradient(135deg, #7a2c44, #9a3860);
    box-shadow: 0 0 20px rgba(220, 90, 120, 0.4);
}
body.ui-old .btn-warning {
    background: linear-gradient(135deg, #6a5220, #8a6e2e);
    border-color: rgba(240, 192, 96, 0.3);
    color: #fff0c8;
    animation: btnPulse 2.2s infinite;
}
body.ui-old .btn-warning:hover {
    background: linear-gradient(135deg, #7a6028, #9a7e3a);
    box-shadow: 0 0 20px rgba(240, 192, 96, 0.4);
}

/* 老 UI 卡片（更大圆角、冰蓝描边） */
body.ui-old .char-card {
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}
body.ui-old .char-card::before {
    background: linear-gradient(90deg, transparent, rgba(120, 170, 255, 0.4), transparent);
    height: 1px;
    top: 0;
}
body.ui-old .char-card:hover {
    background: var(--panel-hover-1);
    border-color: rgba(120, 170, 255, 0.2);
    box-shadow: 0 0 24px rgba(100, 150, 255, 0.12), 0 4px 20px rgba(0, 0, 0, 0.35);
}
body.ui-old .char-card.active-turn {
    border-color: rgba(240, 192, 96, 0.7);
    background: linear-gradient(145deg, rgba(56, 46, 22, 0.85), rgba(36, 30, 14, 0.9));
    box-shadow: 0 0 28px rgba(240, 192, 96, 0.4);
    animation: cardPulseOld 1.8s infinite;
}
@keyframes cardPulseOld {
    0%, 100% { box-shadow: 0 0 22px rgba(240, 192, 96, 0.35); }
    50% { box-shadow: 0 0 34px rgba(240, 192, 96, 0.55); }
}
body.ui-old .char-card.active-turn .char-name {
    color: #f0c060;
    text-shadow: 0 0 14px rgba(240, 192, 96, 0.5);
}
body.ui-old .char-card .char-name {
    font-size: 14px;
    color: #e6ebf5;
}
body.ui-old .char-card .stats span {
    background: rgba(12, 18, 30, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 5px;
}
body.ui-old .char-card .hp-bar,
body.ui-old .char-card .energy-bar {
    height: 5px;
    border-radius: 4px;
    border: none;
    background: rgba(12, 18, 28, 0.9);
}
body.ui-old .char-card .hp-bar .fill,
body.ui-old .char-card .energy-bar .fill {
    border-radius: 4px;
}
body.ui-old .char-card .buff-list .buff-tag {
    background: rgba(28, 38, 56, 0.65);
    border-left: 2px solid #6ec6f8;
    border-radius: 3px;
}
body.ui-old .char-card .corner-tag {
    color: #8899bb;
    background: rgba(255, 255, 255, 0.04);
    border: none;
}
body.ui-old .char-card .spirit-info {
    background: rgba(28, 38, 58, 0.4);
    color: #7aa9ff;
    border: none;
}

/* 老 UI 槽位（圆角胶囊） */
body.ui-old .action-slot {
    border-radius: 18px;
    background: rgba(16, 22, 36, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.06);
}
body.ui-old .action-slot.current {
    border-color: #f0c060;
    background: linear-gradient(145deg, rgba(60, 50, 25, 0.7), rgba(40, 36, 18, 0.85));
    box-shadow: 0 0 16px rgba(240, 192, 96, 0.3);
    color: #f0c060;
}
body.ui-old .action-slot.current .avatar {
    background: linear-gradient(145deg, rgba(50, 62, 86, 0.9), rgba(34, 44, 64, 0.9));
    border-color: rgba(240, 192, 96, 0.5);
    color: #f0c060;
    box-shadow: none;
}
body.ui-old .action-slot.extra {
    border-color: rgba(120, 160, 255, 0.45);
    background: rgba(24, 34, 58, 0.75);
    color: #b8c4ff;
    box-shadow: 0 0 12px rgba(90, 140, 255, 0.15);
}
body.ui-old .action-slot.extra .avatar {
    background: linear-gradient(145deg, rgba(50, 62, 86, 0.9), rgba(34, 44, 64, 0.9));
    border-color: rgba(120, 160, 255, 0.5);
    color: #b8c4ff;
}
body.ui-old .action-slot .avatar {
    background: linear-gradient(145deg, rgba(50, 62, 86, 0.9), rgba(34, 44, 64, 0.9));
    border: none;
    color: #e6ebf5;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* 老 UI 弹窗（老样式：金边 + 大圆角） */
body.ui-old .modal {
    border-radius: 16px;
    border-color: rgba(240, 192, 96, 0.4);
    box-shadow: 0 0 40px rgba(240, 192, 96, 0.25), 0 20px 60px rgba(0, 0, 0, 0.6);
}
body.ui-old .modal h2 {
    color: #f0c060;
    text-shadow: none;
}

/* ============================================================
   ★ 白天模式
   ============================================================ */
body.theme-light {
    --panel-bg-1: rgba(255, 255, 255, 0.95);
    --panel-bg-2: rgba(250, 248, 244, 0.98);
    --panel-bg-soft-1: rgba(255, 255, 255, 0.8);
    --panel-bg-soft-2: rgba(250, 248, 244, 0.9);
    --panel-bg-mid-1: rgba(255, 255, 255, 0.92);
    --panel-bg-mid-2: rgba(250, 248, 244, 0.96);
    --panel-hover-1: rgba(255, 255, 255, 1);
    --panel-hover-2: rgba(252, 250, 246, 1);
    --app-bg-1: rgba(255, 255, 255, 0.94);
    --app-bg-2: rgba(250, 248, 244, 0.98);
    --action-bg-1: rgba(255, 255, 255, 0.95);
    --action-bg-2: rgba(252, 250, 246, 0.98);
    --slot-bg-1: rgba(255, 255, 255, 0.95);
    --slot-bg-2: rgba(248, 246, 240, 0.98);
    --sub-bg-1: rgba(240, 236, 228, 0.85);
    --sub-bg-2: rgba(232, 228, 218, 0.9);
    --avatar-bg-1: #e0dcd0;
    --avatar-bg-2: #ccc6b8;
    --input-bg: rgba(240, 236, 228, 0.9);
    --shadow-color: rgba(80, 70, 40, 0.1);
    --shadow-deep: rgba(80, 70, 40, 0.18);
    --modal-mask: rgba(60, 55, 40, 0.55);

    /* ★ 高光改灰 */
    --glow-bar: rgba(120, 110, 90, 0.18);
    --glow-bar-strong: rgba(120, 110, 90, 0.22);
    --glow-inset: rgba(120, 110, 90, 0.08);
    --glow-inset-soft: rgba(120, 110, 90, 0.05);
    --btn-top-line: rgba(120, 110, 90, 0.08);
    --enemy-hp-label: #4a4a4a;

    --text-primary: #2a2c34;
    --text-secondary: #5a5e6a;
    --text-muted: #8a8e9a;
    --text-dim: #b0b4c0;

    --border-dim: rgba(80, 70, 40, 0.12);
    --border-mid: rgba(80, 70, 40, 0.22);
    --border-gold: rgba(160, 130, 60, 0.5);
    --border-gold-bright: rgba(180, 140, 60, 0.85);
    --gold: #8a6a2a;
    --gold-bright: #a07a28;
    --gold-glow: rgba(160, 130, 60, 0.25);
    --gold-text-on-accent: #ffffff;

    --card-active-bg-1: rgba(255, 240, 200, 0.95);
    --card-active-bg-2: rgba(250, 232, 190, 0.98);
}

body.theme-light {
    background:
            radial-gradient(ellipse at 15% 0%, rgba(200, 210, 230, 0.4) 0%, transparent 45%),
            radial-gradient(ellipse at 85% 100%, rgba(200, 168, 90, 0.14) 0%, transparent 50%),
            linear-gradient(180deg, #f5f1e8 0%, #e8e2d4 100%);
    color: var(--text-primary);
}

body.theme-light.ui-old {
    background:
            radial-gradient(ellipse at 20% 15%, #d8dce8 0%, #c8cedc 45%, #b8bfce 100%);
}

/* 白天模式：卡片内部高光调整 */
body.theme-light .char-card {
    box-shadow: 0 3px 10px rgba(80, 70, 40, 0.08), inset 0 1px 0 rgba(120, 110, 90, 0.08);
}
body.theme-light .char-card:hover {
    box-shadow: 0 0 24px rgba(160, 130, 60, 0.15), 0 6px 16px rgba(80, 70, 40, 0.12);
}
body.theme-light .char-card .char-name {
    color: #2a2c34;
}
body.theme-light .char-card .stats span {
    background: rgba(245, 242, 235, 0.85);
    border-color: rgba(160, 130, 60, 0.12);
    color: #5a5e6a;
}
body.theme-light .char-card .hp-bar,
body.theme-light .char-card .energy-bar {
    background: rgba(220, 215, 205, 0.7);
    border-color: rgba(160, 130, 60, 0.15);
    box-shadow: inset 0 1px 2px rgba(80, 70, 40, 0.1);
}
body.theme-light .char-card .buff-list .buff-tag {
    background: rgba(232, 228, 218, 0.9);
    border-left-color: #4a7ab8;
    color: #4a4e5a;
}
body.theme-light .char-card .corner-tag {
    background: rgba(232, 228, 218, 0.8);
    color: #6a6e7a;
}
body.theme-light .char-card .spirit-info {
    background: rgba(200, 225, 240, 0.6);
    color: #3060a0;
    border-color: rgba(48, 96, 160, 0.25);
}

/* 白天模式：按钮 */
body.theme-light .btn {
    background: linear-gradient(180deg, #fdfbf6, #f2eee4);
    border-color: rgba(160, 130, 60, 0.25);
    color: #3a3c44;
    box-shadow: 0 2px 6px rgba(80, 70, 40, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
body.theme-light .btn::before {
    background: linear-gradient(90deg, transparent, rgba(160, 130, 60, 0.2), transparent);
}
body.theme-light .btn:hover {
    background: linear-gradient(180deg, #fffcf5, #f8f4ea);
    border-color: rgba(160, 130, 60, 0.55);
    color: #6a4a10;
    box-shadow: 0 0 20px rgba(160, 130, 60, 0.18), 0 4px 10px rgba(80, 70, 40, 0.12);
}
body.theme-light .btn-primary {
    background: linear-gradient(180deg, #e8d8a8, #d8c488);
    border-color: rgba(160, 130, 60, 0.6);
    color: #4a3a10;
}
body.theme-light .btn-primary:hover {
    background: linear-gradient(180deg, #f0e2b0, #e2d09a);
    border-color: rgba(180, 140, 60, 0.9);
    color: #2a1a00;
    box-shadow: 0 0 24px rgba(160, 130, 60, 0.35);
}
body.theme-light .btn-danger {
    background: linear-gradient(180deg, #f0d0d0, #e0b8b8);
    border-color: rgba(180, 80, 80, 0.5);
    color: #5a2020;
}
body.theme-light .btn-danger:hover {
    background: linear-gradient(180deg, #f5d8d8, #e8c0c0);
    border-color: rgba(200, 80, 80, 0.8);
    color: #3a0e0e;
    box-shadow: 0 0 20px rgba(200, 80, 80, 0.28);
}
body.theme-light .btn-warning {
    background: linear-gradient(180deg, #f0e0a8, #e0c880);
    border-color: rgba(180, 140, 60, 0.8);
    color: #4a3a10;
}
body.theme-light .btn-ghost {
    background: transparent;
    border-color: rgba(80, 70, 40, 0.2);
    color: #5a5e6a;
}
body.theme-light .btn-ghost:hover {
    background: rgba(240, 236, 228, 0.9);
    color: #6a4a10;
}

/* 白天模式：行动条 */
body.theme-light .action-slot {
    background: linear-gradient(180deg, #ffffff, #f5f1e8);
    border-color: rgba(80, 70, 40, 0.15);
    color: #5a5e6a;
}
body.theme-light .action-slot .avatar {
    background: linear-gradient(180deg, #e8e2d5, #d8d0c0);
    color: #6a4a10;
    border-color: rgba(80, 70, 40, 0.2);
}
body.theme-light .action-slot.current {
    background: linear-gradient(180deg, rgba(255, 240, 200, 0.95), rgba(250, 224, 160, 0.98));
    border-color: rgba(180, 140, 60, 0.9);
    color: #5a3a10;
    box-shadow: 0 0 20px rgba(160, 130, 60, 0.4);
}
body.theme-light .action-slot.current .avatar {
    background: linear-gradient(180deg, #e8d8a8, #d8c488);
    color: #4a3a10;
    border-color: rgba(160, 130, 60, 0.7);
}
body.theme-light .action-slot.extra {
    background: linear-gradient(180deg, #e0eaf5, #d0dcec);
    border-color: rgba(80, 120, 180, 0.5);
    color: #2a4a80;
}
body.theme-light .action-slot.extra .avatar {
    background: linear-gradient(180deg, #c8d8ec, #b0c4dc);
    color: #2a4a80;
    border-color: rgba(80, 120, 180, 0.5);
}

/* 白天模式：敌人卡片 */
body.theme-light .enemy-item {
    background: linear-gradient(180deg, #fdf5f5, #f5e8e8);
    border-color: rgba(180, 80, 80, 0.2);
}
body.theme-light .enemy-item .name {
    color: #2a2c34;
}
body.theme-light .enemy-item .hp-text {
    color: #8a4040;
}
body.theme-light .enemy-item .hp-track {
    background: rgba(220, 200, 200, 0.7);
    border-color: rgba(180, 80, 80, 0.25);
    box-shadow: inset 0 1px 2px rgba(80, 40, 40, 0.1);
}

/* 白天模式：日志 */
body.theme-light #logPanel .log-entry {
    border-bottom-color: rgba(80, 70, 40, 0.06);
}
body.theme-light #logPanel .log-entry .time {
    color: #a0a4b0;
}

/* 白天模式：伤害统计 */
body.theme-light .dmg-stats .row .item {
    background: rgba(240, 236, 228, 0.9);
    border-left-color: #8a6a2a;
}

/* 白天模式：设置弹窗 */
body.theme-light .settings-close {
    background: rgba(240, 236, 228, 0.7);
    color: #5a5e6a;
    border-color: rgba(80, 70, 40, 0.2);
}
body.theme-light .settings-close:hover {
    background: rgba(216, 72, 72, 0.1);
    color: #a03030;
    border-color: rgba(180, 80, 80, 0.5);
}
body.theme-light .setting-opt {
    background: linear-gradient(180deg, #ffffff, #f2eee4);
    border-color: rgba(80, 70, 40, 0.2);
    color: #5a5e6a;
}
body.theme-light .setting-opt:hover {
    border-color: rgba(160, 130, 60, 0.6);
    color: #6a4a10;
}
body.theme-light .setting-opt.active {
    background: linear-gradient(180deg, #e8d8a8, #d8c488);
    border-color: rgba(160, 130, 60, 0.8);
    color: #4a3a10;
}
body.theme-light .toggle-switch {
    background: rgba(240, 236, 228, 0.9);
    border-color: rgba(80, 70, 40, 0.2);
}
body.theme-light .toggle-slider {
    background: #d0ccc0;
    border-color: rgba(80, 70, 40, 0.2);
}
body.theme-light .toggle-switch input:checked + .toggle-slider {
    background: linear-gradient(180deg, #d8c488, #c8b078);
    border-color: rgba(160, 130, 60, 0.7);
}

/* 白天模式：日志颜色 */
body.theme-light .dmg-ice { color: #3070a8; }
body.theme-light .dmg-wind { color: #208850; }
body.theme-light .dmg-true { color: #b05090; }

/* ============================================================
   基础重置
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    background:
            radial-gradient(ellipse at 15% 0%, rgba(60, 80, 130, 0.18) 0%, transparent 45%),
            radial-gradient(ellipse at 85% 100%, rgba(200, 168, 90, 0.08) 0%, transparent 50%),
            linear-gradient(180deg, #06080f 0%, #04060c 100%);
    color: var(--text-primary);
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    font-size: 13px;
    padding: 14px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.3px;
    transition: background 0.3s, color 0.3s;
}

#app {
    max-width: 1440px;
    width: 100%;
    background: linear-gradient(180deg, var(--app-bg-1), var(--app-bg-2));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-mid);
    border-radius: var(--r-xl);
    padding: 18px 20px;
    position: relative;
    box-shadow:
            0 0 80px var(--shadow-deep),
            inset 0 1px 0 var(--glow-inset-soft);
    transition: background 0.3s, border-color 0.3s;
}

#app::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    opacity: 0.6;
    pointer-events: none;
}

/* ============================================================
   Header
   ============================================================ */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border-dim);
    position: relative;
    flex-wrap: wrap;
    gap: 10px;
}

.header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0;
    width: 80px; height: 2px;
    background: var(--gold-bright);
    box-shadow: 0 0 14px var(--gold-glow);
    border-radius: 2px;
}

.header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--gold-bright);
    text-shadow: 0 0 12px var(--gold-glow);
}

body.ui-old .header h1 {
    background: linear-gradient(135deg, #d8e4ff, #9aa8ff 50%, #c8a8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 12px rgba(130, 160, 255, 0.3));
}

.header > div {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.round-info {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    padding: 5px 12px;
    border: 1px solid var(--border-dim);
    border-radius: var(--r-sm);
    background: var(--input-bg);
    margin-right: 6px;
}

.round-info strong {
    color: var(--gold-bright);
    font-weight: 700;
    margin-left: 4px;
}

/* ============================================================
   按钮基础
   ============================================================ */
.btn {
    background: linear-gradient(180deg, var(--slot-bg-1), var(--slot-bg-2));
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    padding: 8px 18px;
    border-radius: var(--r-sm);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: all var(--t-fast);
    position: relative;
    font-family: inherit;
    box-shadow: 0 2px 6px var(--shadow-color);
}

.btn::before {
    content: '';
    position: absolute;
    top: 0; left: 12px; right: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--btn-top-line), transparent);
    pointer-events: none;
}

.btn:hover {
    background: linear-gradient(180deg, var(--panel-hover-1), var(--panel-hover-2));
    border-color: var(--border-gold);
    color: var(--gold-bright);
    box-shadow: 0 0 22px var(--gold-glow), 0 4px 10px var(--shadow-color);
    transform: translateY(-1.5px);
}

.btn:active { transform: translateY(0); }

.btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: grayscale(50%);
    transform: none;
    box-shadow: none;
}

.btn-primary {
    background: linear-gradient(180deg, #5a4a26, #332a16);
    border-color: var(--border-gold);
    color: var(--gold-bright);
}
.btn-primary:hover {
    background: linear-gradient(180deg, #7a6234, #45381c);
    border-color: var(--border-gold-bright);
    box-shadow: 0 0 28px var(--gold-glow);
    color: var(--gold-text-on-accent);
}

.btn-danger {
    background: linear-gradient(180deg, #462424, #251212);
    border-color: rgba(216, 72, 72, 0.45);
    color: #e8b0b0;
}
.btn-danger:hover {
    background: linear-gradient(180deg, #5e2a2a, #331818);
    border-color: rgba(240, 96, 96, 0.75);
    color: #ffe0e0;
    box-shadow: 0 0 22px rgba(216, 72, 72, 0.4);
}

.btn-warning {
    background: linear-gradient(180deg, #5a4a26, #332a16);
    border-color: var(--border-gold-bright);
    color: var(--gold-bright);
    animation: btnPulse 2.2s infinite;
}

.btn-ghost {
    background: transparent;
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    padding: 7px 14px;
}
.btn-ghost:hover {
    background: var(--sub-bg-1);
    border-color: var(--border-gold);
    color: var(--gold-bright);
    box-shadow: 0 0 16px var(--gold-glow);
}

@keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 10px var(--gold-glow); }
    50% { box-shadow: 0 0 24px var(--gold-glow); }
}

.btn-sm, .btn-edit, .btn-reset {
    padding: 4px 12px;
    font-size: 10px;
    letter-spacing: 0.5px;
    border-radius: var(--r-xs);
}

/* ============================================================
   编队区
   ============================================================ */
.roster-panel {
    background: linear-gradient(180deg, var(--panel-bg-soft-1), var(--panel-bg-soft-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 10px 14px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
    position: relative;
    box-shadow: 0 2px 10px var(--shadow-color);
}

.roster-panel::before {
    content: '';
    position: absolute;
    top: 12%; left: 0;
    width: 3px; height: 76%;
    background: linear-gradient(180deg, transparent, var(--gold-bright), transparent);
    opacity: 0.7;
    border-radius: 0 2px 2px 0;
}

.roster-item {
    background: var(--slot-bg-1);
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    transition: all var(--t-fast);
    display: flex;
    align-items: center;
    gap: 5px;
}

.roster-item:hover {
    background: var(--panel-hover-1);
    border-color: var(--border-gold);
    color: var(--gold-bright);
    box-shadow: 0 0 14px var(--gold-glow);
    transform: translateY(-1px);
}

.roster-item.in-team { opacity: 0.4; cursor: not-allowed; }

.roster-item .del {
    color: #c07070;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
    padding-left: 4px;
}
.roster-item .del:hover { color: var(--danger-bright); }

.settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, var(--panel-bg-soft-1), var(--panel-bg-soft-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 10px 16px;
    box-shadow: 0 2px 10px var(--shadow-color);
}

.settings-row label {
    color: var(--text-secondary);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.settings-row select {
    background: var(--input-bg);
    color: var(--gold-bright);
    border: 1px solid var(--border-mid);
    border-radius: var(--r-xs);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    font-family: inherit;
}

.settings-row select:hover {
    border-color: var(--border-gold);
    box-shadow: 0 0 12px var(--gold-glow);
}

.settings-hint {
    color: var(--text-muted);
    font-size: 11px;
}

/* ============================================================
   战斗布局（grid-area）
   ============================================================ */
.battle-layout {
    display: grid;
    gap: 12px;
    align-items: start;
    min-width: 0;
}

.action-wrap { grid-area: action; }
#enemyBar { grid-area: enemy; }
#dmgStats { grid-area: dmg; }
#controlArea { grid-area: control; }
#teamPanel { grid-area: team; }
#logPanel { grid-area: log; }

/* 新 UI */
body.ui-new .battle-layout {
    grid-template-columns: 84px minmax(0, 1fr) 300px;
    grid-template-areas:
        "action enemy   log"
        "action dmg     log"
        "action control log"
        "action team    log";
}

/* 老 UI */
body.ui-old .battle-layout {
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-areas:
        "action  log"
        "enemy   log"
        "team    log"
        "control log"
        "dmg     log";
}

/* ============================================================
   行动区
   ============================================================ */
.action-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
}

body.ui-new .action-wrap {
    background: linear-gradient(180deg, var(--panel-bg-mid-1), var(--panel-bg-mid-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 10px 6px 8px;
    position: sticky;
    top: 14px;
    max-height: calc(100vh - 200px);
    box-shadow: 0 2px 12px var(--shadow-color), inset 0 1px 0 var(--glow-inset-soft);
}

body.ui-new .action-wrap::before {
    content: '';
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    border-radius: 1px;
}

.action-bar {
    display: flex;
    gap: 6px;
    min-width: 0;
}

body.ui-new .action-bar {
    flex-direction: column;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    min-height: 0;
}

body.ui-old .action-wrap {
    background: linear-gradient(90deg, var(--action-bg-1), var(--action-bg-2), var(--action-bg-1));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 12px 16px;
    min-height: 48px;
    position: relative;
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 2px 12px var(--shadow-color);
}

body.ui-old .action-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
    border-radius: 1px;
}

body.ui-old .action-bar {
    flex: 1;
    flex-direction: row;
    flex-wrap: wrap;
    overflow-x: auto;
}

.action-bar::-webkit-scrollbar { width: 3px; height: 3px; }
.action-bar::-webkit-scrollbar-track { background: transparent; }
.action-bar::-webkit-scrollbar-thumb {
    background: rgba(200, 168, 90, 0.3);
    border-radius: 2px;
}

.action-bar::before { display: none; }
.action-bar .label { display: none; }

.rail-title {
    font-size: 9px;
    color: var(--gold-bright);
    letter-spacing: 1.5px;
    text-align: center;
    padding-bottom: 7px;
    margin-bottom: 2px;
    border-bottom: 1px solid var(--border-dim);
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
}

body.ui-old .rail-title { display: none; }

.action-slot {
    background: linear-gradient(180deg, var(--slot-bg-1), var(--slot-bg-2));
    border: 1px solid var(--border-dim);
    transition: all var(--t-fast);
    flex-shrink: 0;
    position: relative;
    word-break: break-all;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 6px var(--shadow-color);
}

body.ui-new .action-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 5px 2px 4px;
    border-radius: 10px;
    width: 100%;
    text-align: center;
    font-size: 8px;
    line-height: 1.15;
    color: var(--text-secondary);
}

body.ui-old .action-slot {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    white-space: nowrap;
}

.action-slot .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--avatar-bg-1), var(--avatar-bg-2));
    border: 1px solid var(--border-mid);
    color: var(--gold-bright);
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 var(--glow-inset);
}

body.ui-new .action-slot .avatar {
    width: 30px;
    height: 30px;
    font-size: 12px;
}

body.ui-old .action-slot .avatar {
    width: 22px;
    height: 22px;
    font-size: 11px;
}

.action-slot.current {
    background: linear-gradient(180deg, rgba(70, 56, 28, 0.95), rgba(45, 34, 16, 0.98));
    border-color: var(--border-gold-bright);
    color: var(--gold-bright);
    font-weight: 700;
    box-shadow: 0 0 18px var(--gold-glow), inset 0 0 10px rgba(232, 200, 128, 0.12);
}

.action-slot.current .avatar {
    background: linear-gradient(180deg, #5a4a26, #332a16);
    border-color: var(--border-gold-bright);
    color: var(--gold-text-on-accent);
    box-shadow: 0 0 10px var(--gold-glow);
}

.action-slot.extra {
    border-color: rgba(122, 192, 232, 0.55);
    background: linear-gradient(180deg, rgba(22, 42, 62, 0.9), rgba(12, 24, 42, 0.95));
    color: var(--ice);
    box-shadow: 0 0 12px rgba(122, 192, 232, 0.3);
}
.action-slot.extra .avatar {
    background: linear-gradient(180deg, #1c3a58, #0e2038);
    border-color: rgba(122, 192, 232, 0.6);
    color: var(--ice);
}

.rail-round {
    display: flex;
    border-top: 1px solid var(--border-dim);
    flex-shrink: 0;
    line-height: 1.2;
}

body.ui-new .rail-round {
    margin-top: 4px;
    padding: 6px 4px 4px;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

body.ui-new .rail-round .rr-title {
    font-size: 10px;
    color: var(--gold-bright);
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Consolas', 'Monaco', monospace;
    text-shadow: 0 0 10px var(--gold-glow);
}

body.ui-new .rail-round .rr-av {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 700;
    font-family: 'Consolas', 'Monaco', monospace;
}

body.ui-old .rail-round {
    margin-left: 12px;
    padding-left: 12px;
    border-top: none;
    border-left: 1px solid var(--border-dim);
    flex-direction: row;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--gold-bright);
    font-weight: 700;
    font-family: 'Consolas', 'Monaco', monospace;
    text-shadow: 0 0 10px var(--gold-glow);
}

body.ui-old .rail-round .rr-av {
    color: var(--text-secondary);
    font-size: 11px;
}

/* ============================================================

   ============================================================ */

.enemy-item:hover {

.enemy-item .name {

.enemy-item .name .tag {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 10px;
    letter-spacing: 1px;
}

.enemy-item .hp-track {
    width: 100%;
    height: 12px;
    background: rgba(8, 4, 8, 0.95);
    border: 1px solid rgba(216, 72, 72, 0.25);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}

.enemy-item .hp-track .fill {
    height: 100%;
    background: linear-gradient(90deg, #a02828, #d84848 60%, #f06060);
    transition: width 0.4s;
    box-shadow: 0 0 10px rgba(240, 96, 96, 0.5);
    border-radius: 6px;
    position: relative;
}

.enemy-item .hp-track .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--glow-bar), transparent 55%);
    border-radius: 6px;
}

.enemy-item .hp-track .label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--enemy-hp-label);
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

body.theme-light .enemy-item .hp-track .label {
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
}

.enemy-item .hp-text {
    font-size: 10px;
    color: #c09090;
    text-align: right;
}

/* ============================================================
   伤害统计
   ============================================================ */
.dmg-stats {
    background: linear-gradient(180deg, var(--panel-bg-mid-1), var(--panel-bg-mid-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    position: relative;
    box-shadow: 0 2px 12px var(--shadow-color);
}

.dmg-stats::before {
    content: '';
    position: absolute;
    top: 12%; left: 0;
    width: 3px; height: 76%;
    background: linear-gradient(180deg, transparent, var(--gold-bright), transparent);
    opacity: 0.6;
    border-radius: 0 2px 2px 0;
}

.dmg-stats .total {
    color: var(--gold-bright);
    font-weight: 700;
    font-size: 13px;
    font-family: 'Consolas', 'Monaco', monospace;
    padding-right: 14px;
    border-right: 1px solid var(--border-dim);
    text-shadow: 0 0 12px var(--gold-glow);
}

.dmg-stats .row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    font-size: 11px;
    color: var(--text-secondary);
}

.dmg-stats .row .item {
    background: var(--sub-bg-1);
    border-left: 2px solid var(--gold);
    padding: 3px 10px;
    border-radius: 6px;
    font-family: 'Consolas', 'Monaco', monospace;
}

/* ============================================================
   控制区
   ============================================================ */
.control-area {
    background: linear-gradient(180deg, var(--panel-bg-mid-1), var(--panel-bg-mid-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    position: relative;
    box-shadow: 0 2px 12px var(--shadow-color);
}

.control-area::before {
    content: '';
    position: absolute;
    top: 15%; left: 0;
    width: 3px; height: 70%;
    background: linear-gradient(180deg, transparent, var(--ice), transparent);
    opacity: 0.5;
    border-radius: 0 2px 2px 0;
}

.control-area .skill-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    flex: 1;
}

.control-area .skill-buttons .placeholder {
    color: var(--text-muted);
}

.control-area .skill-buttons .btn {
    min-width: 50px;
    font-size: 12px;
    padding: 7px 16px;
}

.current-actor-indicator {
    background: linear-gradient(180deg, rgba(70, 56, 28, 0.95), rgba(45, 34, 16, 0.98));
    border: 1px solid var(--border-gold-bright);
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-bright);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 1.5px;
    box-shadow: 0 0 18px var(--gold-glow);
    animation: indicatorPulse 2s infinite;
}

@keyframes indicatorPulse {
    0%, 100% { box-shadow: 0 0 14px var(--gold-glow); }
    50% { box-shadow: 0 0 26px var(--gold-glow); }
}

.control-area .info-badge {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-left: 16px;
    border-left: 1px solid var(--border-dim);
    flex-shrink: 0;
}

.control-area .info-badge .xiaodian-line {
    min-height: 16px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
}

.control-area .info-badge #xiaodianDisplay {
    color: var(--gold-bright);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: 'Consolas', 'Monaco', monospace;
    text-shadow: 0 0 10px var(--gold-glow);
}

.control-area .info-badge .sp-line {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.8px;
}

.control-area .info-badge .sp {
    color: var(--gold-bright);
    font-weight: 700;
    font-family: 'Consolas', 'Monaco', monospace;
}

/* ============================================================
   队伍卡片
   ============================================================ */
.team-panel {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

body.ui-new .team-panel { margin-top: 12px; }
body.ui-old .team-panel { margin-top: 0; }

.char-card {
    background: linear-gradient(180deg, var(--panel-bg-1), var(--panel-bg-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 10px 10px 8px;
    position: relative;
    transition: all var(--t-fast);
    cursor: pointer;
    overflow: visible;
    display: flex;
    flex-direction: column;
    gap: 3px;
    box-shadow: 0 3px 10px var(--shadow-color), inset 0 1px 0 var(--glow-inset-soft);
}

.char-card::before {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
    border-radius: 1px;
}

.char-card:hover {
    background: linear-gradient(180deg, var(--panel-hover-1), var(--panel-hover-2));
    border-color: var(--border-mid);
    box-shadow: 0 0 24px var(--gold-glow), 0 6px 16px var(--shadow-color);
    transform: translateY(-2px);
}

.char-card.active-turn {
    border-color: var(--border-gold-bright);
    background: linear-gradient(180deg, var(--card-active-bg-1), var(--card-active-bg-2));
    box-shadow: 0 0 28px var(--gold-glow);
    transform: translateY(-2px);
    animation: cardPulse 2s infinite;
}

@keyframes cardPulse {
    0%, 100% { box-shadow: 0 0 22px var(--gold-glow); }
    50% { box-shadow: 0 0 36px var(--gold-glow); }
}

.char-card .char-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-primary);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border-dim);
    margin-bottom: 3px;
    padding-right: 58px;
    min-height: 20px;
}

.char-card.active-turn .char-name {
    color: var(--gold-bright);
    text-shadow: 0 0 14px var(--gold-glow);
}

.char-card .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 4px;
    font-size: 9px;
    color: var(--text-secondary);
}

.char-card .stats span {
    background: var(--sub-bg-1);
    border: 1px solid rgba(200, 168, 90, 0.1);
    padding: 2px 6px;
    border-radius: 8px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 9px;
}

.char-card .hp-bar,
.char-card .energy-bar {
    height: 6px;
    background: rgba(4, 6, 12, 0.9);
    border: 1px solid rgba(200, 168, 90, 0.12);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
}

.char-card .hp-bar .fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s;
    position: relative;
}

.char-card .hp-bar .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--glow-bar), transparent 55%);
    border-radius: 4px;
}

.char-card .energy-bar .fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s;
    box-shadow: 0 0 8px currentColor;
    position: relative;
}

.char-card .energy-bar .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--glow-bar-strong), transparent 55%);
    border-radius: 4px;
}

.char-card .buff-list {
    font-size: 9px;
    color: var(--text-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 2px;
}

.char-card .buff-list .buff-tag {
    background: var(--sub-bg-2);
    border-left: 2px solid var(--ice);
    padding: 1px 5px;
    border-radius: 4px;
}

.char-card .empty-slot {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 30px 0;
    letter-spacing: 2px;
    border: 1px dashed var(--border-dim);
    border-radius: var(--r-sm);
    margin: auto 0;
}

.char-card .dead {
    color: var(--danger-bright);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
}

.char-card .spirit-info {
    font-size: 10px;
    color: var(--ice);
    background: rgba(20, 40, 60, 0.55);
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
    border: 1px solid rgba(122, 192, 232, 0.25);
}

.active-turn-tag {
    display: none;
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, var(--gold-bright), #a8854a);
    color: #0a0e18;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 14px;
    letter-spacing: 1.5px;
    border-radius: 10px;
    box-shadow: 0 3px 14px var(--gold-glow);
    z-index: 20;
    white-space: nowrap;
}

body.theme-light .active-turn-tag {
    color: #ffffff;
}

body.ui-old .active-turn-tag {
    background: linear-gradient(135deg, #f0c060, #d09020);
    color: #0a0e15;
    box-shadow: 0 2px 12px rgba(240, 192, 96, 0.5);
}

.char-card.active-turn .active-turn-tag { display: block; }

.char-card .corner-tag {
    position: absolute;
    bottom: 5px;
    right: 6px;
    font-size: 9px;
    color: var(--text-muted);
    background: var(--sub-bg-1);
    border: 1px solid var(--border-dim);
    padding: 1px 8px;
    border-radius: 10px;
}

.char-card .ult-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 10px;
    opacity: 0;
    cursor: pointer;
    border: none;
    transition: opacity var(--t-smooth), transform var(--t-fast);
    min-width: 48px;
    text-align: center;
    z-index: 5;
    letter-spacing: 1px;
    font-family: inherit;
    box-shadow: 0 2px 10px var(--shadow-color);
}

.char-card .ult-badge.active {
    opacity: 1;
    animation: ultReady 2s infinite;
}

@keyframes ultReady {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); box-shadow: 0 0 20px var(--gold-glow), 0 2px 10px var(--shadow-color); }
}

.char-card.huanle-upgraded::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--r-md);
    pointer-events: none;
    box-shadow: inset 0 0 22px rgba(255, 60, 60, 0.55), inset 0 0 44px rgba(255, 60, 60, 0.22);
    z-index: 1;
}

.char-card.flash-glow {
    animation: flashGlow 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@keyframes flashGlow {
    0% { box-shadow: 0 0 0 transparent, inset 0 0 0 transparent; }
    30% { box-shadow: 0 0 22px var(--gold-glow), inset 0 0 12px rgba(232, 200, 128, 0.2); }
    100% { box-shadow: 0 0 0 transparent, inset 0 0 0 transparent; }
}

/* ============================================================
   日志
   ============================================================ */
#logPanel {
    background: linear-gradient(180deg, var(--panel-bg-mid-1), var(--panel-bg-mid-2));
    border: 1px solid var(--border-dim);
    border-radius: var(--r-md);
    padding: 14px 16px;
    font-size: 11px;
    line-height: 1.65;
    position: relative;
    box-shadow: 0 2px 12px var(--shadow-color);
}

body.ui-new #logPanel {
    position: sticky;
    top: 14px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
}

body.ui-old #logPanel {
    max-height: calc(100vh - 220px);
    min-height: 400px;
    overflow-y: auto;
    position: sticky;
    top: 14px;
}

#logPanel::before {
    content: '';
    position: absolute;
    top: 20px; left: 0;
    width: 3px; height: 60px;
    background: linear-gradient(180deg, var(--gold), transparent);
    opacity: 0.75;
    border-radius: 0 2px 2px 0;
}

.log-title {
    font-weight: 600;
    color: var(--gold-bright);
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 1.5px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-dim);
}

#logPanel::-webkit-scrollbar { width: 6px; }
#logPanel::-webkit-scrollbar-track { background: transparent; }
#logPanel::-webkit-scrollbar-thumb {
    background: rgba(200, 168, 90, 0.35);
    border-radius: 3px;
}

#logPanel .log-entry {
    border-bottom: 1px solid var(--glow-inset-soft);
    padding: 3px 0;
    display: flex;
    gap: 6px;
}

#logPanel .log-entry .time {
    color: var(--text-dim);
    font-size: 9px;
    flex-shrink: 0;
    font-family: 'Consolas', 'Monaco', monospace;
}

/* ============================================================
   日志颜色（黑）
   ============================================================ */
.dmg-ice { color: #7ac0e8; }
.dmg-wind { color: #6ee0a0; }
.dmg-true { color: #f0a0c8; }
.dmg-enemy { color: #f06060; font-weight: 600; }
.dmg-fire { color: #f0a060; }
.dmg-physical { color: #d8d0c0; }
.dmg-imaginary { color: #e8c880; }
.heal { color: #6ee0a0; }
.buff { color: #8a9ac8; }
.special { color: #e8c880; font-weight: 600; }

/* 白天模式日志颜色 */
body.theme-light .dmg-ice { color: #3070a8; }
body.theme-light .dmg-wind { color: #208850; }
body.theme-light .dmg-true { color: #b05090; }
body.theme-light .dmg-enemy { color: #c03030; }
body.theme-light .dmg-fire { color: #c06030; }
body.theme-light .dmg-physical { color: #606060; }
body.theme-light .dmg-imaginary { color: #8a6a20; }
body.theme-light .heal { color: #208850; }
body.theme-light .buff { color: #4a5a8a; }
body.theme-light .special { color: #8a6a2a; }

.skill-use {
    color: var(--gold-text-on-accent);
    font-weight: 600;
    background: linear-gradient(90deg, var(--gold-glow), transparent);
    padding: 1px 8px;
    border-left: 2px solid var(--gold);
    border-radius: 4px;
}

body.theme-light .skill-use {
    color: #4a3a10;
}

.turn-start {
    color: var(--gold-bright);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-align: center;
    display: block;
    border-top: 1px solid var(--border-gold);
    border-bottom: 1px solid var(--border-gold);
    padding: 5px 0;
    margin: 5px 0;
    background: linear-gradient(90deg, transparent, var(--gold-glow), transparent);
    border-radius: 4px;
}

/* ============================================================
   弹窗
   ============================================================ */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--modal-mask);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
    background: linear-gradient(180deg, var(--panel-bg-1), var(--panel-bg-2));
    border: 1px solid var(--border-gold);
    border-radius: var(--r-lg);
    padding: 22px 24px;
    max-width: 500px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 0 70px var(--gold-glow), 0 20px 80px var(--shadow-deep);
    animation: modalIn 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal::before, .modal::after {
    content: '';
    position: absolute;
    left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    border-radius: 1px;
}
.modal::before { top: 0; }
.modal::after { bottom: 0; }

@keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal h2 {
    font-size: 18px;
    color: var(--gold-bright);
    margin-bottom: 16px;
    letter-spacing: 1.2px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-dim);
    text-shadow: 0 0 12px var(--gold-glow);
}

.modal .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--glow-inset-soft);
    font-size: 12px;
    min-height: 32px;
}

.modal .detail-row .label { color: var(--text-secondary); flex-shrink: 0; }

.modal .detail-row .value {
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    font-family: 'Consolas', 'Monaco', monospace;
}

.modal .section-title {
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    margin-top: 16px;
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border-dim);
}

.modal .lc-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--sub-bg-1);
    border: 1px solid var(--border-dim);
    border-radius: var(--r-sm);
}

.modal .lc-toggle label { color: var(--text-primary); font-size: 12px; }
.modal .lc-toggle input { transform: scale(1.3); margin-right: 4px; accent-color: var(--gold-bright); }
.modal .close-btn { margin-top: 18px; float: right; }

.modal .switch-btn {
    background: linear-gradient(180deg, var(--slot-bg-1), var(--slot-bg-2));
    border: 1px solid var(--border-mid);
    color: var(--text-primary);
    padding: 7px 16px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 12px;
    margin-top: 16px;
    transition: all var(--t-fast);
    font-family: inherit;
}

.modal .switch-btn:hover {
    border-color: var(--border-gold);
    color: var(--gold-bright);
    box-shadow: 0 0 16px var(--gold-glow);
    transform: translateY(-1px);
}

.editable-value {
    cursor: pointer;
    transition: color var(--t-fast);
    padding: 1px 4px;
    border-radius: 4px;
}
.editable-value:hover {
    color: var(--gold-bright) !important;
    background: var(--gold-glow);
}

.huanle-upgraded-text {
    border: 1px solid rgba(255, 64, 64, 0.65);
    border-radius: 8px;
    padding: 1px 8px;
    box-shadow: 0 0 8px rgba(255, 64, 64, 0.45);
    color: #ffdede !important;
}

.yinlang-burst-log {
    background: linear-gradient(90deg, var(--gold-glow), transparent);
    border-left: 2px solid var(--gold);
    border-radius: 4px;
}

/* ============================================================
   设置弹窗
   ============================================================ */
.settings-modal {
    max-width: 400px;
}

.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-dim);
}

.settings-header h2 {
    margin: 0;
    padding: 0;
    border: none;
    font-size: 17px;
}

.settings-close {
    background: transparent;
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: all var(--t-fast);
    display: flex;
    align-items: center;
    justify-content: center;
}

.settings-close:hover {
    background: rgba(216, 72, 72, 0.15);
    border-color: var(--danger-bright);
    color: var(--danger-bright);
}

.settings-body {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.setting-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.setting-label {
    color: var(--gold-bright);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.setting-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.setting-opt {
    flex: 1;
    min-width: 120px;
    background: linear-gradient(180deg, var(--slot-bg-1), var(--slot-bg-2));
    border: 1px solid var(--border-mid);
    color: var(--text-secondary);
    padding: 10px 14px;
    border-radius: var(--r-sm);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all var(--t-fast);
    font-family: inherit;
    text-align: center;
}

.setting-opt:hover {
    border-color: var(--border-gold);
    color: var(--gold-bright);
    box-shadow: 0 0 14px var(--gold-glow);
}

.setting-opt.active {
    background: linear-gradient(180deg, #5a4a26, #332a16);
    border-color: var(--border-gold-bright);
    color: var(--gold-bright);
    font-weight: 700;
    box-shadow: 0 0 20px var(--gold-glow), inset 0 0 10px var(--gold-glow);
}

.toggle-switch {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 10px 14px;
    border: 1px solid var(--border-dim);
    border-radius: var(--r-sm);
    background: var(--sub-bg-1);
    width: 100%;
    transition: all var(--t-fast);
}

.toggle-switch:hover {
    border-color: var(--border-mid);
}

.toggle-switch input {
    display: none;
}

.toggle-slider {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--avatar-bg-2);
    border: 1px solid var(--border-mid);
    border-radius: 12px;
    transition: all var(--t-smooth);
    flex-shrink: 0;
}

.toggle-slider::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: linear-gradient(180deg, var(--gold-bright), #a8854a);
    border-radius: 50%;
    transition: all var(--t-smooth);
    box-shadow: 0 2px 6px var(--shadow-color);
}

.toggle-switch input:checked + .toggle-slider {
    background: linear-gradient(180deg, #5a4a26, #332a16);
    border-color: var(--border-gold-bright);
}

.toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(20px);
}

.toggle-text {
    color: var(--text-primary);
    font-size: 12px;
    letter-spacing: 0.5px;
}

/* ============================================================
   战斗前/后
   ============================================================ */
.pre-battle .action-wrap,
.pre-battle .enemy-bar,
.pre-battle .control-area,
.pre-battle .dmg-stats,
.pre-battle #logPanel,
.pre-battle .round-info {
    display: none;
}

.pre-battle .battle-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "team";
}

.in-battle .roster-panel,
.in-battle .settings-row {
    display: none;
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 1100px) {
    body.ui-new .battle-layout {
        grid-template-columns: 76px minmax(0, 1fr) 260px;
    }
    body.ui-old .battle-layout {
        grid-template-columns: minmax(0, 1fr) 280px;
    }
}

@media (max-width: 900px) {
    body.ui-new .battle-layout,
    body.ui-old .battle-layout {
        grid-template-columns: 1fr;
        grid-template-areas:
            "action"
            "enemy"
            "team"
            "control"
            "dmg"
            "log";
    }
    body.ui-new .action-wrap {
        position: static;
        max-height: none;
    }
    body.ui-new .action-bar {
        flex-direction: row;
        overflow-x: auto;
        flex: none;
    }
    body.ui-new .action-slot {
        flex-direction: row;
        min-width: 96px;
        width: auto;
        padding: 5px 10px;
        gap: 8px;
        font-size: 10px;
    }
    body.ui-new .action-slot .avatar { width: 24px; height: 24px; font-size: 11px; }
    body.ui-new .rail-title { text-align: left; padding-left: 4px; margin-bottom: 4px; }
    body.ui-new .rail-round { text-align: left; padding-top: 6px; }
    body.ui-new #logPanel { max-height: 280px; position: static; }
    body.ui-old #logPanel { max-height: 280px; min-height: auto; position: static; }
    .team-panel { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 760px) {
    body { padding: 8px; }
    #app { padding: 14px; border-radius: 16px; }
    .header h1 { font-size: 16px; letter-spacing: 1.2px; }
    .team-panel { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .char-card { padding: 10px; }
    .char-card .char-name { font-size: 12px; padding-right: 52px; }
    .char-card .stats { font-size: 9px; }
    .char-card .ult-badge { font-size: 9px; padding: 3px 8px; min-width: 36px; }
    .modal { padding: 18px; }
    .modal h2 { font-size: 16px; }
    .control-area .info-badge {
        margin-left: 0;
        padding-left: 0;
        border-left: none;
        align-items: flex-start;
        flex-basis: 100%;
    }
    .settings-opt { min-width: 100px; }
}

@media (max-width: 500px) {
    body { padding: 4px; }
    #app { padding: 12px; border-radius: 14px; }
    .header h1 { font-size: 14px; }
    .btn { padding: 6px 12px; font-size: 11px; border-radius: 8px; }
    .team-panel { grid-template-columns: 1fr 1fr; gap: 6px; }
    .char-card { padding: 8px; }
    .char-card .char-name { font-size: 11px; padding-bottom: 3px; padding-right: 44px; }
    .char-card .stats { font-size: 8px; }
    .char-card .hp-bar, .char-card .energy-bar { height: 5px; }
    .char-card .ult-badge { font-size: 8px; padding: 2px 7px; min-width: 32px; top: 6px; right: 6px; }
    .char-card .corner-tag { font-size: 8px; padding: 1px 6px; }
    .active-turn-tag { font-size: 8px; padding: 1px 10px; top: -8px; }
    .settings-row { padding: 8px 12px; }
    .roster-panel { padding: 8px 12px; }
    .action-slot { min-width: 64px; padding: 4px 8px; font-size: 8px; gap: 5px; }
    .action-slot .avatar { width: 18px; height: 18px; font-size: 9px; }
    .enemy-item { min-width: 90px; padding: 6px; }
    .enemy-item .name { font-size: 10px; }
    .enemy-item .hp-text { font-size: 8px; }
    .control-area { padding: 10px 12px; }
    .control-area .skill-buttons .btn { font-size: 10px; padding: 5px 11px; }
    .dmg-stats { padding: 10px 12px; }
    .dmg-stats .total { font-size: 12px; }
    .dmg-stats .row { font-size: 9px; }
    #logPanel { padding: 10px 12px; font-size: 9px; max-height: 240px; }
    .modal { padding: 16px; border-radius: 12px; }
    .modal h2 { font-size: 14px; }
}

<script>
    // ★ 所有初始化都等到页面完全加载后执行（保证打包 JS 已定义所有函数）
    window.addEventListener('load', function() {
        // ---- 设置相关：主题 / UI 模式 ----
        window.__uiMode = localStorage.getItem('bst_uiMode') || 'new';
        window.__themeMode = localStorage.getItem('bst_themeMode') || 'dark';

        window.applyUiMode = function() {
            document.body.classList.remove('ui-new', 'ui-old');
            document.body.classList.add('ui-' + window.__uiMode);
            document.querySelectorAll('.setting-opt[data-ui]').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-ui') === window.__uiMode);
            });
        };

        window.applyTheme = function() {
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add('theme-' + window.__themeMode);
            var t = document.getElementById('darkModeToggle');
            if (t) t.checked = (window.__themeMode === 'dark');
            var txt = document.getElementById('toggleText');
            if (txt) txt.textContent = (window.__themeMode === 'dark') ? '开启（默认）' : '关闭（白天）';
        };

        window.openSettings = function() {
            document.getElementById('settingsOverlay').classList.add('show');
        };
        window.closeSettings = function() {
            document.getElementById('settingsOverlay').classList.remove('show');
        };

        var settingsOverlay = document.getElementById('settingsOverlay');
        if (settingsOverlay) {
            settingsOverlay.addEventListener('click', function(e) {
                if (e.target === this) window.closeSettings();
            });
        }

        document.querySelectorAll('.setting-opt[data-ui]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                window.__uiMode = btn.getAttribute('data-ui');
                localStorage.setItem('bst_uiMode', window.__uiMode);
                window.applyUiMode();
                if (typeof renderAll === 'function') renderAll();
            });
        });

        var darkToggle = document.getElementById('darkModeToggle');
        if (darkToggle) {
            darkToggle.addEventListener('change', function() {
                window.__themeMode = this.checked ? 'dark' : 'light';
                localStorage.setItem('bst_themeMode', window.__themeMode);
                window.applyTheme();
            });
        }

        window.applyUiMode();
        window.applyTheme();

        // ---- 游戏初始化 ----
        if (typeof initHuanleFields === 'function') initHuanleFields();
        if (typeof ensureFireElementSupport === 'function') ensureFireElementSupport();
        if (typeof renderAll === 'function') renderAll();

        if (typeof addLog === 'function') {
            addLog('系统', ' 点击角色池加入编队 (4人)，然后「开始战斗」');
            addLog('系统', ' 点击角色卡片可查看并修改属性（战斗外）');
            addLog('系统', ' 战斗中点击敌人卡片可查看减益');
            addLog('系统', ' 欢愉角色将在战斗中召唤阿哈时刻');
        }
    });
</script>

// ============================================================
// 全局游戏状态 G —— 整个模拟器的核心数据中心
// ============================================================
let G = {
    team: [null, null, null, null],
    fighters: [],
    enemies: [],
    battleActive: false,
    battleStarted: false,
    round: 0,
    roundMaxAV: 300,

        av: 0,
        xiaodian: 0,
        scheduledNewXiaodian: 0
    },
    goodShowList: [],
    pendingExtraAha: [],
    huohuaTrapInProgress: false,
    yaoguangField: null,
    yaoguangPenetration: null,
    yaoguangShangshangqian: null,
    ahaMomentInProgress: false,
    yinlangInvincibleField: null
};

// ============================================================
// 额外属性系统（可持久化到 localStorage）
// ============================================================
const DEFAULT_BONUS_STATS = {
    hp: 0, atk: 0, def: 0, spd: 0,
    critRate: 0, critDmg: 0,
    elemIce: 0, elemWind: 0, elemOther: 0,
    elemFire: 0, elemPhysical: 0, elemImaginary: 0,
    huanleDu: 0,
    energyRecharge: 0
};

function loadBonusStats() {
    const saved = localStorage.getItem('memoryTeam_bonusStats');
    if (saved) {
        try { return JSON.parse(saved); } catch(e) { console.warn('bonusStats解析失败'); }
    }
    return {};
}

function saveBonusStats() {
    localStorage.setItem('memoryTeam_bonusStats', JSON.stringify(bonusStats));
}

function getBonusStats(charId) {
    if (!bonusStats[charId]) {
        bonusStats[charId] = { ...DEFAULT_BONUS_STATS };
    }
    for (const key in DEFAULT_BONUS_STATS) {
        if (bonusStats[charId][key] === undefined) {
            bonusStats[charId][key] = DEFAULT_BONUS_STATS[key];
        }
    }
    return bonusStats[charId];
}

function setBonusStat(charId, key, value) {
    const bs = getBonusStats(charId);
    bs[key] = value;
    saveBonusStats();
}

function resetBonusStat(charId, key) {
    const bs = getBonusStats(charId);
    bs[key] = 0;
    saveBonusStats();
}

let bonusStats = loadBonusStats();

// ============================================================
// 工具函数
// ============================================================
function getAliveEnemies() { return G.enemies.filter(e => e.alive); }
function getAliveAllies() { return G.fighters.filter(f => f.alive); }
function getAllyById(id) { return G.fighters.find(f => f.charId === id); }
function getEnemyById(id) { return G.enemies.find(e => e.id === id); }
function getRandomAliveEnemy() { const a = getAliveEnemies(); return a.length ? a[Math.floor(Math.random() * a.length)] : null; }
function getCurrentFighter() {
    if (!G.actionQueue.length || G.currentActionIdx >= G.actionQueue.length) return null;
    const e = G.actionQueue[G.currentActionIdx];
    if (!e || e.type === 'enemy') return null;
    const f = G.fighters.find(f => f.charId === e.charId);
    return (f && f.alive) ? f : null;
}
function addLog(type, text, cls = '') {
    G.log.push({ time: new Date().toLocaleTimeString(), text, type: cls });
    if (G.log.length > 200) G.log.shift();
    renderLog();
}
function calcActionValue(spd) { return 10000 / spd; }

function getEnergyRechargeBonus(fighter) {
    // 特殊能量角色不吃充能效率
    if (fighter && (fighter.charId === 'xilian' || fighter.charId === 'yinlang')) {
        return 0;
    }

    if (!fighter) {
        const cf = getCurrentFighter();
        if (cf && cf.alive) fighter = cf;
    }

    let bonus = 0;
    const q = getAllyById('qingge');
    if (q && q.alive && q.spirit && q.spirit.alive) {
        bonus += 0.10;
    }

    if (fighter && fighter.alive) {
        const bs = getBonusStats(fighter.charId);
        const extraRecharge = bs.energyRecharge || 0;
        bonus += extraRecharge / 100;

        if (fighter.charId === 'yaoguang' && fighter.hasLC && G.yaoguangShangshangqian && G.yaoguangShangshangqian > 0) {
            bonus += 0.12;
        }
    }

    return bonus;
}

function recordDamage(src, amt) {
    if (!src || amt <= 0) return;
    G.damageStats.total += amt;
    G.damageStats.bySource[src] = (G.damageStats.bySource[src] || 0) + amt;
    renderDamageStats();
}
function renderDamageStats() {
    const t = G.damageStats.total;
    document.getElementById('totalDmgDisplay').textContent = t.toLocaleString();
    const c = document.getElementById('dmgBreakdown');
    const s = Object.entries(G.damageStats.bySource).sort((a, b) => b[1] - a[1]);
    let h = '';
    s.forEach(([n, d]) => {
        const p = t > 0 ? (d / t * 100) : 0;
        h += `<span class="item">${n}: ${d.toLocaleString()} <span style="color:#ffd966;">${p.toFixed(1)}%</span></span>`;
    });
    c.innerHTML = h || '<span style="color:#667799;">暂无伤害数据</span>';
}
function resetDamageStats() { G.damageStats = { total: 0, bySource: {} }; renderDamageStats(); }
function getDamageColor(el) {
    if (el === '冰') return 'dmg-ice';
    if (el === '风') return 'dmg-wind';
    if (el === '火') return 'dmg-fire';
    if (el === '物理') return 'dmg-physical';
    if (el === '虚数') return 'dmg-imaginary';
    return '';
}

// ============================================================
// ★ 属性实时更新：计算角色当前有效属性
// 战斗中buff直接加到角色实时字段上
// ============================================================
function updateFighterStats(f) {
    if (!f || !f.alive) return;

    let cr = f.baseCritRate || 0.05;
    let cd = f.baseCritDmg || 0.50;
    let atk = f.baseAtk || f.atk;
    let elemIce = f.baseElemIce || 0;
    let elemWind = f.baseElemWind || 0;
    let elemOther = f.baseElemOther || 0;
    let elemFire = f.baseElemFire || 0;
    let elemPhysical = f.baseElemPhysical || 0;
    let elemImaginary = f.baseElemImaginary || 0;

    if (f.charId === 'fengjin') cr = Math.min(cr + 1.0, 1.0);
    if (G.fieldEffects.xilianUlt) cr = Math.min(cr + 0.50, 1.0);
    if (f.charId === 'changye') cr = Math.min(cr + 0.35, 1.0);
    if (f.charId === 'qingge') cr = Math.min(cr + 0.50, 1.0);

    if (f.charId === 'changye') {
        if (G.fieldEffects.changyeTalentCD) cd += 0.60;
        if (G.fieldEffects.changyeTrace2CD) cd += 0.15;
        if (G.fieldEffects.xilianMoonBuff) cd += (f.baseCritDmgRecord || 0.50) * 0.12;
    }
    if (G.fieldEffects.xilianPoem) cd += 0.16;
    if (G.fieldEffects.xilianBlank && G.fieldEffects.xilianPoem) cd += 0.16 * 0.60;

    // 上上签全队暴击爆伤
    if (G.yaoguangShangshangqian && G.yaoguangShangshangqian > 0) {
        cr = Math.min(cr + 0.10, 1.0);
        cd += 0.30;
    }

    const xl = getAllyById('xilian');
    if (xl && xl.alive && xl.spd >= 180) {
        elemIce += 20; elemWind += 20; elemOther += 20; elemFire += 20; elemPhysical += 20; elemImaginary += 20;
    }
    if (G.fieldEffects.xilianUlt) {
        elemIce += 50; elemWind += 50; elemOther += 50; elemFire += 50; elemPhysical += 50; elemImaginary += 50;
    }
    if (G.qinggeFeverActive && f.charId === 'qingge') {
        const bonus = 60 + G.qinggeAtmosphere * 2;
        elemIce += bonus; elemWind += bonus; elemOther += bonus; elemFire += bonus; elemPhysical += bonus; elemImaginary += bonus;
    }
    if (f.charId === 'changye' && G.changyeInDarkMystery) {
        elemIce += 60; elemWind += 60; elemOther += 60; elemFire += 60; elemPhysical += 60; elemImaginary += 60;
    }

    if (f.buffs) {
        if (f.buffs.deviationAtk) atk += f.buffs.deviationAtk.value || 0;
        if (f.buffs.deviationCd) cd += f.buffs.deviationCd.value || 0;
    }
    
    // 火花行迹2：根据当前笑点给全队暴击伤害加成，每1笑点+8%，最多80%
    const huohuaForCd = getAllyById('huohua');
    if (huohuaForCd && huohuaForCd.alive) {
        const xd = G.ahaMoment ? (G.ahaMoment.xiaodian || 0) : 0;
        const cdBuff = Math.min(xd * 8, 80) / 100;
        cd += cdBuff;
    }

    // 同步充能效率显示值（实时）
    f.energyRecharge = 100 + Math.round(getEnergyRechargeBonus(f) * 100);

    f.critRate = cr;
    f.critDmg = cd;
    f.atk = atk;
    f.elemIce = elemIce;
    f.elemWind = elemWind;
    f.elemOther = elemOther;
    f.elemFire = elemFire;
    f.elemPhysical = elemPhysical;
    f.elemImaginary = elemImaginary;

    if (f.spirit && f.spirit.alive) {
        f.spirit.atk = atk;
        f.spirit.def = f.def;
        f.spirit.critRate = cr;
        f.spirit.critDmg = cd + (f.buffs && f.buffs.changyeSkill ? f.buffs.changyeSkill.critDmgBonus || 0 : 0);
        f.spirit.elemIce = elemIce;
        f.spirit.elemWind = elemWind;
        f.spirit.elemOther = elemOther;
        f.spirit.elemFire = elemFire;
        f.spirit.elemPhysical = elemPhysical;
        f.spirit.elemImaginary = elemImaginary;
    }
}

function addQinggeAtmosphere(amount, sourceFighter) {
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive) return;
    const oldAtmo = G.qinggeAtmosphere;
    G.qinggeAtmosphere = Math.min(oldAtmo + amount, 50);
    const gained = G.qinggeAtmosphere - oldAtmo;
    if (gained <= 0) return;

    if (G.qinggeRhythm > 0) {
        G.qinggeRhythm--;
        qg.energy = Math.min(qg.energy + 3, qg.maxEnergy);
    }

    if (sourceFighter && sourceFighter.alive && sourceFighter.charId !== 'qingge') {
        applyDeviationBuff(sourceFighter);
    }

    const spirit = qg.spirit;
    if (spirit && spirit.alive) {
        if (spirit.birdCount === 1 && G.qinggeAtmosphere >= 6) {
            spirit.birdCount = 2;
            updateGeshouDebuff();
            addLog('系统', '啾米加入！晴空乐手强化');
        }
        if (spirit.birdCount === 2 && G.qinggeAtmosphere >= 12) {
            spirit.birdCount = 3;
            G.qinggeFeverActive = true;
            spirit.spd = Math.round(qg.baseSpdRecord * 1.80);
            spirit.av = calcActionValue(spirit.spd);
            const curEntry = G.actionQueue[G.currentActionIdx];
            const baseAv = curEntry ? curEntry.av : qg.av;
            G.qinggeCountdownAv = baseAv + calcActionValue(140);
            updateGeshouDebuff();
            addLog('系统', '派丁加入！全员登台，进入 Fever 状态！', 'special');
        }
    }
}

function applyDeviationBuff(fighter) {
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive) return;

    if (fighter.atk > qg.atk) {
        const atkBonus = Math.round(qg.baseHp * (16 + G.qinggeAtmosphere * 0.4) / 100);
        fighter.buffs = fighter.buffs || {};
        fighter.buffs.deviationAtk = { desc: '攻击力+' + atkBonus, duration: 2, value: atkBonus };
        addLog('系统', '偏离和弦：' + fighter.name + ' 攻击力+' + atkBonus, 'buff');
    } else {
        const cdBonus = (40 + G.qinggeAtmosphere * 1.5) / 100;
        fighter.buffs = fighter.buffs || {};
        fighter.buffs.deviationCd = { desc: '暴击伤害+' + Math.round(cdBonus * 100) + '%', duration: 2, value: cdBonus };
        addLog('系统', '偏离和弦：' + fighter.name + ' 暴击伤害+' + Math.round(cdBonus * 100) + '%', 'buff');
    }
    updateFighterStats(fighter);
}

function onAllyAttack(attacker) {
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive) return;
    addQinggeAtmosphere(1, attacker);
    if (G.qinggeInvitedGuest === attacker.charId) {
        addQinggeAtmosphere(2, attacker);
    }
}

function onAllyHealOrShield(sourceFighter) {
    addQinggeAtmosphere(1, sourceFighter);
}

function updateGeshouDebuff() {
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive || !qg.spirit || !qg.spirit.alive) {
        G.enemies.forEach(e => { e.debuff_geshou = 0; });
        return;
    }
    const count = qg.spirit.birdCount || 0;
    let value = 0;
    if (count === 1) value = 8;
    else if (count === 2) value = 12;
    else if (count >= 3) value = 16;
    G.enemies.forEach(e => { e.debuff_geshou = value; });
}

function updateZhianDebuff() {
    const value = G.changyeInDarkMystery ? 30 : 0;
    G.enemies.forEach(e => { e.debuff_zhian = value; });
}

// 获取角色实际基础面板（本体 + 光锥 + 额外属性）
// ============================================================
function getCharBaseStats(charId, slotIdx) {
    const bs = BASE_STATS[charId];
    const lc = LIGHTCONE_STATS[charId];
    const equipped = G_LC_EQUIPPED[slotIdx];
    const bonus = getBonusStats(charId);

    const whiteHp = bs.baseHp + (equipped ? lc.hp : 0);
    const whiteAtk = bs.baseAtk + (equipped ? lc.atk : 0);
    const whiteDef = bs.baseDef + (equipped ? lc.def : 0);
    const whiteSpd = bs.baseSpd;

    const lockedSpdBonus = whiteSpd === 0 ? 0 : (bonus.spd || 0);

    return {
        baseHp: whiteHp + (bonus.hp || 0),
        baseAtk: whiteAtk + (bonus.atk || 0),
        baseDef: whiteDef + (bonus.def || 0),
        baseSpd: whiteSpd === 0 ? 0 : whiteSpd + lockedSpdBonus,

        whiteHp: whiteHp,
        whiteAtk: whiteAtk,
        whiteDef: whiteDef,
        whiteSpd: whiteSpd,

        bonusHp: bonus.hp || 0,
        bonusAtk: bonus.atk || 0,
        bonusDef: bonus.def || 0,
        bonusSpd: lockedSpdBonus,

        baseCritRate: bs.baseCritRate + (bonus.critRate || 0) / 100,
        baseCritDmg: bs.baseCritDmg + (bonus.critDmg || 0) / 100,

        elemIce: bonus.elemIce || 0,
        elemWind: bonus.elemWind || 0,
        elemOther: bonus.elemOther || 0,
        elemFire: bonus.elemFire || 0,
        elemPhysical: bonus.elemPhysical || 0,
        huanleDu: bonus.huanleDu || 0,
        energyRechargeBonus: bonus.energyRecharge || 0,
        energyRecharge: 100 + (bonus.energyRecharge || 0),
    };
}

// 字段说明：
// hp     = 最大生命值
// def    = 防御力（用于减伤公式）
// spd    = 速度（决定行动值间隔）
