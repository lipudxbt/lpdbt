/* ==================== js/03_damage.js ==================== */
// ============================================================
// 伤害计算公式（含属性实时刷新）
// ============================================================

function calcDamage(attacker, defender, baseDmg, element, sourceLabel, isSpirit = false) {
    // ★ 伤害计算前刷新攻击者当前属性
    updateFighterStats(attacker);

    // 1. 防御区
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);

    // 2. 抗性区
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    const resistMulti = 1 - resist;

    // 3. 属性增伤区（实时读取已刷新的字段）
    let dmgBonus = 1;
    if (element === '冰') dmgBonus += (attacker.elemIce || 0) / 100;
    else if (element === '风') dmgBonus += (attacker.elemWind || 0) / 100;
    else dmgBonus += (attacker.elemOther || 0) / 100;

    // 长夜月至暗之谜期间自身与忆灵增伤
    if (attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    if (isSpirit && attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;

    // 水母在场时长夜月+水母增伤
    const cy = getAllyById('changye');
    if (cy && cy.alive && cy.spirit && cy.spirit.alive && (attacker.charId === 'changye' || (isSpirit && attacker.charId === 'changye'))) {
        dmgBonus += 0.50;
    }

    // 4. 暴击区（实时读取已刷新的字段）
    let cr = attacker.critRate || 0.05;
    let cd = attacker.critDmg || 0.50;

    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;

    // 5. 基础伤害
    let finalDmg = baseDmg * defMulti * resistMulti * dmgBonus * critMulti;

    // 6. 易伤区（敌方身上）
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    finalDmg *= vulnMulti;

    finalDmg = Math.round(finalDmg);

    // 7. 真实伤害（昔涟结界24%）
    let tX = 0;
    if (G.fieldEffects.xilianField) tX = Math.round(finalDmg * 0.24);
    finalDmg += tX;

    if (sourceLabel && finalDmg > 0) recordDamage(sourceLabel, finalDmg);
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian: tX };
}

// ============================================================
// 召唤忆灵 & 忆灵自动行动
// ★ 忆灵攻击 2 秒停顿
// ★ 忆灵普攻后忆质 >= 16：立即自爆（清过渡状态允许点击）
// ★ 力拉条 av = -1（绝对优先）
// ============================================================

function summonSpirit(fighter) {
    const cd = CHAR_DATA[fighter.charId];
    if (!cd.spirit) return;
    const isFirst = !fighter.spirit || !fighter.spirit.alive;

    if (fighter.charId === 'qingge') {
        const maxHp = Math.round(fighter.baseHp * 0.70);
        fighter.spirit = {
            name: '晴空乐手', label: '晴空乐手',
            hp: maxHp, maxHp: maxHp, alive: true,
            spd: 0, av: 99999,
            isFirstSummon: isFirst,
            birdCount: 1, hasFuture: true
        };
        fighter.energy = Math.min(fighter.energy + 20, fighter.maxEnergy);
        updateGeshouDebuff();
        addLog('系统', '晴空乐手 贝茜登场！晴歌恢复20能量');
        return;
    }

    if (fighter.charId === 'changye') {
        const mx = Math.round(fighter.baseHp * 0.5);
        fighter.spirit = {
            name: '长夜', label: '长夜',
            hp: mx, maxHp: mx, alive: true,
            spd: 160, av: calcActionValue(160),
            isFirstSummon: isFirst,
            hasFuture: true
        };
        if (isFirst) {
            forceAdvanceSpirit(fighter, fighter.spirit);
            addLog('系统', '长夜水母首次召唤，行动提前100%', 'buff');
        }
        G.changyeWaterImmediateReady = true;
        G.fieldEffects.changyeBaseCritDmg = fighter.baseCritDmg || 0.50;
        return;
    }

    const mx = Math.round(fighter.baseHp * (cd.spirit.hpRatio || 0.5));
    const spd = cd.spirit.spd || 0;
    fighter.spirit = {
        name: cd.spirit.name, label: cd.spiritLabel || cd.spirit.name,
        hp: mx, maxHp: mx, alive: true,
        spd: spd, av: spd > 0 ? calcActionValue(spd) : 99999,
        isFirstSummon: isFirst,
        hasFuture: true
    };
    if (fighter.charId === 'fengjin') {
        const eg = Math.round(15 * (1 + getEnergyRechargeBonus()));
        fighter.energy = Math.min(fighter.energy + eg, fighter.maxEnergy);
        if (G.fengjinIsFirstSummon) {
            const ex = Math.round(30 * (1 + getEnergyRechargeBonus()));
            fighter.energy = Math.min(fighter.energy + ex, fighter.maxEnergy);
            G.fengjinIsFirstSummon = false;
        }
    }
    if (fighter.charId === 'xilian') {
        G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
        if (G.xilianStory >= 3) {
            G.xilianStory = 0;
            G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
        }
        G.fieldEffects.xilianBlank = true;
    }
}

// 忆灵 100% 拉条：av = -1，绝对优先
function forceAdvanceSpirit(ownerFighter, spiritObj) {
    if (!ownerFighter || !spiritObj || !spiritObj.alive) return;

    spiritObj.av = -1;

    if (G.actionQueue) {
        G.actionQueue.forEach(u => {
            if (u.type === 'ally' && u.charId === ownerFighter.charId && u.isSpirit) {
                u.av = spiritObj.av;
            }
        });
        G.actionQueue.sort((a, b) => a.av - b.av);
    }

    if (typeof forceRenderActionBar === 'function') forceRenderActionBar();
    if (typeof flashActionBarSlot === 'function') flashActionBarSlot(ownerFighter.charId);
    if (typeof flashCard === 'function') flashCard(ownerFighter.charId);
}

// 更新晴空乐手易伤
function updateGeshouDebuff() {
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive || !qg.spirit || !qg.spirit.alive) {
        G.enemies.forEach(e => { e.debuff_geshou = 0; });
        return;
    }
    const count = qg.spirit.birdCount || 0;
    let value = 0;
    if (count === 1) value = 8;
    else if (count === 2) value = 12;
    else if (count >= 3) value = 16;
    G.enemies.forEach(e => { e.debuff_geshou = value; });
}

// 更新至暗之谜易伤
function updateZhianDebuff() {
    const value = G.changyeInDarkMystery ? 30 : 0;
    G.enemies.forEach(e => { e.debuff_zhian = value; });
}

// ============================================================
// 忆灵自动行动
// ============================================================
function spiritAutoAction(entry) {
    const f = entry.fighter;
    if (!f || !f.alive || !f.spirit || !f.spirit.alive) {
        G.currentActionIdx++;
        G.processing = false;
        setTimeout(() => processNextAction(), 100);
        return;
    }
    const spiritName = f.spirit.name;

    const energyGain = Math.round(20 * (1 + getEnergyRechargeBonus()));
    f.energy = Math.min(f.energy + energyGain, f.maxEnergy);
    addLog('系统', spiritName + ' 行动，' + f.name + ' 恢复' + energyGain + '能量');

    if (f.spirit.hasFuture) {
        const xl = getAllyById('xilian');
        if (xl && xl.alive && xl.charId !== f.charId) {
            xl.zhuiYi = Math.min(xl.zhuiYi + 1, xl.maxEnergy);
            addLog('系统', '【未来】忆灵触发: ' + spiritName + ' 行动，昔涟追忆+1 (' + xl.zhuiYi + '/' + xl.maxEnergy + ')');
        }
    }

    function pauseAndContinue() {
        G.pauseUntil = Date.now() + 2000;
        G.pauseLabel = '忆灵攻击中...';
        const c = document.getElementById('skillButtons');
        if (c) c.innerHTML = '<span data-transition="1" style="color:#ffd966;font-size:13px;">忆灵攻击中...</span>';
        renderAll();
        setTimeout(() => {
            if (Date.now() >= G.pauseUntil - 50) {
                G.pauseUntil = 0;
                G.pauseLabel = null;
                renderAll();
                processNextAction();
            }
        }, 2100);
    }

    // 昔涟：德谬歌【花与箭的舞曲】
    if (f.charId === 'xilian') {
        addLog('系统', spiritName + ' 使用了【花与箭的舞曲】', 'skill-use');
        const en = getAliveEnemies();
        let td = 0, tq = 0, tx = 0;
        const dmg = f.spirit.maxHp * 0.60;
        en.forEach(e => {
            const r = calcDamage(f, e, dmg, '冰', spiritName, true);
            e.hp = Math.max(0, e.hp - r.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
            td += r.finalDmg; tq += r.trueDmgQingge; tx += r.trueDmgXilian;
        });
        addLog('战斗', spiritName + ' → 全体 ' + td + ' 总伤害', 'dmg-ice');
        if (tq > 0 || tx > 0) {
            let tl = '';
            if (tq > 0) tl += '晴歌真伤+' + tq + ' ';
            if (tx > 0) tl += '昔涟真伤+' + tx;
            addLog('系统', '   ✦ ' + tl, 'dmg-true');
        }
        // ★ 忆灵技施放：风堇 +2 层天空之诗（不给能量）
        const fj = getAllyById('fengjin');
        if (fj && fj.alive) {
            G.xilianSkyStacks = Math.min((G.xilianSkyStacks || 0) + 2, 4);
            G.fieldEffects.xilianSkyBuff = true;
            addLog('系统', '德谬歌施放忆灵技，风堇获得2层【献予天空之诗】', 'buff');
        }
        onAllyAttack(f);
        G.processing = false;
        pauseAndContinue();
        return;
    }

    // 晴歌：鸟攻击
    if (f.charId === 'qingge') {
        addLog('系统', spiritName + ' 使用了【叽叽啾啾四重奏】', 'skill-use');
        const en = getAliveEnemies();
        let td = 0, tq = 0, tx = 0;
        en.forEach(e => {
            const r = calcDamage(f, e, f.spirit.maxHp * 1.5, '风', spiritName, true);
            e.hp = Math.max(0, e.hp - r.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
            td += r.finalDmg; tq += r.trueDmgQingge; tx += r.trueDmgXilian;
        });
        addLog('战斗', spiritName + ' → 全体 ' + td + ' 总伤害', 'dmg-wind');
        if (tq > 0 || tx > 0) {
            let tl = '';
            if (tq > 0) tl += '晴歌真伤+' + tq + ' ';
            if (tx > 0) tl += '昔涟真伤+' + tx;
            addLog('系统', '   ✦ ' + tl, 'dmg-true');
        }
        onAllyAttack(f);
        advanceActionValue();
        G.processing = false;
        pauseAndContinue();
        return;
    }

    // 长夜月：水母
    if (f.charId === 'changye') {
        if ((f.yiZhi || 0) >= 16) {
            f.spirit.av = 999999;
            buildActionQueue();
            G.currentActionIdx = 0;
            G.pauseUntil = 0;
            G.pauseLabel = null;
            G.isTransitioning = false;
            addLog('系统', spiritName + ' 使用了【迷梦，流失，如露】(自爆待选目标)', 'skill-use');
            showEnemySelectionForSpirit(f, 'spiritBurst');
            G.processing = false;
            renderAll();
            return;
        }

        let tgt = G.lastAttackTarget ? getEnemyById(G.lastAttackTarget) : null;
        if (!tgt || !tgt.alive) tgt = getRandomAliveEnemy();
        if (tgt) {
            addLog('系统', spiritName + ' 使用了【追忆，蹁跹，如雨】', 'skill-use');
            const ex = Math.floor((f.yiZhi || 0) / 4) * 0.1;
            const r = calcDamage(f, tgt, f.baseHp * 0.5 * (1 + ex), '冰', spiritName, true);
            tgt.hp = Math.max(0, tgt.hp - r.finalDmg);
            if (tgt.hp <= 0) { tgt.alive = false; addLog('系统', tgt.name + ' 被击败!'); }
            addLog('战斗', spiritName + ' → ' + tgt.name + ' ' + r.finalDmg + '总伤害', 'dmg-ice');
            if (r.trueDmgQingge > 0 || r.trueDmgXilian > 0) {
                let tl = '';
                if (r.trueDmgQingge > 0) tl += '晴歌真伤+' + r.trueDmgQingge + ' ';
                if (r.trueDmgXilian > 0) tl += '昔涟真伤+' + r.trueDmgXilian;
                addLog('系统', '   ✦ ' + tl, 'dmg-true');
            }
            G.lastAttackTarget = tgt.id;
            addYiZhiToChangye(1, '忆灵普攻');
            triggerChangyeSkillCast(f, '忆灵普攻');
        }

        if ((f.yiZhi || 0) >= 16) {
            f.spirit.av = 999999;
            buildActionQueue();
            G.currentActionIdx = 0;
            G.pauseUntil = 0;
            G.pauseLabel = null;
            G.isTransitioning = false;
            addLog('系统', spiritName + ' 使用了【迷梦，流失，如露】(自爆待选目标)', 'skill-use');
            showEnemySelectionForSpirit(f, 'spiritBurst');
            G.processing = false;
            renderAll();
            return;
        }

        onAllyAttack(f);
        advanceActionValue();
        G.processing = false;
        pauseAndContinue();
        return;
    }

    G.currentActionIdx++;
    G.processing = false;
    setTimeout(() => processNextAction(), 100);
}

// ===== js/zhandou/04b_xingdong.js =====
// 行动队列：构建、推进、轮次切换
// 修复：额外回合条目（extra: true）不推进、不写回真实 av

function buildActionQueue() {
    const u = [];

    G.fighters.forEach(f => {
        if (!f.alive) return;

        if (f.charId === 'qingge' && G.qinggeFeverActive) {
            if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
                u.push({
                    type: 'ally', charId: f.charId, name: f.spirit.name,
                    avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                    fighter: f, isSpirit: true, extra: false
                });
            }
            return;
        }

        u.push({
            type: 'ally', charId: f.charId, name: f.name,
            avatar: f.avatar, spd: f.spd, av: f.av,
            fighter: f, isSpirit: false, extra: false
        });

        if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
            u.push({
                type: 'ally', charId: f.charId, name: f.spirit.name,
                avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                fighter: f, isSpirit: true, extra: false
            });
        }
    });

    G.enemies.forEach(e => {
        if (e.alive) {
            u.push({
                type: 'enemy', enemyId: e.id, name: e.name,
                avatar: 'enemy', spd: e.spd, av: e.av,
                enemy: e, extra: false
            });
        }
    });

    if (G.qinggeFeverActive) {
        u.push({
            type: 'countdown', charId: 'qingge_countdown', name: '倒计时',
            avatar: 'spirit', spd: 140, av: G.qinggeCountdownAv || 0, extra: false
        });
    }

    if (G.extraTurns.length) {
        const seen = new Set();
        G.extraTurns = G.extraTurns.filter(e => {
            const key = e.charId + (e.isSpirit ? '_spirit' : '');
            if (seen.has(key)) return false;
            seen.add(key);
            return e.fighter && e.fighter.alive && (!e.isSpirit || (e.fighter.spirit && e.fighter.spirit.alive));
        });
        G.extraTurns.forEach(e => {
            u.push({
                type: 'ally', charId: e.charId, name: e.name + ' ⭐',
                avatar: e.avatar || 'spirit', spd: 9999, av: 0,
                fighter: e.fighter, isSpirit: e.isSpirit || false, extra: true
            });
        });
        G.extraTurns = [];
    }

    u.sort((a, b) => a.av - b.av);
    G.actionQueue = u;
    G.currentActionIdx = 0;
}

function advanceActionValue() {
    const cur = G.actionQueue[G.currentActionIdx];
    if (!cur) return;

    // ★ 关键修复：额外回合条目一次性消耗，不推进、不写回真实 av
    //   防止 av=0 + interval(9999) ≈ 1 覆盖真实忆灵进度，导致忆灵连动
    if (cur.extra === true) {
        G.actionQueue.splice(G.currentActionIdx, 1);
        if (G.currentActionIdx >= G.actionQueue.length) G.currentActionIdx = 0;
        return;
    }

    if (cur.type === 'ally' && cur.fighter) {
        const spd = cur.isSpirit ? cur.fighter.spirit.spd : cur.fighter.spd;
        cur.av += calcActionValue(spd);
        if (cur.isSpirit && cur.fighter.spirit) cur.fighter.spirit.av = cur.av;
        else cur.fighter.av = cur.av;
    } else if (cur.type === 'enemy' && cur.enemy) {
        cur.av += calcActionValue(cur.enemy.spd);
        cur.enemy.av = cur.av;
    } else if (cur.type === 'countdown') {
        cur.av += calcActionValue(cur.spd);
        G.qinggeCountdownAv = cur.av;
        handleQinggeCountdown();
    }

    G.actionQueue.sort((a, b) => a.av - b.av);
    const idx = G.actionQueue.findIndex(u => u === cur ||
        (u.type === 'ally' && u.charId === cur.charId && u.isSpirit === cur.isSpirit) ||
        (u.type === 'enemy' && u.enemyId === cur.enemyId) ||
        (u.type === 'countdown' && cur.type === 'countdown'));
    G.currentActionIdx = idx !== -1 ? idx : 0;

    // 轮次切换：用 G.globalAv（全局时钟）
    const gav = (typeof G.globalAv === 'number' && !isNaN(G.globalAv)) ? G.globalAv : 0;
    while (gav - G.roundStartAV >= G.roundMaxAV) {
        G.roundStartAV += G.roundMaxAV;
        G.round++;
        if (G.round === 1) G.roundMaxAV = 150;
        addLog('系统', '🔄 进入第 ' + (G.round + 1) + ' 轮！(' + G.roundMaxAV + '行动值)', 'special');
    }
}

function handleQinggeCountdown() {
    if (!G.qinggeFeverActive) return;
    const qg = getAllyById('qingge');
    if (!qg || !qg.alive) return;

    const current = G.qinggeAtmosphere;
    const deduction = Math.max(12, Math.floor(current * 0.5));
    G.qinggeAtmosphere = Math.max(0, G.qinggeAtmosphere - deduction);
    addLog('系统', '⏳ 倒计时：气氛值 -' + deduction + ' (' + current + '→' + G.qinggeAtmosphere + '/50)', 'special');

    if (G.qinggeAtmosphere <= 0) {
        if (qg.spirit) {
            qg.spirit.alive = false;
            addLog('系统', '🎼 气氛值归零，晴空乐手消失！', 'special');
        }
        G.qinggeFeverActive = false;
        const advance = calcActionValue(qg.spd) * 0.5;
        qg.av = Math.max(0, qg.av - advance);
        addLog('系统', '🎵 晴歌行动提前50%（行动值减少' + Math.round(advance) + '）', 'buff');
    }
}

/* ==================== js/zhandou/04c_pugong.js ==================== */
// ============================================================
// 普攻 & 强化普攻
// ============================================================

function executeBasicWithTarget(fighter, target) {
    if (!G.battleActive || !fighter || !fighter.alive || !target || !target.alive) return;
    const cd = CHAR_DATA[fighter.charId];
    addLog('系统', `${fighter.name} 使用了【${cd.skills.basic.name}】`, 'skill-use');
    const r = calcDamage(fighter, target, fighter.baseHp * 0.5, fighter.element, fighter.label || fighter.name, false);
    target.hp = Math.max(0, target.hp - r.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', ` ${target.name} 被击败!`); }
    addLog('战斗', `${fighter.name} 普攻 → ${target.name} ${r.finalDmg}伤害`, getDamageColor(fighter.element));

    // 回战技点 + 回能
    G.sp = Math.min(G.sp + 1, G.maxSp);
    fighter.energy = Math.min(fighter.energy + Math.round(20 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);

    // ★ 所有角色攻击触发晴歌气氛值
    onAllyAttack(fighter);

    // 长夜月普攻
    if (fighter.charId === 'changye') {
        G.lastAttackTarget = target.id;
        addYiZhiToChangye(1, '普攻');
        triggerChangyeTrace1(fighter, '普攻');
        const cost = Math.max(1, Math.round(fighter.hp * 0.05));
        const oh = fighter.hp;
        fighter.hp = Math.max(1, fighter.hp - cost);
        if (fighter.hp < oh) { addYiZhiToChangye(2, '天赋扣血'); G.fieldEffects.changyeTalentCD = true; }
        G.fieldEffects.changyeTrace2CD = true;
        triggerAllFengjinPassives();
    }

    // 昔涟普攻
    if (fighter.charId === 'xilian' && !G.xilianInPastRipple) {
        fighter.zhuiYi = Math.min((fighter.zhuiYi || 0) + 1, 27);
    }
    if (fighter.charId === 'xilian') {
        giveFutureToAllies();
    }

    if (fighter.charId === 'fengjin' && G.fengjinInRain) triggerFengjinSpiritAttack(fighter);
    if (fighter.charId === 'fengjin') triggerFengjinLightConeDrain(fighter);

    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeEnhancedBasic(fighter) {
    if (!G.battleActive || !fighter || !fighter.alive || fighter.charId !== 'xilian' || !G.xilianInPastRipple) {
        addLog('系统', '❌ 无法使用强化普攻');
        return;
    }
    showEnemySelection(fighter, 'enhancedBasic');
}

function executeEnhancedBasicWithTarget(fighter, mainTarget) {
    if (!G.battleActive || !fighter || !fighter.alive || !mainTarget || !mainTarget.alive) return;
    addLog('系统', '昔涟 使用了【向着爱与明天♪】', 'skill-use');
    const en = getAliveEnemies();
    let td = 0, tq = 0, tx = 0;
    const r1 = calcDamage(fighter, mainTarget, fighter.baseHp * 0.30, '冰', '昔涟(强化)', false);
    mainTarget.hp = Math.max(0, mainTarget.hp - r1.finalDmg);
    if (mainTarget.hp <= 0) { mainTarget.alive = false; addLog('系统', ` ${mainTarget.name} 被击败!`); }
    td += r1.finalDmg; tq += r1.trueDmgQingge; tx += r1.trueDmgXilian;
    en.forEach(e => {
        if (!e.alive) return;
        const r2 = calcDamage(fighter, e, fighter.baseHp * 0.30, '冰', '昔涟(强化)', false);
        e.hp = Math.max(0, e.hp - r2.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', ` ${e.name} 被击败!`); }
        td += r2.finalDmg; tq += r2.trueDmgQingge; tx += r2.trueDmgXilian;
    });
    addLog('战斗', `昔涟(强化) → ${mainTarget.name}及全体 ${td} 总伤害`, 'dmg-ice');
    if (tq > 0 || tx > 0) {
        let tl = ''; if (tq > 0) tl += `晴歌真伤+${tq} `; if (tx > 0) tl += `昔涟真伤+${tx}`;
        addLog('系统', `   ✦ ${tl}`, 'dmg-true');
    }
    // ★ 攻击触发气氛值
    onAllyAttack(fighter);
    fighter.zhuiYi = Math.min((fighter.zhuiYi || 0) + 3, 27);
    giveFutureToAllies();
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

/* ==================== js/zhandou/04d_zhanji.js ==================== */
// ============================================================
// 战技：四个角色各自战技
// 长夜月战技：消耗自身生命，不消耗战技点，战技点为0时也可用
// ============================================================

function executeSkill(fighter, skillKey, targetId) {
    if (!G.battleActive || !fighter || !fighter.alive || skillKey !== 'skill') return;
    const cd = CHAR_DATA[fighter.charId];
    addLog('系统', fighter.name + ' 使用了【' + cd.skills.skill.name + '】', 'skill-use');

    // 晴歌战技：召唤/治疗晴空乐手+获得6气氛值
    if (fighter.charId === 'qingge') {
        if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
        G.sp--;
        renderAll();

        if (!fighter.spirit || !fighter.spirit.alive) {
            summonSpirit(fighter);
            addLog('系统', '晴空乐手 贝茜登场');
        } else {
            fighter.spirit.hp = fighter.spirit.maxHp;
            addLog('系统', '晴空乐手生命回复至' + fighter.spirit.maxHp);
        }
        addQinggeAtmosphere(6);
        addLog('系统', '战技获得6点气氛值 (' + G.qinggeAtmosphere + '/50)');

        fighter.energy = Math.min(fighter.energy + Math.round(30 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);
        advanceActionValue();
        G.processing = false;
        renderAll();
        setTimeout(() => processNextAction(), 300);
        return;
    }

    // 昔涟战技
    if (fighter.charId === 'xilian') {
        if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
        if (G.xilianInPastRipple) { addLog('系统', '往昔状态无法释放战技'); return; }
        G.sp--;
        renderAll();
        fighter.zhuiYi = Math.min((fighter.zhuiYi || 0) + 3, 27);
        G.fieldEffects.xilianField = { desc: '附加24%真实伤害', duration: 2 };
        giveFutureToAllies();
        advanceActionValue();
        G.processing = false;
        renderAll();
        setTimeout(() => processNextAction(), 300);
        return;
    }

    // 长夜月战技：消耗自身生命，不消耗战技点
    if (fighter.charId === 'changye') {
        // 先结算长夜月自己的行动值
        fighter.av += calcActionValue(fighter.spd);

        const cost = Math.max(1, Math.round(fighter.hp * 0.10));
        const oh = fighter.hp;
        fighter.hp = Math.max(1, fighter.hp - cost);
        if (fighter.hp < oh) {
            addYiZhiToChangye(2, '天赋扣血');
            G.fieldEffects.changyeTalentCD = true;
        }
        triggerAllFengjinPassives();

        if (!fighter.spirit || !fighter.spirit.alive) {
            summonSpirit(fighter);
        } else {
            fighter.spirit.hp = Math.min(fighter.spirit.maxHp, fighter.spirit.hp + Math.round(fighter.spirit.maxHp * 0.5));
        }

        const baseCd = fighter.baseCritDmg || 0.50;
        const mc = G.team.filter(id => id !== null).filter(id => CHAR_DATA[id] && CHAR_DATA[id].path === '记忆').length;
        const t3 = mc >= 4 ? 0.65 : mc === 3 ? 0.50 : mc === 2 ? 0.15 : 0.05;
        const critBonus = baseCd * 0.24 + t3;
        G.fighters.forEach(f => {
            if (f.spirit && f.spirit.alive) {
                f.buffs = f.buffs || {};
                f.buffs.changyeSkill = { desc: '忆灵暴伤+' + Math.round(critBonus * 100) + '%', duration: 2, critDmgBonus: critBonus };
            }
        });

        let yzGain = G.changyeInDarkMystery ? 14 : 2;
        if (G.changyeInDarkMystery) addLog('系统', '至暗之谜额外+12忆质');
        addYiZhiToChangye(yzGain, '战技');
        triggerChangyeTrace1(fighter, '战技');

        fighter.energy = Math.min(fighter.energy + Math.round(30 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);

        const cost2 = Math.max(1, Math.round(fighter.hp * 0.05));
        const oh2 = fighter.hp;
        fighter.hp = Math.max(1, fighter.hp - cost2);
        if (fighter.hp < oh2) {
            addYiZhiToChangye(2, '天赋扣血');
            G.fieldEffects.changyeTalentCD = true;
        }
        G.fieldEffects.changyeTrace2CD = true;
        triggerAllFengjinPassives();

        if (G.fieldEffects.xilianMoonBuff) addYiZhiToChangye(1, '献予岁月之诗');

        // 不调 advanceActionValue，直接重建队列（避免误推水母 av）
        buildActionQueue();
        G.currentActionIdx = 0;
        G.processing = false;
        renderAll();
        setTimeout(() => processNextAction(), 300);
        return;
    }

    // 风堇战技
    if (fighter.charId === 'fengjin') {
        if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
        G.sp--;
        renderAll();

        if (!fighter.spirit || !fighter.spirit.alive) {
            summonSpirit(fighter);
        }
        const hv = Math.round(fighter.baseHp * 0.08 + 160);
        let totalHeal = 0;
        G.fighters.forEach(f => {
            if (f.alive && f.charId !== 'fengjin') {
                if (typeof healWithRecord === 'function') { healWithRecord(f, hv); }
                else { f.hp = Math.min(f.maxHp, f.hp + hv); }
                totalHeal += hv;
            }
        });
        if (fighter.spirit) {
            fighter.spirit.hp = Math.min(fighter.spirit.maxHp, fighter.spirit.hp + Math.round(fighter.baseHp * 0.10 + 200));
        }
        G.fengjinCumulativeHeal += totalHeal;
        G.fengjinSpiritDmgStacks = Math.min((G.fengjinSpiritDmgStacks || 0) + 1, 3);
        fighter.energy = Math.min(fighter.energy + Math.round(30 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);
        if (G.fengjinInRain) triggerFengjinSpiritAttack(fighter);
        triggerFengjinLightConeDrain(fighter);
        if (G.xilianSkyStacks > 0) {
            G.xilianSkyStacks--;
            if (G.xilianSkyStacks <= 0) G.fieldEffects.xilianSkyBuff = null;
        }
        addLog('治疗', '风堇战技总治疗: +' + totalHeal, 'heal');
        onAllyHealOrShield();
        advanceActionValue();
        G.processing = false;
        renderAll();
        setTimeout(() => processNextAction(), 300);
    }
}

// ============================================================
// 终结技：四个角色的终结技

// ============================================================

function executeUlt(fighter) {
    if (!fighter || !fighter.alive) return;
    const cd = CHAR_DATA[fighter.charId];

    G.ultSelecting = G.ultSelecting || {};
    G.ultSelecting[fighter.charId] = true;

    if (fighter.charId === 'xilian') {
        const need = G.xilianIsFirstUlt ? 24 : 12;
        if ((fighter.zhuiYi || 0) < need) {
            G.isUltInterrupt = false;
            G.ultSelecting[fighter.charId] = false;
            return;
        }
        fighter.zhuiYi -= need;
        addLog('系统', fighter.name + ' 使用了【' + cd.skills.ultimate.name + '】', 'skill-use');

        if (G.xilianIsFirstUlt) {
            if (!fighter.spirit || !fighter.spirit.alive) summonSpirit(fighter);
            G.fighters.forEach(f => {
                if (f.alive && f.charId !== 'xilian') {
                    f.energy = f.maxEnergy;
                    addLog('系统', '昔涟激活 ' + f.name + ' 终结技!');
                }
            });
            G.xilianInPastRipple = true;
            fighter.inPastRipple = true;
            G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };
            G.fieldEffects.xilianField = { desc: '附加24%真实伤害', duration: 999 };
            G.xilianIsFirstUlt = false;
            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            fighter.zhuiYi = Math.min(fighter.zhuiYi + 12, 27);
            addLog('系统', '全队充能: 昔涟追忆+12 (' + fighter.zhuiYi + '/27)');
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        } else {
            if (!G.xilianInPastRipple) {
                G.xilianInPastRipple = true;
                fighter.inPastRipple = true;
                G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };
            }
            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        }
    }

    if (fighter.charId === 'qingge') {
        showQinggeUltTargetChoice(fighter);
        return;
    }
    if (fighter.charId === 'changye') {
        showEnemyUltChoice(fighter);
        return;
    }
    if (fighter.charId === 'fengjin') {
        showAllyUltChoice(fighter);
        return;
    }
}

function executeQinggeUlt(fighter, target) {

// ============================================================
// 水母自爆：迷梦，流失，如露
// ★ 清 pendingSpiritBurst 标记
// ★ 自爆后触发行迹1 + 天赋 + 行迹2
// ============================================================

function executeSpiritBurst(fighter, target) {
    // 清自爆待选标记
    G.pendingSpiritBurst = null;

    if (!fighter || !fighter.alive || !fighter.spirit || !fighter.spirit.alive) {
        addLog('系统', '无法自爆：忆灵不存在');
        return;
    }
    const yz = fighter.yiZhi || 0;
    if (yz < 16) {
        addLog('系统', '无法自爆：忆质不足 (' + yz + '/16)');
        return;
    }
    if (!target || !target.alive) {
        addLog('系统', '无法自爆：目标无效');
        return;
    }

    const spiritName = fighter.spirit.name;
    addLog('系统', spiritName + ' 使用了【迷梦，流失，如露】(主目标: ' + target.name + ')', 'skill-use');

    const en = getAliveEnemies();
    let td = 0, tq = 0, tx = 0;
    let burstBonus = 1;
    if (G.fieldEffects.xilianMoonBuff) burstBonus += 0.18;
    const bd = fighter.spirit.maxHp * 0.12 * burstBonus;

    en.forEach(e => {
        let d = e.id === target.id ? bd * yz : bd * yz * 0.5;
        const r = calcDamage(fighter, e, d, '冰', spiritName, true);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
        td += r.finalDmg; tq += r.trueDmgQingge; tx += r.trueDmgXilian;
    });
    addLog('战斗', spiritName + '自爆 -> ' + target.name + '及全体 ' + td + ' 总伤害', 'dmg-ice');
    if (tq > 0 || tx > 0) {
        let tl = '';
        if (tq > 0) tl += '晴歌真伤+' + tq + ' ';
        if (tx > 0) tl += '昔涟真伤+' + tx;
        addLog('系统', '   ✦ ' + tl, 'dmg-true');
    }

    onAllyAttack(fighter);

    // 清空忆质，水母消失
    fighter.yiZhi = 0;
    fighter.spirit.alive = false;

    // 回战技点（行迹1：忆灵自爆后 +1 战技点）
    G.sp = Math.min(G.sp + 1, G.maxSp);

    // 至暗之谜充能减少
    if (G.changyeInDarkMystery) {
        G.changyeDarkMysteryCharges--;
        if (G.changyeDarkMysteryCharges <= 0) {
            G.changyeInDarkMystery = false;
            G.fieldEffects.changyeUlt = null;
            updateZhianDebuff();
            addLog('系统', '至暗之谜充能耗尽，退出状态');
        }
    }

    triggerAllFengjinPassives();
    G.changyeWaterImmediateReady = true;
    G.isSpiritTurn = false;

    // 长夜月获得速度加成（忆灵天赋3）
    const yzForSpd = Math.min(yz, 40);
    const spdBonusPct = 10 + yzForSpd;
    const baseSpd = fighter.baseSpdRecord || fighter.spd;
    const oldSpd = fighter.spd;
    fighter.spd = Math.round(baseSpd * (1 + spdBonusPct / 100));
    fighter.spdBuff = spdBonusPct;
    addLog('系统', '长夜月速度+' + spdBonusPct + '% (基于基础速度' + baseSpd + '，' + oldSpd + '->' + fighter.spd + ')，下回合开始移除', 'buff');

    // 忆灵自爆也算"施放技能"：触发行迹1 + 天赋 + 行迹2
    if (typeof triggerChangyeSkillCast === 'function') {
        triggerChangyeSkillCast(fighter, '忆灵自爆');
    }

    // 清过渡状态
    G.isTransitioning = false;
    G.pauseUntil = 0;
    G.pauseLabel = null;

    buildActionQueue();
    G.currentActionIdx = 0;
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

// ============================================================
// 选择界面：敌人选择、队友选择、各角色终结技选人
// ============================================================

function showEnemySelection(fighter, skillKey) {
    const en = getAliveEnemies();
    if (!en.length) { addLog('系统', '没有敌人'); return; }
    const c = document.getElementById('skillButtons');
    let lb = '选择目标';
    if (skillKey === 'basic') lb = '选择普攻目标';
    else if (skillKey === 'enhancedBasic') lb = '选择强化普攻主目标';
    else if (skillKey === 'spiritBurst') lb = '选择自爆主目标';
    let h = '<span style="color:#aabbdd;font-size:12px;">' + lb + ' (' + fighter.name + ')</span>';
    en.forEach(e => {
        const pct = Math.round(e.hp / e.maxHp * 100);
        h += '<button class="btn" data-enemy-id="' + e.id + '" data-skill="' + skillKey + '" data-char-id="' + fighter.charId + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:140px;padding:4px 10px;">' +
            '<span>' + e.name + '</span><span style="font-size:9px;color:#ff7766;">HP ' + Math.round(e.hp) + '/' + Math.round(e.maxHp) + ' (' + pct + '%)</span>' +
            '</button>';
    });
    h += '<button class="btn btn-danger" id="btnCancelAction">取消</button>';
    c.innerHTML = h;

    c.querySelectorAll('button[data-enemy-id]').forEach(btn => {
        btn.addEventListener('click', function() {
            this.disabled = true;
            const enemyId = this.getAttribute('data-enemy-id');
            const sk = this.getAttribute('data-skill');
            const charId = this.getAttribute('data-char-id');
            const f = getAllyById(charId);
            const t = getEnemyById(enemyId);
            if (f && f.alive && t && t.alive) {
                if (sk === 'basic') {
                    if (charId === 'yinlang') executeYinlangBasic(f, t);
                    else if (charId === 'yaoguang') executeYaoguangBasic(f, t);
                    else if (charId === 'huohua') executeHuohuaBasic(f, t);
                    else executeBasicWithTarget(f, t);
                } else if (sk === 'enhancedBasic') {
                    executeEnhancedBasicWithTarget(f, t);
                } else if (sk === 'spiritBurst') {
                    executeSpiritBurst(f, t);
                }
            }
        });
    });

    document.getElementById('btnCancelAction').addEventListener('click', function() {
        const cf = getCurrentFighter();
        if (cf && cf.alive) showSkillSelection(cf);
        else { G.processing = false; setTimeout(() => processNextAction(), 100); }
    });
}

function xilianUltChoice(charId, choice) {
    const f = getAllyById(charId);
    if (!f) return;
    if (choice === 'buff') {
        const allies = getAliveAllies();
        if (!allies.length) return;
        const c = document.getElementById('skillButtons');
        let h = '<span style="color:#aabbdd;">选择增益队友:</span>';
        allies.forEach(a => {
            if (a.charId !== f.charId) {
                h += '<button class="btn" data-ally-id="' + a.charId + '" data-char-id="' + f.charId + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;">' + a.name + '</button>';
            }
        });
        c.innerHTML = h;
        c.querySelectorAll('button[data-ally-id]').forEach(btn => {
            btn.addEventListener('click', function() {
                this.disabled = true;
                const allyId = this.getAttribute('data-ally-id');
                const charId2 = this.getAttribute('data-char-id');
                const ff = getAllyById(charId2);
                if (ff && ff.alive) xilianApplyBuff(ff.charId, allyId);
            });
        });
    } else {
        // ★ 德谬歌施放攻击忆灵技：风堇 +2 层天空之诗
        const fj = getAllyById('fengjin');
        if (fj && fj.alive) {
            G.xilianSkyStacks = Math.min((G.xilianSkyStacks || 0) + 2, 4);
            G.fieldEffects.xilianSkyBuff = true;
            addLog('系统', '德谬歌施放忆灵技，风堇获得2层【献予天空之诗】', 'buff');
        }

        const en = getAliveEnemies();
        if (!en.length) return;
        let td = 0, tq = 0, tx = 0;
        en.forEach(e => {
            const r = calcDamage(f, e, f.baseHp * 0.60, '冰', '德谬歌', true);
            e.hp = Math.max(0, e.hp - r.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
            td += r.finalDmg; tq += r.trueDmgQingge; tx += r.trueDmgXilian;
        });
        addLog('战斗', '德谬歌 -> 全体 ' + td + ' 总伤害', 'dmg-ice');
        if (tq > 0 || tx > 0) {
            let tl = '';
            if (tq > 0) tl += '晴歌真伤+' + tq + ' ';
            if (tx > 0) tl += '昔涟真伤+' + tx;
            addLog('系统', '   ✦ ' + tl, 'dmg-true');
        }
        G.fieldEffects.xilianPoem = true;
        afterXilianUlt(f);
    }
}

function xilianApplyBuff(charId, targetId) {
    const f = getAllyById(charId);
    const t = getAllyById(targetId);
    if (!f || !t) return;
    const tCd = CHAR_DATA[targetId];
    const isGold = tCd && tCd.isGold;
    if (isGold) {
        addLog('系统', '昔涟为黄金裔 ' + t.name + ' 施加特殊增益', 'buff');
    } else {
        t.buffs = t.buffs || {};
        t.buffs.xilianBuff = { desc: '伤害+40%', duration: 2 };
        addLog('系统', '昔涟为 ' + t.name + ' 施加增益: 伤害+40% (2回合)');
    }
    // 德谬歌施放忆灵技（对单体使用）：风堇 +2 层天空之诗
    const fj = getAllyById('fengjin');
    if (fj && fj.alive) {
        G.xilianSkyStacks = Math.min((G.xilianSkyStacks || 0) + 2, 4);
        G.fieldEffects.xilianSkyBuff = true;
        addLog('系统', '德谬歌施放忆灵技，风堇获得2层【献予天空之诗】', 'buff');
    }
    // 对风堇单独施放：额外 +24 能
    if (t.charId === 'fengjin') {
        t.energy = Math.min(t.energy + 24, t.maxEnergy);
        addLog('系统', '对风堇施放忆灵技：风堇回能24', 'buff');
    }
    if (t.charId === 'changye') {
        G.fieldEffects.xilianMoonBuff = true;
        addLog('系统', '献予岁月之诗: 自爆伤害+18%, 战技/终结技额外+1忆质, 暴伤额外+12%');
    }
    afterXilianUlt(f);
}

    else { G.processing = false; setTimeout(() => processNextAction(), 100); }
}

// 治疗系统：小伊卡被动全队奶、雨过天晴额外奶、光锥扣血触发
// ============================================================

function triggerAllFengjinPassives() {
    const fj = getAllyById('fengjin');
    if (!fj || !fj.alive || !fj.spirit || !fj.spirit.alive) return;
    let totalHeal = 0;
    G.fighters.forEach(f => {
        if (f.alive) {
            let h = Math.round(fj.baseHp * 0.02 + 20);
            if (f.hp <= f.maxHp * 0.5) h = Math.round(h * 1.25);
            if (fj.spd > 200) h = Math.round(h * (1 + Math.min(fj.spd - 200, 200) / 100));
            if (G.fieldEffects.xilianSkyBuff) h = Math.round(h * 1.72);
            G.fengjinCumulativeHeal += h;
            if (typeof healWithRecord === 'function') { healWithRecord(f, h); }
            else { f.hp = Math.min(f.maxHp, f.hp + h); }
            totalHeal += h;
        }
    });
    if (G.fengjinInRain) {
        const eh = Math.round(fj.baseHp * 0.02 + 20);
        G.fighters.forEach(f => {
            if (f.alive) {
                G.fengjinCumulativeHeal += eh;
                if (typeof healWithRecord === 'function') { healWithRecord(f, eh); }
                else { f.hp = Math.min(f.maxHp, f.hp + eh); }
                totalHeal += eh;
            }
        });
    }
    if (totalHeal > 0) {
        addLog('治疗', ` 小伊卡被动总治疗: +${totalHeal}`, 'heal');
        onAllyHealOrShield(fj);
    }
}

function triggerFengjinSpiritAttack(fighter) {
    if (fighter.charId !== 'fengjin' || !G.fengjinInRain || !fighter.spirit || !fighter.spirit.alive) return;
    const en = getAliveEnemies();
    if (!en.length || G.fengjinCumulativeHeal < 10) return;
    let td = 0, tq = 0, tx = 0;
    const bd = Math.round(G.fengjinCumulativeHeal * 0.2) * (1 + (G.fengjinSpiritDmgStacks || 0) * 0.80);
    en.forEach(e => {
        const r = calcDamage(fighter, e, bd, '风', '小伊卡', true);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', ` ${e.name} 被击败!`); }
        td += r.finalDmg; tq += r.trueDmgQingge; tx += r.trueDmgXilian;
    });
    addLog('战斗', ` 小伊卡 → 全体 ${td} 总伤害`, 'dmg-wind');
    if (tq > 0 || tx > 0) {
        let tl = ''; if (tq > 0) tl += `晴歌真伤+${tq} `; if (tx > 0) tl += `昔涟真伤+${tx}`;
        addLog('系统', `   ✦ ${tl}`, 'dmg-true');
    }
    onAllyAttack(fighter);
    if (G.fengjinLightConeDrainTotal > 0) {
        const extraDmg = Math.round(G.fengjinLightConeDrainTotal * 2.5);
        en.forEach(e => {
            if (!e.alive) return;
            const rd = calcDamage(fighter, e, extraDmg, '风', '小伊卡', true);
            e.hp = Math.max(0, e.hp - rd.finalDmg);
        });
        addLog('系统', ` 小伊卡光锥附加伤害 ${extraDmg}`, 'dmg-wind');
        G.fengjinLightConeDrainTotal = 0;
    }
    G.fengjinCumulativeHeal = Math.round(G.fengjinCumulativeHeal * 0.5);
}

function triggerQinggeLightConeDrain(fighter) {
    return; // 新版晴歌光锥无扣血
}

function triggerFengjinLightConeDrain(fighter) {
    if (fighter.charId !== 'fengjin') return;
    G.fighters.forEach(f => {
        if (f.alive) {
            const dmg = Math.max(1, Math.round(f.hp * 0.01));
            f.hp = Math.max(1, f.hp - dmg);
            G.fengjinLightConeDrainTotal += dmg;
            if (f.charId === 'changye') addYiZhiToChangye(2, '风堇光锥扣血');
        }
    });
    triggerAllFengjinPassives();
}

        executeAllSecretSkills();
    }

    addLog('系统', '战斗开始! (第1轮, 上限' + G.roundMaxAV + '行动值, ' + ec + '个敌人)', 'special');
    buildActionQueue(); renderAll();
    setTimeout(() => processNextAction(), 300);
}

function processNextAction() {
    if (!G.battleActive) return;
    G.processing = false;
    if (!getAliveEnemies().length) { addLog('系统', '战斗胜利!', 'special'); G.battleActive = false; renderAll(); return; }
    if (!getAliveAllies().length) { addLog('系统', '战斗失败!', 'special'); G.battleActive = false; renderAll(); return; }

    if (processPendingUlts()) return;

    G.processing = true;
    buildActionQueue();
    if (!G.actionQueue.length) { G.processing = false; return; }
    const cur = G.actionQueue[G.currentActionIdx];
    if (!cur) { G.processing = false; return; }

    if (cur.type === 'countdown') {
        addLog('系统', '倒计时回合开始', 'special');
        advanceActionValue();
        G.processing = false; renderAll();
        setTimeout(() => processNextAction(), 300);
        return;
    }

    if (cur.type === 'aha') {
        addLog('系统', '阿哈时刻行动！', 'special');
        processAhaAction();
        G.processing = false; renderAll();
        setTimeout(() => processNextAction(), 300);
        return;
    }

    G.isSpiritTurn = cur.isSpirit && cur.charId === 'changye';

    if (cur.type === 'enemy') { enemyAction(cur); }
    else if (cur.isSpirit) { spiritAutoAction(cur); }
    else {
        const f = cur.fighter;
        if (!f || !f.alive) { G.processing = false; setTimeout(() => processNextAction(), 100); return; }

        if (G.qinggeInvitedGuest === f.charId && G.qinggeInvitedGuestDuration > 0) {
            G.qinggeInvitedGuestDuration--;
            if (G.qinggeInvitedGuestDuration <= 0) {
                G.qinggeInvitedGuest = null;
                addLog('系统', f.name + ' 的特邀嘉宾状态结束');
            }
        }

        if (f.charId !== 'xilian' && f.futureReady) {
            const xl = getAllyById('xilian');
            if (xl && xl.alive) {
                xl.zhuiYi = Math.min(xl.zhuiYi + 1, xl.maxEnergy);
                addLog('系统', '【未来】角色触发: ' + f.name + ' 行动，昔涟追忆+1 (' + xl.zhuiYi + '/' + xl.maxEnergy + ')');
            }
            f.futureReady = false;
        }
        if (f.charId === 'xilian') giveFutureToAllies();

        if (f.charId === 'changye' && f.spdBuff && f.spdBuff > 0) {
            const baseSpd = f.baseSpdRecord || f.spd;
            f.spd = baseSpd; f.spdBuff = 0;
            addLog('系统', '长夜月回合开始，自爆速度buff已移除，速度恢复为 ' + baseSpd, 'buff');
        }

        if (f.charId === 'fengjin' && G.fengjinRainDuration > 0) {
            G.fengjinRainDuration--;
            if (G.fengjinRainDuration <= 0) {
                G.fengjinInRain = false;
                addLog('系统', '风堇的雨过天晴状态结束', 'buff');
            } else {
                addLog('系统', '雨过天晴剩余回合：' + G.fengjinRainDuration, 'buff');
            }
        }

        if (f.charId === 'xilian' && G.fieldEffects.xilianField && G.fieldEffects.xilianField.duration > 0 && G.fieldEffects.xilianField.duration < 999) {
            G.fieldEffects.xilianField.duration--;
            if (G.fieldEffects.xilianField.duration <= 0) {
                G.fieldEffects.xilianField = null;
                addLog('系统', '昔涟战技结界消失', 'buff');
            } else {
                addLog('系统', '昔涟结界剩余回合：' + G.fieldEffects.xilianField.duration, 'buff');
            }
        }

        if (f.charId === 'yaoguang') {
            if (G.yaoguangField && G.yaoguangField.duration > 0) {
                G.yaoguangField.duration--;
                if (G.yaoguangField.duration <= 0) {
                    G.yaoguangField = null;
                    addLog('系统', '爻光结界消失', 'buff');
                } else {
                    addLog('系统', '爻光结界剩余回合：' + G.yaoguangField.duration, 'buff');
                }
            }
            if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) {
                G.yaoguangPenetration.duration--;
                if (G.yaoguangPenetration.duration <= 0) {
                    G.yaoguangPenetration = null;
                    addLog('系统', '抗性穿透效果消失', 'buff');
                }
            }
            G.enemies.forEach(e => {
                if (e.debuff_xiongxing && e.debuff_xiongxingDuration > 0) {
                    e.debuff_xiongxingDuration--;
                    if (e.debuff_xiongxingDuration <= 0) {
                        e.debuff_xiongxing = 0;
                    }
                }
            });
        }

        updateFighterStats(f);

        if (f.charId === 'huohua') tickGoodShowDuration(f);

        if (G.lastActorName !== cur.name) {
            G.lastActorName = cur.name;
            addLog('系统', '══════ 第' + (G.round + 1) + '轮 · 轮到 ' + cur.name + ' 行动 ══════', 'turn-start');
        }
        showSkillSelection(f);
        G.processing = false;
        renderAll();
    }
}

function enemyAction(entry) {
    const en = entry.enemy;
    if (!en || !en.alive) { G.processing = false; setTimeout(() => processNextAction(), 100); return; }
    const allies = getAliveAllies();
    if (!allies.length) { G.processing = false; setTimeout(() => processNextAction(), 100); return; }
    const target = allies[Math.floor(Math.random() * allies.length)];
    const dmg = Math.round((1200 + Math.random() * 600) * (1 - target.def / (target.def + 800)));
    const oh = target.hp; target.hp = Math.max(0, target.hp - dmg);
    if (target.charId === 'changye' && target.hp < oh) { addYiZhiToChangye(2, '天赋·被攻击'); G.fieldEffects.changyeTalentCD = true; }
    if (target.hp <= 0) { target.alive = false; if (target.spirit) target.spirit.alive = false; addLog('系统', target.name + ' 被击败!'); }
    addLog('战斗', en.name + ' -> ' + target.name + ' ' + dmg + '伤害', 'dmg-enemy');
    triggerAllFengjinPassives();
    advanceActionValue();
    G.processing = false; renderAll();
    setTimeout(() => processNextAction(), 300);
}

function processPendingUlts() {
    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;

    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();
    if (f.charId === 'xilian') {
        if ((f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
            addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    } else {
        if (f.energy < f.maxEnergy) {
            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    }

    G.isUltInterrupt = true;
    executeUlt(f);
    return true;
}

function showSkillSelection(fighter) {
    if (!fighter || !fighter.alive) {
        document.getElementById('skillButtons').innerHTML = '<span style="color:#ff6666;">' + (fighter ? fighter.name : '角色') + '已阵亡</span>';
        return;
    }
    const c = document.getElementById('skillButtons');
    const cd = CHAR_DATA[fighter.charId];
    let h = '<span class="current-actor-indicator">当前行动: ' + fighter.name + '</span><span style="color:#aabbdd;font-size:12px;margin-left:6px;">选择技能:</span>';
    const sp = G.sp > 0;
    let ult = fighter.charId === 'xilian' ? (fighter.zhuiYi || 0) >= (G.xilianIsFirstUlt ? 24 : 12) : fighter.energy >= fighter.maxEnergy;

    if (fighter.charId === 'huohua') {
        return;
    }

    if (fighter.charId === 'yaoguang') {
        return;
    }

    if (fighter.charId === 'yinlang') {
        return;
    }

    if (fighter.charId === 'xilian' && G.xilianInPastRipple) {
        h += '<button class="btn" id="btnEnhancedBasic" style="background:linear-gradient(145deg,#2a4a6a,#1a3050);border:1px solid #6ec6f8;color:#d0ecff;box-shadow:0 0 14px rgba(110,198,248,0.6);">【向着爱与明天♪】</button>';
        h += '<span style="color:#ffd966;font-size:11px;">往昔状态</span>';
        h += '<button class="btn ' + (ult ? 'btn-warning' : '') + '" id="btnUlt"' + (ult ? '' : 'disabled') + '>【此诗献予一切生命】</button>';
        c.innerHTML = h;
        document.getElementById('btnEnhancedBasic').addEventListener('click', () => doSkill(fighter.charId, 'enhancedBasic'));
        if (ult) document.getElementById('btnUlt').addEventListener('click', () => doUlt(fighter.charId));
        return;
    }

    h += '<button class="btn" id="btnBasic">【' + cd.skills.basic.name + '】</button>';
    if (fighter.charId === 'changye') {
        h += '<button class="btn" id="btnSkill">【' + cd.skills.skill.name + '】</button>';
    } else {
        h += '<button class="btn ' + (sp ? '' : 'btn-danger') + '" id="btnSkill"' + (sp ? '' : 'disabled') + '>【' + cd.skills.skill.name + '】' + (sp ? '' : '(SP不足)') + '</button>';
    }
    h += '<button class="btn ' + (ult ? 'btn-warning' : '') + '" id="btnUlt"' + (ult ? '' : 'disabled') + '>【' + cd.skills.ultimate.name + '】' + (ult ? ' (插队)' : '') + '</button>';

    if (fighter.charId === 'changye') {
        h += '<span style="color:#7aa9ff;">忆质: ' + (fighter.yiZhi || 0) + '/16</span>';
    }
    if (fighter.charId === 'xilian') h += '<span style="color:#8899bb;">追忆: ' + (fighter.zhuiYi || 0) + '/27</span>';
    if (fighter.charId === 'qingge') {
        h += '<span style="color:#8899bb;">气氛值: ' + G.qinggeAtmosphere + '/50</span>';
    }
    if (fighter.charId === 'fengjin') {
        if (G.fengjinInRain) h += '<span style="color:#7aa9ff;">雨过天晴</span>';
    }
    c.innerHTML = h;

    document.getElementById('btnBasic').addEventListener('click', () => doSkillWithTarget(fighter.charId, 'basic'));
    const skillBtn = document.getElementById('btnSkill');
    if (skillBtn && !skillBtn.disabled) skillBtn.addEventListener('click', () => doSkill(fighter.charId, 'skill'));
    const ultBtn = document.getElementById('btnUlt');
    if (ultBtn && !ultBtn.disabled) ultBtn.addEventListener('click', () => doUlt(fighter.charId));
}

function doUlt(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    G.ultSelecting = G.ultSelecting || {};
    if (G.ultSelecting[charId]) return;

    if (!G.pendingUlts.find(u => u.charId === charId)) {
        G.pendingUlts.push({ charId: charId });
        addLog('系统', f.name + ' 终结技已排队', 'special');
    }
    processPendingUlts();
    renderAll();
}

function doSkill(charId, skillKey) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    if (skillKey === 'skill') {
        if (charId !== 'changye' && G.sp <= 0) { addLog('系统', '战技点不足'); return; }
        executeSkill(f, 'skill', null);
    } else if (skillKey === 'enhancedBasic') {
        executeEnhancedBasic(f);
    }
}

function doSkillWithTarget(charId, skillKey) {
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    if (skillKey === 'basic') showEnemySelection(f, 'basic');
}

function addYiZhiToChangye(amt, src) {
    const c = getAllyById('changye');
    if (!c || !c.alive) return;
    c.yiZhi = Math.min((c.yiZhi || 0) + amt, 999);

    if ((c.yiZhi || 0) >= 16 && c.spirit && c.spirit.alive && c.spirit.spd > 0 && G.changyeWaterImmediateReady !== false) {
        G.changyeWaterImmediateReady = false;

        // 拉条到 -1：绝对优先
        c.spirit.av = -1;

        buildActionQueue();
        G.currentActionIdx = 0;
        addLog('系统', '水母忆质达到16层，行动提前100%（立即行动）', 'special');

        if (typeof forceRenderActionBar === 'function') forceRenderActionBar();
        if (typeof flashActionBarSlot === 'function') flashActionBarSlot('changye');
        if (typeof flashCard === 'function') flashCard('changye');
    }
}

// 行迹2：长夜月或我方忆灵施放技能时，恢复5能 +1忆质
function triggerChangyeTrace1(f, src) {
    if (f.charId !== 'changye' || !f.alive) return;
    f.energy = Math.min(f.energy + 5, f.maxEnergy);
    addYiZhiToChangye(1, '行迹2·' + src);
}

// 忆灵施放技能时触发：行迹1（扣5%HP + 双方暴伤+15%）+ 天赋（+60%暴伤 +2忆质）+ 行迹2
function triggerChangyeSkillCast(f, src) {
    if (!f || f.charId !== 'changye' || !f.alive) return;

    // 行迹1：扣 5% 当前 HP
    const cost = Math.max(1, Math.round(f.hp * 0.05));
    const oh = f.hp;
    f.hp = Math.max(1, f.hp - cost);
    if (f.hp < oh) {
        addYiZhiToChangye(2, '天赋扣血(' + src + ')');
        G.fieldEffects.changyeTalentCD = true;
    }

    G.fieldEffects.changyeTrace2CD = true;

    // 行迹2：+5 能 +1 忆质
    triggerChangyeTrace1(f, src);

    if (typeof triggerAllFengjinPassives === 'function') triggerAllFengjinPassives();
}

function giveFutureToAllies() {
    G.fighters.forEach(f => {
        if (f.alive && f.charId !== 'xilian') {
            f.futureReady = true;
            if (f.spirit && f.spirit.alive) f.spirit.hasFuture = true;
        }
    });
}

/* ==================== js/04j_huanle.js ==================== */
// ============================================================
// 火花（欢愉·火）技能执行逻辑
// 保存为 js/04j_huanle.js
// ★ 修复：
//   1. showHuohuaTrapSelection 直接回主界面，不画独立面板
//   2. 进入连线时第一次互动陷阱不消耗战技点（避免总消耗2点）

var _origShowSkillSelection_hh = window.showSkillSelection;
var _origDoUlt_hh = window.doUlt;
var _origProcessPendingUlts_hh = window.processPendingUlts;

// ========== 火花普攻 ==========
function executeHuohuaBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【哑火了吗】', 'skill-use');
    const r = calcDamage(fighter, target, fighter.baseAtk * 1.0, '火', fighter.label || fighter.name, false);
    target.hp = Math.max(0, target.hp - r.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    addLog('战斗', fighter.name + ' 普攻 -> ' + target.name + ' ' + r.finalDmg + ' 伤害', 'dmg-fire');
    fighter.energy = Math.min(fighter.energy + Math.round(20 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);
    G.sp = Math.min(G.sp + 1, G.maxSp);
    onAllyAttack(fighter);
    updateHuohuaHuanleDu(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

// ========== 火花战技 ==========
function executeHuohuaSkill(fighter) {
    if (!fighter || !fighter.alive) return;
    if (G.sp <= 0 && fighter.baodian <= 0) { addLog('系统', '战技点不足'); return; }
    addLog('系统', fighter.name + ' 使用了【尖叫！火花花连线中】', 'skill-use');
    if (!consumeSP(fighter, 1)) return;  // 连线消耗1点
    fighter.liveConnect = true;
    fighter.liveConnectTurns = 2;
    fighter.trapCount = 0;
    fighter.enhancedBasicTargetBonus = 0;
    fighter.enhancedBasicAdjacentBonus = 0;
    fighter.huohuaRedRedCount = 0;
    G.huohuaTrapInProgress = true;
    // ★ 第一次互动陷阱免费触发（不消耗）
    executeHuohuaTrap(fighter, true);
    renderAll();
}

// ========== 互动陷阱 ==========
// isFirst=true：进入连线时的免费触发，不消耗
function executeHuohuaTrap(fighter, isFirst) {
    isFirst = isFirst || false;
    if (!fighter || !fighter.alive) return;
    if (fighter.trapCount >= 20) { addLog('系统', '互动陷阱已达20次上限'); return; }

    // ★ 非免费触发才检查资源
    if (!isFirst) {
        if (G.sp <= 0 && fighter.baodian <= 0) { addLog('系统', '战技点不足'); return; }
        if (!consumeSP(fighter, 1)) return;
    }

    fighter.trapCount++;
    addXiaodian(1);
    let giftText = '恍惚惚：+1笑点';
    const redProb = 0.3;
    if (fighter.huohuaRedRedCount === undefined) fighter.huohuaRedRedCount = 0;
    if (fighter.huohuaRedRedCount < 3 && Math.random() < redProb) {
        fighter.huohuaRedRedCount++;
        addXiaodian(2);
        G.sp = Math.min(G.sp + 2, G.maxSp);
        giftText += '，红红火火：+2笑点 +2战技点（已触发' + fighter.huohuaRedRedCount + '/3）';
    }
    addLog('系统', '互动陷阱发动！' + giftText, 'buff');
    fighter.enhancedBasicTargetBonus += 0.20;
    fighter.enhancedBasicAdjacentBonus += 0.10;
    updateHuohuaHuanleDu(fighter);
    renderAll();
    showHuohuaTrapSelection(fighter);
}

// ========== ★ 直接回主界面 ==========
function showHuohuaTrapSelection(fighter) {
    if (!fighter || !fighter.alive) return;
    if (typeof window.showSkillSelection === 'function') {
        window.showSkillSelection(fighter);
    }
}

// ========== 火花强化普攻目标选择 ==========
function showHuohuaEnhancedBasicSelection(fighter) {
    const enemies = getAliveEnemies();
    if (enemies.length === 0) { addLog('系统', '没有敌人'); return; }
    const c = document.getElementById('skillButtons');

    enemies.forEach(e => {
        h += '<button class="btn" data-enemy-id="' + e.id + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;">' +
            '<span>' + e.name + '</span><span style="font-size:9px;color:#ff7766;">HP ' + Math.round(e.hp) + '/' + Math.round(e.maxHp) + '</span></button>';
    });

// ========== 火花强化普攻 ==========
function executeHuohuaEnhancedBasic(fighter, mainTarget) {
    if (!fighter || !fighter.alive || !mainTarget || !mainTarget.alive) return;
    addLog('系统', fighter.name + ' 使用了【百花齐放，胜者独享！】', 'skill-use');

    const en = getAliveEnemies();
    const targetIdx = en.findIndex(e => e.id === mainTarget.id);
    if (targetIdx === -1) return;

    const mainMult = 1.0 + fighter.enhancedBasicTargetBonus;
    const adjMult = 0.5 + fighter.enhancedBasicAdjacentBonus;

    let totalDmg = 0, totalTrueX = 0;

    const rMain = calcDamage(fighter, mainTarget, fighter.baseAtk * mainMult, '火', fighter.label, false);
    mainTarget.hp = Math.max(0, mainTarget.hp - rMain.finalDmg);
    if (mainTarget.hp <= 0) { mainTarget.alive = false; addLog('系统', mainTarget.name + ' 被击败'); }
    totalDmg += rMain.finalDmg;
    totalTrueX += rMain.trueDmgXilian;

    const adjIndices = [];
    if (targetIdx > 0) adjIndices.push(targetIdx - 1);
    if (targetIdx < en.length - 1) adjIndices.push(targetIdx + 1);
    for (const idx of adjIndices) {
        const adj = en[idx];
        if (!adj.alive) continue;
        const rAdj = calcDamage(fighter, adj, fighter.baseAtk * adjMult, '火', fighter.label, false);
        adj.hp = Math.max(0, adj.hp - rAdj.finalDmg);
        if (adj.hp <= 0) { adj.alive = false; addLog('系统', adj.name + ' 被击败'); }
        totalDmg += rAdj.finalDmg;
        totalTrueX += rAdj.trueDmgXilian;
    }

    addLog('战斗', fighter.name + ' 强化普攻 -> ' + mainTarget.name + '及相邻 ' + totalDmg + ' 总伤害', 'dmg-fire');
    if (totalTrueX > 0) addLog('系统', '昔涟真伤+' + totalTrueX, 'dmg-true');

    if (fighter.goodShow && fighter.goodShow.duration > 0) {
        let huanleTotalDmg = 0, huanleTotalTrue = 0;
        const hMain = calcHuanleDamage(fighter, mainTarget, 0.40);
        mainTarget.hp = Math.max(0, mainTarget.hp - hMain.finalDmg);
        if (mainTarget.hp <= 0 && mainTarget.alive) { mainTarget.alive = false; addLog('系统', mainTarget.name + ' 被击败'); }
        huanleTotalDmg += hMain.finalDmg;
        huanleTotalTrue += hMain.trueDmgXilian;

        for (const idx of adjIndices) {
            const adj = en[idx];
            if (!adj.alive) continue;
            const hAdj = calcHuanleDamage(fighter, adj, 0.20);
            adj.hp = Math.max(0, adj.hp - hAdj.finalDmg);
            if (adj.hp <= 0 && adj.alive) { adj.alive = false; addLog('系统', adj.name + ' 被击败'); }
            huanleTotalDmg += hAdj.finalDmg;
            huanleTotalTrue += hAdj.trueDmgXilian;
        }

        const trapCount = fighter.trapCount || 0;
        for (let i = 0; i < trapCount; i++) {
            const attackedTargets = [mainTarget, ...adjIndices.map(idx => en[idx])].filter(t => t && t.alive);
            if (attackedTargets.length === 0) break;
            const randTarget = attackedTargets[Math.floor(Math.random() * attackedTargets.length)];
            const extraH = calcHuanleDamage(fighter, randTarget, 0.20);

    fighter.energy = Math.min(fighter.energy + Math.round(40 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);

    renderAll();

}

// ========== 覆盖 buildActionQueue：加入阿哈时刻 ==========
function buildActionQueue() {
    const u = [];

    G.fighters.forEach(f => {
        if (!f.alive) return;

        if (f.charId === 'qingge' && G.qinggeFeverActive) {
            if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
                u.push({
                    type: 'ally', charId: f.charId, name: f.spirit.name,
                    avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                    fighter: f, isSpirit: true, extra: false
                });
            }
            return;
        }

        u.push({
            type: 'ally', charId: f.charId, name: f.name,
            avatar: f.avatar, spd: f.spd, av: f.av,
            fighter: f, isSpirit: false, extra: false
        });

        if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
            u.push({
                type: 'ally', charId: f.charId, name: f.spirit.name,
                avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                fighter: f, isSpirit: true, extra: false
            });
        }
    });

    G.enemies.forEach(e => {
        if (e.alive) {
            u.push({
                type: 'enemy', enemyId: e.id, name: e.name,
                avatar: 'enemy', spd: e.spd, av: e.av,
                enemy: e, extra: false
            });
        }
    });

    addAhaToActionQueue(u);

    if (G.qinggeFeverActive) {
        u.push({
            type: 'countdown', charId: 'qingge_countdown', name: '倒计时',
            avatar: 'spirit', spd: 140, av: G.qinggeCountdownAv || 0, extra: false
        });
    }

    if (G.extraTurns.length) {
        const seen = new Set();
        G.extraTurns = G.extraTurns.filter(e => {
            const key = e.charId + (e.isSpirit ? '_spirit' : '');
            if (seen.has(key)) return false;
            seen.add(key);
            return e.fighter && e.fighter.alive && (!e.isSpirit || (e.fighter.spirit && e.fighter.spirit.alive));
        });
        G.extraTurns.forEach(e => {
            u.push({
                type: 'ally', charId: e.charId, name: e.name + ' ⭐',
                avatar: e.avatar || 'spirit', spd: 9999, av: 0,
                fighter: e.fighter, isSpirit: e.isSpirit || false, extra: true
            });
        });
        G.extraTurns = [];
    }

    u.sort((a, b) => a.av - b.av);
    G.actionQueue = u;
    G.currentActionIdx = 0;
}

// ========== 覆盖 executeUlt：加入火花终结技分支 ==========
function executeUlt(fighter) {
    if (!fighter || !fighter.alive) return;
    const cd = CHAR_DATA[fighter.charId];

    G.ultSelecting = G.ultSelecting || {};
    G.ultSelecting[fighter.charId] = true;

    if (fighter.charId === 'huohua') {
        if (fighter.energy < fighter.maxEnergy) {
            addLog('系统', '❌ 能量不足');
            G.ultSelecting[fighter.charId] = false;
            G.isUltInterrupt = false;
            return;
        }
        if (G.huohuaTrapInProgress) {
            // 互动陷阱期间大招只排队，不立即释放
            G.ultSelecting[fighter.charId] = false;
            G.isUltInterrupt = false;
            return;
        }
        fighter.energy = 0;
        showHuohuaUltTargetChoice(fighter);
        return;
    }

    if (fighter.charId === 'xilian') {
        const need = G.xilianIsFirstUlt ? 24 : 12;
        if ((fighter.zhuiYi || 0) < need) {
            G.isUltInterrupt = false;
            G.ultSelecting[fighter.charId] = false;
            return;
        }
        fighter.zhuiYi -= need;
        addLog('系统', `✨ 昔涟 使用了【${cd.skills.ultimate.name}】`, 'skill-use');

        if (G.xilianIsFirstUlt) {
            if (!fighter.spirit || !fighter.spirit.alive) summonSpirit(fighter);
            G.fighters.forEach(f => {
                if (f.alive && f.charId !== 'xilian') {
                    f.energy = f.maxEnergy;
                    addLog('系统', `⚡ 昔涟激活 ${f.name} 终结技!`);
                }
            });
            G.xilianInPastRipple = true;
            fighter.inPastRipple = true;
            G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };
            G.fieldEffects.xilianField = { desc: '附加24%真实伤害', duration: 999 };
            G.xilianIsFirstUlt = false;
            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            fighter.zhuiYi = Math.min(fighter.zhuiYi + 12, 27);
            addLog('系统', `📖 全队充能: 昔涟追忆+12 (${fighter.zhuiYi}/27)`);
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        } else {
            if (!G.xilianInPastRipple) {
                G.xilianInPastRipple = true;
                fighter.inPastRipple = true;
                G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };
            }
            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        }
    }

    if (fighter.charId === 'qingge') {
        showQinggeUltTargetChoice(fighter);
        return;
    }
    if (fighter.charId === 'changye') {
        showEnemyUltChoice(fighter);
        return;
    }
    if (fighter.charId === 'fengjin') {
        showAllyUltChoice(fighter);
        return;
    }
}

// ========== 覆盖 doUlt：立即插队释放（除非互动陷阱进行中） ==========
function doUlt(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    G.ultSelecting = G.ultSelecting || {};
    if (G.ultSelecting[charId]) return;

    if (!G.pendingUlts.find(u => u.charId === charId)) {
        G.pendingUlts.push({ charId: charId });
        addLog('系统', ` ${f.name} 终结技已排队`, 'special');
    }

    // 互动陷阱进行中时，只排队不处理
    if (G.huohuaTrapInProgress) {
        renderAll();
        return;
    }

    // 立即处理排队的大招
    processPendingUlts();
    renderAll();
}

if (DEFAULT_BONUS_STATS.huanleDu === undefined) DEFAULT_BONUS_STATS.huanleDu = 0;

window.calcDamage = function(attacker, defender, baseDmg, element, sourceLabel, isSpirit) {
    isSpirit = isSpirit || false;
    updateFighterStats(attacker);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    let dmgBonus = 1;
    if (element === '冰') dmgBonus += (attacker.elemIce || 0) / 100;
    else if (element === '风') dmgBonus += (attacker.elemWind || 0) / 100;
    else if (element === '火') dmgBonus += (attacker.elemFire || 0) / 100;
    else if (element === '物理') dmgBonus += (attacker.elemPhysical || 0) / 100;
    else if (element === '虚数') dmgBonus += (attacker.elemImaginary || 0) / 100;
    else dmgBonus += (attacker.elemOther || 0) / 100;
    if (attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    if (isSpirit && attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    const cy = getAllyById('changye');
    if (cy && cy.alive && cy.spirit && cy.spirit.alive && (attacker.charId === 'changye' || (isSpirit && attacker.charId === 'changye'))) dmgBonus += 0.50;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let finalDmg = baseDmg * defMulti * resistMulti * dmgBonus * critMulti;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    finalDmg *= vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (sourceLabel && finalDmg > 0) recordDamage(sourceLabel, finalDmg);
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '物理';
    updateFighterStats(attacker);
    recalculateHuanleDu();
    const base = 7535.107 * skillMultiplier;
    const huanleDuPercent = G.huanleDu;
    const huanleMulti = 1 + huanleDuPercent / 100;
    const zengxiaoMulti = 1 + G.zengxiao / 100;
    let xiaodian;
    if (G.ahaMomentInProgress) xiaodian = getCurrentXiaodian();
    else xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.onAllyAttack = function(attacker) {
    if (!attacker) {
        const cf = getCurrentFighter();
        attacker = cf || null;
    }
    if (typeof originalOnAllyAttack_yao === 'function') originalOnAllyAttack_yao(attacker);
};

function getYaoguangHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'yaoguang' || !fighter.alive) return 0;
    let bonus = 0;
    if (fighter.spd >= 120) {
        bonus += 30;
        const over = Math.min(fighter.spd - 120, 200);
        bonus += over;
    }
    return bonus;
}

function updateYaoguangHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'yaoguang') return;
    const baseHuanle = (fighter.bonusHuanle || 0);
    const traceBonus = getYaoguangHuanleDu(fighter);
    fighter.huanleDu = baseHuanle + traceBonus;
}

function getFighterHuanleDu(fighter) {
    if (!fighter || !fighter.alive) return 0;
    let huanleDu = fighter.huanleDu || 0;
    if (G.yaoguangField && G.yaoguangField.duration > 0 && fighter.charId !== G.yaoguangField.owner) {
        const yaoguang = getAllyById(G.yaoguangField.owner);
        if (yaoguang && yaoguang.alive) {
            const bonus = (yaoguang.huanleDu || 0) * (G.yaoguangField.bonusPercent / 100);
            huanleDu += bonus;
        }
    }
    return huanleDu;
}

function executeYaoguangBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【雀翎鸣镝，过招有喜】', 'skill-use');

    const en = getAliveEnemies();
    const targetIdx = en.findIndex(e => e.id === target.id);
    if (targetIdx === -1) return;

    let totalDmg = 0, totalTrueX = 0;
    const rMain = calcDamage(fighter, target, fighter.baseAtk * 0.9, '物理', fighter.label, false);
    target.hp = Math.max(0, target.hp - rMain.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    totalDmg += rMain.finalDmg;
    totalTrueX += rMain.trueDmgXilian;

    const adjIndices = [];
    if (targetIdx > 0) adjIndices.push(targetIdx - 1);
    if (targetIdx < en.length - 1) adjIndices.push(targetIdx + 1);
    for (const idx of adjIndices) {
        const adj = en[idx];
        if (!adj.alive) continue;
        const rAdj = calcDamage(fighter, adj, fighter.baseAtk * 0.3, '物理', fighter.label, false);
        adj.hp = Math.max(0, adj.hp - rAdj.finalDmg);
        if (adj.hp <= 0) { adj.alive = false; addLog('系统', adj.name + ' 被击败'); }
        totalDmg += rAdj.finalDmg;
        totalTrueX += rAdj.trueDmgXilian;
    }

    addLog('战斗', fighter.name + ' 普攻 -> ' + target.name + '及相邻 ' + totalDmg + ' 总伤害', 'dmg-physical');
    if (totalTrueX > 0) addLog('系统', '昔涟真伤+' + totalTrueX, 'dmg-true');

    fighter.energy = Math.min(fighter.energy + Math.round(30 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);
    G.sp = Math.min(G.sp + 1, G.maxSp);

    if (G.yaoguangField && G.yaoguangField.duration > 0) {
        addXiaodian(3);
        addLog('系统', '结界：爻光普攻获得3笑点', 'buff');
    }

    const hitTargets = [target, ...adjIndices.map(i => en[i])];
    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, hitTargets, false);

    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeYaoguangSkill(fighter) {
    if (!fighter || !fighter.alive) return;
    if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
    G.sp--;
    addLog('系统', fighter.name + ' 使用了【十方光映，万法皆明】', 'skill-use');

    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function triggerDajiDali(attacker, hitTargets, consumedSP) {
    const yaoguang = getAllyById('yaoguang');
    if (!yaoguang || !yaoguang.alive) return;
    if (!yaoguang.goodShow || yaoguang.goodShow.duration <= 0) return;

    const aliveTargets = hitTargets.filter(t => t && t.alive);
    if (aliveTargets.length === 0) return;

    const target = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];
    const attackerElement = attacker.element || '物理';
    const huanleDmg = calcHuanleDamage(attacker, target, 0.20, attackerElement);
    target.hp = Math.max(0, target.hp - huanleDmg.finalDmg);

    addLog('系统', '大吉大利（' + attacker.name + '·' + attackerElement + '）：欢愉伤害：' + huanleDmg.finalDmg, 'dmg-true');

    if (consumedSP) {
        const aliveTargets2 = getAliveEnemies().filter(t => t.alive);
        if (aliveTargets2.length > 0) {
            const target2 = aliveTargets2[Math.floor(Math.random() * aliveTargets2.length)];
            const huanleDmg2 = calcHuanleDamage(attacker, target2, 0.20, attackerElement);
            target2.hp = Math.max(0, target2.hp - huanleDmg2.finalDmg);
            if (target2.hp <= 0) { target2.alive = false; addLog('系统', target2.name + ' 被击败'); }
            addLog('系统', '大吉大利·额外（消耗战技点）：欢愉伤害：' + huanleDmg2.finalDmg, 'dmg-true');
        }
    }
}

}

window.buildActionQueue = function() {
    G.fighters.forEach(f => {

            updateYaoguangHuanleDu(f);

window.executeUlt = function(fighter) {
