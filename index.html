// ========== 覆盖核心函数 ==========
var _origDoUlt_feiying = window.doUlt;
var _origExecuteUlt_feiying = window.executeUlt;
var _origProcessPendingUlts_feiying = window.processPendingUlts;
var _origUpdateFighterStats_feiying = window.updateFighterStats;
var _origCalcHuanleDamage_feiying = window.calcHuanleDamage;
var _origBuildActionQueue_feiying = window.buildActionQueue;
var _origGetEnergyRechargeBonus_feiying = window.getEnergyRechargeBonus;
var _origAdvanceActionValue_feiying = window.advanceActionValue;

// 覆盖充能效率：加入绯英光锥
window.getEnergyRechargeBonus = function(fighter) {
    let bonus = 0;
    if (typeof _origGetEnergyRechargeBonus_feiying === 'function') {
        bonus = _origGetEnergyRechargeBonus_feiying(fighter);
    }

    if (fighter && fighter.alive && fighter.charId === 'feiying' && fighter.hasLC) {
        bonus += 0.10;
        const maxEnergy = fighter.maxEnergy || 480;
        const excess = Math.min(Math.max(maxEnergy - 120, 0), 360);
        bonus += (excess / 10) * 0.003;
    }

    return bonus;
};

// 覆盖属性刷新：加入绯英光锥暴击伤害+60%、行迹1暴击率+30%、更新欢愉度
window.updateFighterStats = function(f) {
    if (!f || !f.alive) return;
    if (typeof _origUpdateFighterStats_feiying === 'function') {
        _origUpdateFighterStats_feiying(f);
    }

    if (f.charId === 'feiying' && f.hasLC) {
        f.critDmg += 0.60;
        if (f.spirit && f.spirit.alive) {
            f.spirit.critDmg = f.critDmg;
        }
    }

    if (f.charId === 'feiying') {
        f.critRate = Math.min(f.critRate + 0.30, 1.0);
        f.huanleDu = getFeiyingHuanleDu(f);
    }
};

// 覆盖calcHuanleDamage：加入绯英易伤（光锥与行迹2）
window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '物理';
    if (typeof _origCalcHuanleDamage_feiying === 'function') {
        const result = _origCalcHuanleDamage_feiying(attacker, defender, skillMultiplier, element);
        if (defender.debuff_feiyingLC && defender.debuff_feiyingLC > 0) {
            result.finalDmg = Math.round(result.finalDmg * (1 + defender.debuff_feiyingLC / 100));
            result.trueDmgXilian = Math.round(result.trueDmgXilian * (1 + defender.debuff_feiyingLC / 100));
        }
        if (defender.debuff_fox && defender.debuff_fox > 0) {
            result.finalDmg = Math.round(result.finalDmg * (1 + defender.debuff_fox / 100));
            result.trueDmgXilian = Math.round(result.trueDmgXilian * (1 + defender.debuff_fox / 100));
        }
        return result;
    }
    return { finalDmg: 0, trueDmgQingge: 0, trueDmgXilian: 0 };
};

// ========== 统一 showSkillSelection（全角色） ==========
window.showSkillSelection = function(fighter) {
    if (!fighter || !fighter.alive) {
        document.getElementById('skillButtons').innerHTML = '<span style="color:#ff6666;">角色已阵亡</span>';
        return;
    }
    const c = document.getElementById('skillButtons');
    const cd = CHAR_DATA[fighter.charId];
    if (!cd) return;

    let h = '<span class="current-actor-indicator">当前行动: ' + fighter.name + '</span>';
    const sp = G.sp > 0;
    let ultReady = false;

    if (fighter.charId === 'xilian') ultReady = (fighter.zhuiYi || 0) >= (G.xilianIsFirstUlt ? 24 : 12);
    else if (fighter.charId === 'yinlang') ultReady = (fighter.hiddenScore || 0) >= 60 && !fighter.invinciblePlayer;
    else if (fighter.charId === 'feiying') ultReady = fighter.energy >= 240;
    else ultReady = fighter.energy >= fighter.maxEnergy;

    h += '<button class="btn" id="btnBasic">【' + cd.skills.basic.name + '】</button>';

    if (fighter.charId === 'changye' || fighter.charId === 'qingge' || fighter.charId === 'xilian' || fighter.charId === 'fengjin' || fighter.charId === 'yaoguang' || fighter.charId === 'yinlang' || fighter.charId === 'feiying' || fighter.charId === 'huohua') {
        h += '<button class="btn ' + (sp || (fighter.charId==='huohua' && fighter.baodian>0) ? '' : 'btn-danger') + '" id="btnSkill"' + (sp || (fighter.charId==='huohua' && fighter.baodian>0) ? '' : ' disabled') + '>【' + cd.skills.skill.name + '】</button>';
    }

    h += '<button class="btn ' + (ultReady ? 'btn-warning' : '') + '" id="btnUlt"' + (ultReady ? '' : ' disabled') + '>【' + cd.skills.ultimate.name + '】</button>';

    if (fighter.charId === 'changye') h += '<span style="color:#7aa9ff;">忆质:' + (fighter.yiZhi||0) + '/16</span>';
    if (fighter.charId === 'xilian') h += '<span style="color:#8899bb;">追忆:' + (fighter.zhuiYi||0) + '/27</span>';
    if (fighter.charId === 'qingge') h += '<span style="color:#8899bb;">气氛值:' + G.qinggeAtmosphere + '/50</span>';
    if (fighter.charId === 'fengjin' && G.fengjinInRain) h += '<span style="color:#7aa9ff;">雨过天晴</span>';
    if (fighter.charId === 'huohua') {
        h += '<span style="color:#ff9966;">欢愉度:' + (fighter.huanleDu||0) + '% 笑点:' + getCurrentXiaodian() + ' 爆点:' + (fighter.baodian||0) + '</span>';
        if (fighter.liveConnect) {
            h += '<button class="btn btn-primary" id="btnEnhancedBasic">【百花齐放，胜者独享！】</button>';
            if (fighter.trapCount < 20 && (sp || fighter.baodian > 0)) h += '<button class="btn" id="btnTrap">【互动陷阱】</button>';
            h += '<button class="btn btn-warning" id="btnEndConnect">结束连线</button>';
        }
    }
    if (fighter.charId === 'yaoguang') {
        h += '<span style="color:#8899bb;">欢愉度:' + Math.round(getFighterHuanleDu(fighter)) + '%</span>';
        if (fighter.goodShow && fighter.goodShow.duration > 0) h += '<span style="color:#ffd966;">好活当赏(' + fighter.goodShow.duration + ')</span>';
    }
    if (fighter.charId === 'yinlang') {
        h += '<span style="color:#8899bb;">隐藏分:' + (fighter.hiddenScore||0) + '</span>';
        if (fighter.invinciblePlayer && fighter.invincibleBasicCount < 3) {
            c.innerHTML = h;
            startYinlangEnhancedBasic(fighter);
            return;
        }
    }
    if (fighter.charId === 'feiying') {
        h += '<span style="color:#8899bb;">欢愉度:' + (fighter.huanleDu||0) + '% 好活:' + getTotalGoodShow(fighter) + ' 累计:' + (fighter.energyAccum||0) + '/240</span>';
        if (fighter.goodShow && fighter.goodShow.duration > 0) h += '<span style="color:#ffd966;">好活当赏(' + fighter.goodShow.duration + ')</span>';
    }

    c.innerHTML = h;

    document.getElementById('btnBasic').addEventListener('click', () => {
        showEnemySelection(fighter, 'basic');
    });
    const skillBtn = document.getElementById('btnSkill');
    if (skillBtn && !skillBtn.disabled) {
        skillBtn.addEventListener('click', () => {
            if (fighter.charId === 'changye') executeSkill(fighter, 'skill', null);
            else if (fighter.charId === 'qingge') executeSkill(fighter, 'skill', null);
            else if (fighter.charId === 'xilian') executeSkill(fighter, 'skill', null);
            else if (fighter.charId === 'fengjin') executeSkill(fighter, 'skill', null);
            else if (fighter.charId === 'huohua') executeHuohuaSkill(fighter);
            else if (fighter.charId === 'yaoguang') executeYaoguangSkill(fighter);
            else if (fighter.charId === 'yinlang') executeYinlangSkill(fighter);
            else if (fighter.charId === 'feiying') showEnemySelection(fighter, 'feiyingSkill');
        });
    }
    const ultBtn = document.getElementById('btnUlt');
    if (ultBtn && !ultBtn.disabled) {
        ultBtn.addEventListener('click', () => doUlt(fighter.charId));
    }

    if (fighter.charId === 'huohua' && fighter.liveConnect) {
        document.getElementById('btnEnhancedBasic').addEventListener('click', () => showHuohuaEnhancedBasicSelection(fighter));
        const trapBtn = document.getElementById('btnTrap');
        if (trapBtn) trapBtn.addEventListener('click', () => executeHuohuaTrap(fighter, false));
        document.getElementById('btnEndConnect').addEventListener('click', () => {
            fighter.liveConnect = false;
            fighter.trapCount = 0;
            fighter.enhancedBasicTargetBonus = 0;
            fighter.enhancedBasicAdjacentBonus = 0;
            G.huohuaTrapInProgress = false;
            advanceActionValue();
            G.processing = false;
            renderAll();
            setTimeout(() => processNextAction(), 300);
        });
    }
};

// 覆盖executeUlt：加入绯英
window.executeUlt = function(fighter) {
    if (!fighter || !fighter.alive) return;
    if (fighter.charId === 'feiying') {
        showFeiyingUltTargetChoice(fighter);
        return;
    }
    if (typeof _origExecuteUlt_feiying === 'function') _origExecuteUlt_feiying(fighter);
};

// 覆盖doUlt：绯英终结技排队 + 火花陷阱/银狼强化期间只排队不处理
window.doUlt = function(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;

    G.ultSelecting = G.ultSelecting || {};
    if (G.ultSelecting[charId]) return;

    if (!G.pendingUlts.find(u => u.charId === charId)) {
        G.pendingUlts.push({ charId: charId });
        addLog('系统', f.name + ' 终结技已排队', 'special');
    }

    if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress) {
        renderAll();
        return;
    }

    processPendingUlts();
    renderAll();
};

// 覆盖processPendingUlts：检查狐狸老师队列 + 额外阿哈 + 绯英大招（240能量）
window.processPendingUlts = function() {
    if (G.huohuaTrapInProgress || G.yinlangEnhancedInProgress) {
        return true;
    }

    // 1. 狐狸老师追加攻击队列（绯英）
    if (G.feiyingFoxQueue && G.feiyingFoxQueue.length > 0) {
        if (G.isUltInterrupt) return true;
        const fox = G.feiyingFoxQueue.shift();
        G.isUltInterrupt = true;
        executeFoxAttack(fox.fighter);
        G.isUltInterrupt = false;
        G.processing = false;
        renderAll();
        return processPendingUlts(); // 递归处理剩余队列
    }

    // 2. 额外阿哈时刻队列（瑶光大招等）
    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
        if (G.isUltInterrupt) return true;
        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return processPendingUlts(); // 递归处理剩余队列
    }

    // 3. 普通终结技队列
    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;

    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();

    if (f.charId === 'feiying') {
        if (f.energy < 240) {
            addLog('系统', '绯英能量不足240，终结技跳过', 'special');
            return processPendingUlts();
        }
        G.isUltInterrupt = true;
        showFeiyingUltTargetChoice(f);
        return true;
    }

    if (f.charId === 'yinlang') {
        if ((f.hiddenScore || 0) < 60) {
            addLog('系统', '隐藏分不足，终结技跳过', 'special');
            return processPendingUlts();
        }
        G.isUltInterrupt = true;
        showYinlangUltTargetChoice(f);
        return true;
    }

    if (f.charId === 'xilian') {
        if ((f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
            addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    } else if (f.charId !== 'yaoguang') {
        if (f.energy < f.maxEnergy) {
            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    }

    G.isUltInterrupt = true;
    executeUlt(f);
    return true;
};

// 覆盖advanceActionValue：角色行动后减少好活层数
window.advanceActionValue = function() {
    const cur = G.actionQueue[G.currentActionIdx];
    if (cur && cur.type === 'ally' && cur.fighter && !cur.isSpirit) {
        if (typeof tickGoodShowLayers === 'function') {
            tickGoodShowLayers(cur.fighter);
        }
    }
    if (typeof _origAdvanceActionValue_feiying === 'function') {
        _origAdvanceActionValue_feiying();
    }
};

// 覆盖buildActionQueue：加入绯英初始化、累计值显示、易伤持续
window.buildActionQueue = function() {
    G.fighters.forEach(f => {
        if (f.charId === 'feiying' && f.alive && !f._feiyingInited) {
            initFeiyingFighter(f);
            f._feiyingInited = true;
        }
        if (f.path === '欢愉' && f.alive && !f.goodShowList) {
            initGoodShowList(f);
        }
        if (f.charId === 'feiying' && f.alive) {
            updateFeiyingHuanleDu(f);
        }
    });

    G.enemies.forEach(e => {
        if (e.debuff_fox && e.debuff_foxDuration > 0) {
            e.debuff_foxDuration--;
            if (e.debuff_foxDuration <= 0) e.debuff_fox = 0;
        }
        if (e.debuff_feiyingLC && e.debuff_feiyingLCDuration > 0) {
            e.debuff_feiyingLCDuration--;
            if (e.debuff_feiyingLCDuration <= 0) e.debuff_feiyingLC = 0;
        }
    });

    if (typeof _origBuildActionQueue_feiying === 'function') {
        _origBuildActionQueue_feiying();
    }
};

// ========== 绯英终结技目标选择 ==========
function showFeiyingUltTargetChoice(fighter) {
    const enemies = getAliveEnemies();
    if (!enemies.length) { executeFeiyingUlt(fighter, null); return; }
    const c = document.getElementById('skillButtons');
    let h = '<span style="color:#ffd966;font-size:13px;">绯英终结技 - 选择主目标:</span>';
    enemies.forEach(e => {
        h += '<button class="btn btn-primary" data-enemy-id="' + e.id + '" data-char-id="' + fighter.charId + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;">' +
            '<span>' + e.name + '</span><span style="font-size:9px;color:#ff7766;">HP ' + Math.round(e.hp) + '/' + Math.round(e.maxHp) + '</span></button>';
    });
    h += '<button class="btn btn-warning" id="btnFeiyingUltRelease">释放</button>';
    c.innerHTML = h;

    c.querySelectorAll('button[data-enemy-id]').forEach(btn => {
        btn.addEventListener('click', function() {
            this.disabled = true;
            const charId = this.getAttribute('data-char-id');
            const f = getAllyById(charId);
            const target = getEnemyById(this.getAttribute('data-enemy-id'));
            if (f && f.alive) executeFeiyingUlt(f, target);
        });
    });
    document.getElementById('btnFeiyingUltRelease').addEventListener('click', () => executeFeiyingUlt(fighter, null));
}

// ========== 修改showEnemySelection：支持绯英战技 ==========
var _origShowEnemySelection_feiying = window.showEnemySelection;
window.showEnemySelection = function(fighter, skillKey) {
    if (skillKey === 'feiyingSkill') {
        const en = getAliveEnemies();
        if (!en.length) { addLog('系统', '没有敌人'); return; }
        const c = document.getElementById('skillButtons');
        let h = '<span style="color:#aabbdd;font-size:12px;">选择战技目标 (' + fighter.name + ')</span>';
        en.forEach(e => {
            const pct = Math.round(e.hp / e.maxHp * 100);
            h += '<button class="btn" data-enemy-id="' + e.id + '" data-skill="feiyingSkill" data-char-id="' + fighter.charId + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:140px;padding:4px 10px;">' +
                '<span>' + e.name + '</span><span style="font-size:9px;color:#ff7766;">HP ' + Math.round(e.hp) + '/' + Math.round(e.maxHp) + ' (' + pct + '%)</span></button>';
        });
        h += '<button class="btn btn-danger" id="btnCancelAction">取消</button>';
        c.innerHTML = h;

        c.querySelectorAll('button[data-enemy-id]').forEach(btn => {
            btn.addEventListener('click', function() {
                this.disabled = true;
                const enemyId = this.getAttribute('data-enemy-id');
                const charId = this.getAttribute('data-char-id');
                const f = getAllyById(charId);
                const t = getEnemyById(enemyId);
                if (f && f.alive && t && t.alive) {
                    executeFeiyingSkill(f, t);
                }
            });
        });
        document.getElementById('btnCancelAction').addEventListener('click', function() {
            const cf = getCurrentFighter();
            if (cf && cf.alive) showSkillSelection(cf);
            else { G.processing = false; setTimeout(() => processNextAction(), 100); }
        });
        return;
    }
    if (typeof _origShowEnemySelection_feiying === 'function') {
        _origShowEnemySelection_feiying(fighter, skillKey);
    }
};

// ========== 修改startBattle：加入绯英初始化与秘技 + 开局累计触发 ==========
var _origStartBattle_feiying = window.startBattle;
window.startBattle = function() {
    _origStartBattle_feiying();

    setTimeout(function() {
        const feiying = getAllyById('feiying');
        if (feiying && feiying.alive) {
            initFeiyingFighter(feiying);
            feiying._feiyingInited = true;

            const enemies = getAliveEnemies();
            enemies.forEach(e => {
                const r = calcDamage(feiying, e, feiying.baseAtk * 1.0, '物理', feiying.label, false);
                e.hp = Math.max(0, e.hp - r.finalDmg);
                if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
            });
            addGoodShowLayer(feiying, 20, 2);
            addLog('系统', '绯英秘技触发：造成100%物理伤害，获得20好活当赏', 'buff');
            onFeiyingGoodShowGained(feiying, 20);

            const initialEnergy = Math.round(feiying.maxEnergy * 0.5);
            if (initialEnergy > 0) {
                addLog('系统', '绯英开局50%能量(' + initialEnergy + ')计入狐狸老师累计值', 'buff');
                onFeiyingEnergyGained(feiying, initialEnergy);
            }
        }
    }, 200);
};

</script>
