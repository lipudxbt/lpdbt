// ========== 覆盖 buildActionQueue：加入阿哈时刻 ==========
function buildActionQueue() {
    const u = [];

    G.fighters.forEach(f => {
        if (!f.alive) return;

        if (f.charId === 'qingge' && G.qinggeFeverActive) {
            if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
                u.push({
                    type: 'ally', charId: f.charId, name: f.spirit.name,
                    avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                    fighter: f, isSpirit: true, extra: false
                });
            }
            return;
        }

        u.push({
            type: 'ally', charId: f.charId, name: f.name,
            avatar: f.avatar, spd: f.spd, av: f.av,
            fighter: f, isSpirit: false, extra: false
        });

        if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
            u.push({
                type: 'ally', charId: f.charId, name: f.spirit.name,
                avatar: 'spirit', spd: f.spirit.spd, av: f.spirit.av,
                fighter: f, isSpirit: true, extra: false
            });
        }
    });

    G.enemies.forEach(e => {
        if (e.alive) {
            u.push({
                type: 'enemy', enemyId: e.id, name: e.name,
                avatar: 'enemy', spd: e.spd, av: e.av,
                enemy: e, extra: false
            });
        }
    });

    addAhaToActionQueue(u);

    if (G.qinggeFeverActive) {
        u.push({
            type: 'countdown', charId: 'qingge_countdown', name: '倒计时',
            avatar: 'spirit', spd: 140, av: G.qinggeCountdownAv || 0, extra: false
        });
    }

    if (G.extraTurns.length) {
        const seen = new Set();
        G.extraTurns = G.extraTurns.filter(e => {
            const key = e.charId + (e.isSpirit ? '_spirit' : '');
            if (seen.has(key)) return false;
            seen.add(key);
            return e.fighter && e.fighter.alive && (!e.isSpirit || (e.fighter.spirit && e.fighter.spirit.alive));
        });
        G.extraTurns.forEach(e => {
            u.push({
                type: 'ally', charId: e.charId, name: e.name + ' ⭐',
                avatar: e.avatar || 'spirit', spd: 9999, av: 0,
                fighter: e.fighter, isSpirit: e.isSpirit || false, extra: true
            });
        });
        G.extraTurns = [];
    }

    u.sort((a, b) => a.av - b.av);
    G.actionQueue = u;
    G.currentActionIdx = 0;
}

// ========== 覆盖 executeUlt：加入火花终结技分支 ==========
function executeUlt(fighter) {
    if (!fighter || !fighter.alive) return;
    const cd = CHAR_DATA[fighter.charId];

    G.ultSelecting = G.ultSelecting || {};
    G.ultSelecting[fighter.charId] = true;

    if (fighter.charId === 'huohua') {
        if (fighter.energy < fighter.maxEnergy) {
            addLog('系统', '❌ 能量不足');
            G.ultSelecting[fighter.charId] = false;
            G.isUltInterrupt = false;
            return;
        }
        if (G.huohuaTrapInProgress) {
            // 互动陷阱期间大招只排队，不立即释放
            G.ultSelecting[fighter.charId] = false;
            G.isUltInterrupt = false;
            return;
        }
        fighter.energy = 0;
        showHuohuaUltTargetChoice(fighter);
        return;
    }

    if (fighter.charId === 'xilian') {
        const need = G.xilianIsFirstUlt ? 24 : 12;
        if ((fighter.zhuiYi || 0) < need) {
            G.isUltInterrupt = false;
            G.ultSelecting[fighter.charId] = false;
            return;
        }
        fighter.zhuiYi -= need;
        addLog('系统', `✨ 昔涟 使用了【${cd.skills.ultimate.name}】`, 'skill-use');

        if (G.xilianIsFirstUlt) {
            if (!fighter.spirit || !fighter.spirit.alive) summonSpirit(fighter);
            G.fighters.forEach(f => {
                if (f.alive && f.charId !== 'xilian') {
                    f.energy = f.maxEnergy;
                    addLog('系统', `⚡ 昔涟激活 ${f.name} 终结技!`);
                }
            });
            G.xilianInPastRipple = true;
            fighter.inPastRipple = true;
            G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };
            G.fieldEffects.xilianField = { desc: '附加24%真实伤害', duration: 999 };
            G.xilianIsFirstUlt = false;
            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            fighter.zhuiYi = Math.min(fighter.zhuiYi + 12, 27);
            addLog('系统', `📖 全队充能: 昔涟追忆+12 (${fighter.zhuiYi}/27)`);
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        } else {
            if (!G.xilianInPastRipple) {
                G.xilianInPastRipple = true;
                fighter.inPastRipple = true;
                G.fieldEffects.xilianUlt = { desc: '暴击率+50%', duration: 999 };

            G.xilianStory = Math.min((G.xilianStory || 0) + 1, 3);
            if (G.xilianStory >= 3) {
                G.xilianStory = 0;
                G.extraTurns.push({ charId: 'xilian_spirit', name: '德谬歌 (故事触发)', avatar: 'spirit', fighter: fighter, isSpirit: true });
            }
            giveFutureToAllies();
            showXilianUltChoice(fighter);
            return;
        }
    }

    if (fighter.charId === 'qingge') {
        showQinggeUltTargetChoice(fighter);
        return;
    }
    if (fighter.charId === 'changye') {
        showEnemyUltChoice(fighter);
        return;
    }
    if (fighter.charId === 'fengjin') {
        showAllyUltChoice(fighter);
        return;
    }
}

window.calcDamage = function(attacker, defender, baseDmg, element, sourceLabel, isSpirit) {
    isSpirit = isSpirit || false;
    updateFighterStats(attacker);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    let dmgBonus = 1;
    if (element === '冰') dmgBonus += (attacker.elemIce || 0) / 100;
    else if (element === '风') dmgBonus += (attacker.elemWind || 0) / 100;
    else if (element === '火') dmgBonus += (attacker.elemFire || 0) / 100;
    else if (element === '物理') dmgBonus += (attacker.elemPhysical || 0) / 100;
    else if (element === '虚数') dmgBonus += (attacker.elemImaginary || 0) / 100;
    else dmgBonus += (attacker.elemOther || 0) / 100;
    if (attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    if (isSpirit && attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    const cy = getAllyById('changye');
    if (cy && cy.alive && cy.spirit && cy.spirit.alive && (attacker.charId === 'changye' || (isSpirit && attacker.charId === 'changye'))) dmgBonus += 0.50;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let finalDmg = baseDmg * defMulti * resistMulti * dmgBonus * critMulti;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    finalDmg *= vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (sourceLabel && finalDmg > 0) recordDamage(sourceLabel, finalDmg);
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '物理';
    updateFighterStats(attacker);
    recalculateHuanleDu();
    const base = 7535.107 * skillMultiplier;
    const huanleDuPercent = G.huanleDu;
    const huanleMulti = 1 + huanleDuPercent / 100;
    const zengxiaoMulti = 1 + G.zengxiao / 100;
    let xiaodian;
    if (G.ahaMomentInProgress) xiaodian = getCurrentXiaodian();
    else xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.onAllyAttack = function(attacker) {

function getYaoguangHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'yaoguang' || !fighter.alive) return 0;
    let bonus = 0;
    if (fighter.spd >= 120) {
        bonus += 30;
        const over = Math.min(fighter.spd - 120, 200);
        bonus += over;
    }
    return bonus;
}

function updateYaoguangHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'yaoguang') return;
    const baseHuanle = (fighter.bonusHuanle || 0);
    const traceBonus = getYaoguangHuanleDu(fighter);
    fighter.huanleDu = baseHuanle + traceBonus;
}

function getFighterHuanleDu(fighter) {
    if (!fighter || !fighter.alive) return 0;
    let huanleDu = fighter.huanleDu || 0;
    if (G.yaoguangField && G.yaoguangField.duration > 0 && fighter.charId !== G.yaoguangField.owner) {
        const yaoguang = getAllyById(G.yaoguangField.owner);
        if (yaoguang && yaoguang.alive) {
            const bonus = (yaoguang.huanleDu || 0) * (G.yaoguangField.bonusPercent / 100);
            huanleDu += bonus;
        }
    }
    return huanleDu;
}

function executeYaoguangBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【雀翎鸣镝，过招有喜】', 'skill-use');

    const en = getAliveEnemies();
    const targetIdx = en.findIndex(e => e.id === target.id);
    if (targetIdx === -1) return;

    let totalDmg = 0, totalTrueX = 0;
    const rMain = calcDamage(fighter, target, fighter.baseAtk * 0.9, '物理', fighter.label, false);
    target.hp = Math.max(0, target.hp - rMain.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    totalDmg += rMain.finalDmg;
    totalTrueX += rMain.trueDmgXilian;

    const adjIndices = [];
    if (targetIdx > 0) adjIndices.push(targetIdx - 1);
    if (targetIdx < en.length - 1) adjIndices.push(targetIdx + 1);
    for (const idx of adjIndices) {
        const adj = en[idx];
        if (!adj.alive) continue;
        const rAdj = calcDamage(fighter, adj, fighter.baseAtk * 0.3, '物理', fighter.label, false);
        adj.hp = Math.max(0, adj.hp - rAdj.finalDmg);
        if (adj.hp <= 0) { adj.alive = false; addLog('系统', adj.name + ' 被击败'); }
        totalDmg += rAdj.finalDmg;
        totalTrueX += rAdj.trueDmgXilian;
    }

    addLog('战斗', fighter.name + ' 普攻 -> ' + target.name + '及相邻 ' + totalDmg + ' 总伤害', 'dmg-physical');
    if (totalTrueX > 0) addLog('系统', '昔涟真伤+' + totalTrueX, 'dmg-true');

    // 回能30
    fighter.energy = Math.min(fighter.energy + Math.round(30 * (1 + getEnergyRechargeBonus())), fighter.maxEnergy);
    G.sp = Math.min(G.sp + 1, G.maxSp);

    if (G.yaoguangField && G.yaoguangField.duration > 0) {
        addXiaodian(3);
        addLog('系统', '结界：爻光普攻获得3笑点', 'buff');
    }

    const hitTargets = [target, ...adjIndices.map(i => en[i])];
    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, hitTargets, false);

    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function triggerDajiDali(attacker, hitTargets, consumedSP) {
    const yaoguang = getAllyById('yaoguang');
    if (!yaoguang || !yaoguang.alive) return;
    if (!yaoguang.goodShow || yaoguang.goodShow.duration <= 0) return;

    const aliveTargets = hitTargets.filter(t => t && t.alive);
    if (aliveTargets.length === 0) return;

    const target = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];
    const attackerElement = attacker.element || '物理';
    const huanleDmg = calcHuanleDamage(attacker, target, 0.20, attackerElement);
    target.hp = Math.max(0, target.hp - huanleDmg.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    addLog('系统', '大吉大利（' + attacker.name + '·' + attackerElement + '）：欢愉伤害：' + huanleDmg.finalDmg, 'dmg-true');

    if (consumedSP) {
        const aliveTargets2 = getAliveEnemies().filter(t => t.alive);
        if (aliveTargets2.length > 0) {
            const target2 = aliveTargets2[Math.floor(Math.random() * aliveTargets2.length)];
            const huanleDmg2 = calcHuanleDamage(attacker, target2, 0.20, attackerElement);
            target2.hp = Math.max(0, target2.hp - huanleDmg2.finalDmg);
            if (target2.hp <= 0) { target2.alive = false; addLog('系统', target2.name + ' 被击败'); }
            addLog('系统', '大吉大利·额外（消耗战技点）：欢愉伤害：' + huanleDmg2.finalDmg, 'dmg-true');
        }
    }
}

function executeYaoguangHuanleSkill(fighter) {

        const ultBtn = document.getElementById('btnUlt');

window.doUlt = function(charId) {

    if (!f || !f.alive) return;
    if (charId === 'yaoguang') {

window.processPendingUlts = function() {
    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
        if (G.isUltInterrupt) return true;
        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return true;
    }
    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;
    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();
    if (f.charId === 'xilian') {
        if ((f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
            addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    } else if (f.charId === 'yinlang') {
        // 银狼不检查能量
    } else if (f.charId !== 'yaoguang') {
        if (f.energy < f.maxEnergy) {
            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    }
    G.isUltInterrupt = true;
    executeUlt(f);
    return true;
};

// 修复：额外阿哈时刻银狼欢愉技替换与隐藏分
function executeExtraAhaMoment(extraAha) {
    G.ahaMomentInProgress = true;
    const huanleFighters = getHuanleFighters().slice().sort((a,b)=>(a.paramNum||999)-(b.paramNum||999));
    addLog('系统', '额外阿哈时刻开始', 'special');

    const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
    if (yinlang && yinlang.invinciblePlayer) {
        yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
    }

    const fixedXiaodian = extraAha.fixedXiaodian || 0;
    const savedXiaodian = G.ahaMoment.xiaodian;
    G.ahaMoment.xiaodian = fixedXiaodian;

    for (const f of huanleFighters) {
        if (!f.alive) continue;
        if (typeof f.huanleSkill === 'function') {
            f.huanleSkill();
        }
    }

    G.ahaMoment.xiaodian = savedXiaodian;

    if (yinlang) {
        yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
    }

    huanleFighters.forEach(f => {
        if (f.alive && typeof grantGoodShow === 'function') {
            grantGoodShow(f, fixedXiaodian);
        }
    });
    addLog('系统', '额外阿哈时刻结束', 'special');
    G.ahaMomentInProgress = false;
    G.isUltInterrupt = false;
    G.processing = false;
    renderAll();
    if (processPendingUlts()) return;
    const cf = getCurrentFighter();
    if (cf) showSkillSelection(cf);
    else setTimeout(() => processNextAction(), 100);
}

    originalUpdateFighterStats_hc(f);

// ========== 覆盖 calcHuanleDamage：加入无视防御 ==========
window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '火';
    // 调用原函数（但原函数可能已经被爻光覆盖，这里我们直接调用现有的 calcHuanleDamage）
    // 注意：由于覆盖顺序，这里的 calcHuanleDamage 可能是爻光版或原版，
    // 我们直接在调用前修改 defender.def 来模拟无视防御，这样不影响原函数内部逻辑。
    const originalDef = defender.def;
    if (attacker.charId === 'huohua' && attacker.hasLC && attacker.huohuaLCStacks && attacker.huohuaLCStacks > 0) {
        const ignorePercent = Math.min(attacker.huohuaLCStacks, 4) * 0.05;
        defender.def = defender.def * (1 - ignorePercent);
    }
    // 调用当前全局的 calcHuanleDamage（可能是原版或爻光覆盖版，但已包含物理支持）
    const result = originalCalcHuanleDamage_hc(attacker, defender, skillMultiplier, element);
    // 恢复防御
    defender.def = originalDef;
    return result;
};

// ========== 覆盖 getFighterHuanleDu：加入推流加成 ==========

    const success = originalConsumeSP_hc(fighter, cost);
    if (!success) return false;

    // 火花光锥记录消耗战技点（包括爆点抵扣部分）
    if (fighter.charId === 'huohua' && fighter.hasLC) {
        // 计算实际消耗的战技点量（包括爆点抵扣）
        // 原函数已经扣除了 fighter.baodian 和 G.sp，但我们不知道具体抵扣多少，
        // 这里简化：只要消耗成功，就认为消耗了 cost 个战技点（因为爆点视为消耗战技点）
        fighter.huohuaLCStacks = Math.min((fighter.huohuaLCStacks || 0) + cost, 4);
        fighter.huohuaSPThisRound = (fighter.huohuaSPThisRound || 0) + cost;

window.calcDamage = function(attacker, defender, baseDmg, element, sourceLabel, isSpirit) {
    isSpirit = isSpirit || false;
    updateFighterStats(attacker);
    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    let dmgBonus = 1;
    if (element === '冰') dmgBonus += (attacker.elemIce || 0) / 100;
    else if (element === '风') dmgBonus += (attacker.elemWind || 0) / 100;
    else if (element === '火') dmgBonus += (attacker.elemFire || 0) / 100;
    else if (element === '物理') dmgBonus += (attacker.elemPhysical || 0) / 100;
    else if (element === '虚数') dmgBonus += (attacker.elemImaginary || 0) / 100;
    else dmgBonus += (attacker.elemOther || 0) / 100;
    if (attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    if (isSpirit && attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    const cy = getAllyById('changye');
    if (cy && cy.alive && cy.spirit && cy.spirit.alive && (attacker.charId === 'changye' || (isSpirit && attacker.charId === 'changye'))) dmgBonus += 0.50;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let finalDmg = baseDmg * defMulti * resistMulti * dmgBonus * critMulti;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    finalDmg *= vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }
    if (sourceLabel && finalDmg > 0) recordDamage(sourceLabel, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '虚数';
    updateFighterStats(attacker);
    if (attacker.charId === 'yinlang') updateYinlangHuanleDu(attacker);
    recalculateHuanleDu();
    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    if (attacker.charId === 'yinlang' && attacker.hasLC) ignoreDef += 20;
    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);
    const base = 7535.107 * skillMultiplier;
    const huanleDuPercent = attacker.huanleDu || 0;
    const huanleMulti = 1 + huanleDuPercent / 100;
    const zengxiaoMulti = 1 + G.zengxiao / 100;
    let xiaodian;
    if (G.ahaMomentInProgress) xiaodian = getCurrentXiaodian();
    else xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }
    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

// ========== 银狼技能 ==========
function executeYinlangBasic(fighter, target) {

function executeYinlangUlt(fighter) {

// ========== 强化普攻状态机 ==========
let yinlangEnhancedState = null;

function startYinlangEnhancedBasic(fighter) {
    if (!fighter || !fighter.alive) return;
    G.yinlangEnhancedInProgress = true;
    yinlangEnhancedState = {
        phase: 'burst',
        currentSegment: 0,
        totalSegments: 100,
        accumulatedDamage: 0,
        blindboxCount: 0,
        pendingBlindbox: false,
        fighter: fighter
    };
    fighter.enhancedBasicPhase = 0;
    fighter.blindboxTriggerCount = 0;
    addLog('系统', '银狼强化普攻开始：奖励关「狼尊时刻」', 'skill-use');
    continueYinlangEnhancedBasic();
}

function continueYinlangEnhancedBasic() {
    if (!yinlangEnhancedState) return;
    const state = yinlangEnhancedState;
    const fighter = state.fighter;
    if (!fighter || !fighter.alive) return;

    if (state.phase === 'burst') {
        const availableTargets = getAliveEnemies();
        if (availableTargets.length === 0) {
            executeYinlangFinalHit(fighter, state.accumulatedDamage);
            return;
        }

        let targetSegment = 50;
        if (state.blindboxCount === 1) targetSegment = 75;
        else if (state.blindboxCount === 2) targetSegment = 100;

        const endSegment = Math.min(targetSegment, state.currentSegment + 5);
        while (state.currentSegment < endSegment) {
            state.currentSegment++;
            const target = availableTargets[Math.floor(Math.random() * availableTargets.length)];
            const extraLayers = Math.min(Math.floor((fighter.hiddenScore || 0) / 60), 2);
            const damageMult = 0.024 * (1 + extraLayers * 0.15);
            let r;
            if (fighter.goodShow && fighter.goodShow.xiaodian > 0) {
                r = calcHuanleDamage(fighter, target, damageMult, '虚数');
            } else {
                r = calcDamage(fighter, target, fighter.baseAtk * damageMult, '虚数', fighter.label, false);
            }
            if (target.alive) {
                target.hp = Math.max(0, target.hp - r.finalDmg);
                if (target.hp <= 0) target.alive = false;
            }
            state.accumulatedDamage += r.finalDmg;
        }
        updateYinlangBurstLog(fighter, state.accumulatedDamage);

        if (state.currentSegment >= targetSegment) {
            state.phase = 'pause';
            state.blindboxCount++;
            showYinlangBlindboxButton(fighter);
        } else {
            setTimeout(() => continueYinlangEnhancedBasic(), 30);
        }
    }
}

function triggerYinlangBlindbox() {
    if (!yinlangEnhancedState || yinlangEnhancedState.phase !== 'pause') return;
    const state = yinlangEnhancedState;
    const fighter = state.fighter;
    if (!fighter || !fighter.alive) return;

    executeYinlangBlindbox(fighter, state.accumulatedDamage);

    if (state.blindboxCount < 3) {
        state.phase = 'burst';
        setTimeout(() => continueYinlangEnhancedBasic(), 30);
    } else {
        state.phase = 'final';
        setTimeout(() => {
            executeYinlangFinalHit(fighter, state.accumulatedDamage);
        }, 30);
    }
}

function executeYinlangFinalHit(fighter, accumulatedDamage) {
    const enemies = getAliveEnemies();
    if (enemies.length === 0) {
        G.yinlangEnhancedInProgress = false;
        yinlangEnhancedState = null;
        fighter.invincibleBasicCount = (fighter.invincibleBasicCount || 0) + 1;

        if (fighter.hasLC) {
            fighter.basicCount = (fighter.basicCount || 0) + 1;
            if (fighter.basicCount >= 3) {
                fighter.basicCount = 0;
                fighter.lcXiaodianTriggered = false;
                addLog('系统', '光锥可触发次数已重置');
            }
        }

        if (fighter.invincibleBasicCount >= 3) {
            fighter.invinciblePlayer = false;
            fighter.hiddenScore = 0;
            G.yinlangInvincibleField = null;
            addLog('系统', '银狼退出无敌玩家状态，隐藏分清空');
        }
        fighter.av += calcActionValue(fighter.spd);
        buildActionQueue();
        G.currentActionIdx = 0;
        renderAll();
        if (processPendingUlts()) return;
        G.processing = false;
        setTimeout(() => processNextAction(), 300);
        return;
    }

    const perEnemy = 1.0 / enemies.length;
    let normalDamage = 0;
    enemies.forEach(e => {
        let r;
        if (fighter.goodShow && fighter.goodShow.xiaodian > 0) {
            r = calcHuanleDamage(fighter, e, perEnemy, '虚数');
        } else {
            r = calcDamage(fighter, e, fighter.baseAtk * perEnemy, '虚数', fighter.label, false);
        }
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) e.alive = false;
        normalDamage += r.finalDmg;
    });

    const totalAllDamage = accumulatedDamage + normalDamage;
    addLog('战斗', '银狼强化普攻最后一击普通伤害：' + normalDamage, 'dmg-imaginary');
    if (accumulatedDamage > 0) {
        addLog('系统', '强化普攻欢愉伤害总计：' + accumulatedDamage, 'dmg-true');
    }
    addLog('战斗', '银狼强化普攻总伤害：' + totalAllDamage, 'dmg-imaginary');

    yinlangEnhancedState = null;
    G.yinlangEnhancedInProgress = false;
    fighter.invincibleBasicCount = (fighter.invincibleBasicCount || 0) + 1;

    if (fighter.hasLC) {
        fighter.basicCount = (fighter.basicCount || 0) + 1;
        if (fighter.basicCount >= 3) {
            fighter.basicCount = 0;
            fighter.lcXiaodianTriggered = false;
            addLog('系统', '光锥可触发次数已重置');
        }
    }

    if (fighter.invincibleBasicCount >= 3) {
        fighter.invinciblePlayer = false;
        fighter.hiddenScore = 0;
        G.yinlangInvincibleField = null;
        addLog('系统', '银狼退出无敌玩家状态，隐藏分清空');
    }

    fighter.av += calcActionValue(fighter.spd);
    buildActionQueue();
    G.currentActionIdx = 0;

    renderAll();

    if (processPendingUlts()) {
        return;
    }

    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeYinlangBlindbox(fighter, totalDmg) {
    const targetList = getAliveEnemies();
    if (targetList.length === 0) return;
    const skillMult = 0.90 / targetList.length;
    let huanleTotal = 0;
    targetList.forEach(e => {
        const r = calcHuanleDamage(fighter, e, skillMult, '虚数');
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) e.alive = false;
        huanleTotal += r.finalDmg;
    });
    if (yinlangEnhancedState) {
        yinlangEnhancedState.accumulatedDamage += huanleTotal;
    }
    addLog('系统', '头号补给盲盒欢愉伤害：' + huanleTotal, 'dmg-true');
    triggerBlindboxEffect(fighter, huanleTotal);
}

function triggerBlindboxEffect(fighter, totalDmg) {
    let sp = G.sp;
    let maxSp = G.maxSp;
    let hiddenScore = fighter.hiddenScore || 0;
    // 战技点越低，炸弹概率越高，最高可达90%
    let bombProb = sp < maxSp ? 0.5 + 0.4 * (1 - sp / maxSp) : 0;
    let beanProb = hiddenScore < 300 ? 0.3 * (1 - hiddenScore / 300) + 0.05 : 0.05;
    let swordProb = Math.max(0, 1 - bombProb - beanProb);
    const totalProb = swordProb + bombProb + beanProb;
    swordProb /= totalProb;
    bombProb /= totalProb;
    beanProb /= totalProb;
    const roll = Math.random();
    if (roll < swordProb) {
        const enemies = getAliveEnemies();
        if (enemies.length === 0) return;
        const highestHpEnemy = enemies.sort((a,b) => b.hp - a.hp)[0];
        const trueDmg = Math.round(totalDmg * 0.20);
        highestHpEnemy.hp = Math.max(0, highestHpEnemy.hp - trueDmg);
        if (highestHpEnemy.hp <= 0) highestHpEnemy.alive = false;
        addLog('系统', '超超超大剑触发，对 ' + highestHpEnemy.name + ' 造成 ' + trueDmg + ' 真实伤害', 'dmg-true');
    } else if (roll < swordProb + bombProb) {
        G.sp = Math.min(G.sp + 2, G.maxSp);
        addLog('系统', '爆爆爆炸蛋触发，恢复2战技点');
    } else {
        addXiaodian(3);
        addLog('系统', '怪怪怪味豆触发，获得3笑点');
    }
}

        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return true;

    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;

    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();

    if (f.charId === 'yinlang') {

            addLog('系统', '隐藏分不足，终结技跳过', 'special');
            return processPendingUlts();

function initHuanleFields() {
    if (G.huanleDu === undefined) G.huanleDu = 0;
    if (G.zengxiao === undefined) G.zengxiao = 0;
    if (!G.ahaMoment) {

}

function getHuanleFighters() {
    return G.fighters.filter(f => f.alive && f.path === '欢愉');
}

function getAhaSpeed() {
    const huanleFighters = getHuanleFighters();
    if (huanleFighters.length === 0) return 0;
    const sorted = huanleFighters.slice().sort((a, b) => b.spd - a.spd);
    let speed = 80;
    const weights = [0.2, 0.1, 0.05, 0.02];
    for (let i = 0; i < sorted.length && i < 4; i++) {
        speed += weights[i] * sorted[i].spd;
    }
    return Math.round(speed * 100) / 100;
}

// 不再使用全局汇总欢愉度，删除 recalculateHuanleDu 或保留为空

    // 此函数已弃用，欢愉度按角色独立计算
    // 保留空函数避免其他文件报错
}

function addXiaodian(amount) {
    if (!G.ahaMoment) {
        G.ahaMoment = { active: false, spd: 0, av: 0, xiaodian: 0, scheduledNewXiaodian: 0 };
    }

        onYinlangGetXiaodian(yinlang, amount);
    }
}

function getCurrentXiaodian() {
    return G.ahaMoment && G.ahaMoment.active ? G.ahaMoment.xiaodian : 0;
}

function calcHuanleDamage(attacker, defender, skillMultiplier, element) {
    element = element || '火';
    updateFighterStats(attacker);
    // 确保攻击者自身欢愉度已更新
    if (attacker.path === '欢愉') {
        if (attacker.charId === 'huohua' && typeof updateHuohuaHuanleDu === 'function') updateHuohuaHuanleDu(attacker);
        if (attacker.charId === 'yaoguang' && typeof updateYaoguangHuanleDu === 'function') updateYaoguangHuanleDu(attacker);
        if (attacker.charId === 'yinlang' && typeof updateYinlangHuanleDu === 'function') updateYinlangHuanleDu(attacker);
    }

    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) {
        ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    }
    if (attacker.charId === 'yinlang' && attacker.hasLC) ignoreDef += 20;

    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);

    const base = 7535.107 * skillMultiplier;

    // 使用攻击者自身欢愉度
    const huanleDuPercent = attacker.huanleDu || 0;
    const huanleMulti = 1 + huanleDuPercent / 100;

    const zengxiaoMulti = 1 + G.zengxiao / 100;

    let xiaodian;
    if (G.ahaMomentInProgress) {
        xiaodian = getCurrentXiaodian();
    } else {
        xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    }
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);

    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);

    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;

    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;

    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;

    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);

    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;

    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }

    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
}

function initAhaMoment() {

    // 不再需要全局欢愉度汇总

function processAhaAction() {
    if (!G.ahaMoment.active) return;

    const huanleFighters = getHuanleFighters()
        .slice()
        .sort((a, b) => (a.paramNum || 999) - (b.paramNum || 999));

    addLog('系统', '阿哈时刻开始', 'special');

    const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
    if (yinlang && yinlang.invinciblePlayer) {
        yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
    }

    G.ahaMomentInProgress = true;
    const currentXiaodian = G.ahaMoment.xiaodian;

    for (const f of huanleFighters) {
        if (!f.alive) continue;
        if (typeof f.huanleSkill === 'function') {
            f.huanleSkill();
        }
    }

    G.ahaMomentInProgress = false;

    if (yinlang) {
        yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
    }

    const totalXiaodian = G.ahaMoment.xiaodian;
    huanleFighters.forEach(f => {
        if (f.alive && typeof grantGoodShow === 'function') {
            grantGoodShow(f, totalXiaodian);
        }
    });

    const huanleCount = huanleFighters.length;
    const newXiaodian = huanleCount;
    G.ahaMoment.scheduledNewXiaodian = newXiaodian;
    G.ahaMoment.xiaodian = 0;

    addLog('系统', '阿哈时刻结束，好活当赏按' + totalXiaodian + '笑点计算，为下一次储存' + newXiaodian + '笑点', 'special');

    advanceAhaActionValue();
}

function advanceAhaActionValue() {
    const cur = G.actionQueue[G.currentActionIdx];
    if (!cur || cur.type !== 'aha') return;

    cur.av += calcActionValue(G.ahaMoment.spd);
    G.ahaMoment.av = cur.av;

    G.actionQueue.sort((a, b) => a.av - b.av);
    const idx = G.actionQueue.findIndex(u => u.type === 'aha');
    G.currentActionIdx = idx !== -1 ? idx : 0;

    const topAv = G.actionQueue[0]?.av || 0;
    while (topAv - G.roundStartAV >= G.roundMaxAV) {
        G.roundStartAV += G.roundMaxAV;
        G.round++;
        if (G.round === 1) G.roundMaxAV = 150;
        addLog('系统', '进入第 ' + (G.round + 1) + ' 轮 (' + G.roundMaxAV + '行动值)', 'special');
    }
}

// 最终 buildActionQueue：完整重建，确保阿哈时刻加入、战技点上限、欢愉度独立更新
window.buildActionQueue = function() {
    // 更新火花专武战技点上限
    const huohua = getAllyById('huohua');
    if (huohua && huohua.alive && huohua.hasLC) {
        const huanleCount = getHuanleFighters().length;
        G.maxSp = 5 + Math.min(huanleCount, 3);
    } else {
        G.maxSp = 5;
    }
    if (G.sp > G.maxSp) G.sp = G.maxSp;

    // 更新每个欢愉角色的自身欢愉度
    getHuanleFighters().forEach(f => {
        if (f.charId === 'huohua' && typeof updateHuohuaHuanleDu === 'function') updateHuohuaHuanleDu(f);
        if (f.charId === 'yaoguang' && typeof updateYaoguangHuanleDu === 'function') updateYaoguangHuanleDu(f);
        if (f.charId === 'yinlang' && typeof updateYinlangHuanleDu === 'function') updateYinlangHuanleDu(f);
    });

    // 自动初始化阿哈时刻
    if (!G.ahaMoment || G.ahaMoment.active === undefined) {
        initAhaMoment();
    }
    if (getHuanleFighters().length > 0 && (!G.ahaMoment.active || G.ahaMoment.spd === 0)) {
        initAhaMoment();
    }

    const u = [];

    G.fighters.forEach(f => {
        if (!f.alive) return;

        if (f.charId === 'qingge' && G.qinggeFeverActive) {
            if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
                u.push({ type:'ally', charId:f.charId, name:f.spirit.name, avatar:'spirit', spd:f.spirit.spd, av:f.spirit.av, fighter:f, isSpirit:true, extra:false });
            }
            return;
        }

        u.push({ type:'ally', charId:f.charId, name:f.name, avatar:f.avatar, spd:f.spd, av:f.av, fighter:f, isSpirit:false, extra:false });

        if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
            u.push({ type:'ally', charId:f.charId, name:f.spirit.name, avatar:'spirit', spd:f.spirit.spd, av:f.spirit.av, fighter:f, isSpirit:true, extra:false });
        }
    });

    G.enemies.forEach(e => {
        if (e.alive) {
            u.push({ type:'enemy', enemyId:e.id, name:e.name, avatar:'enemy', spd:e.spd, av:e.av, enemy:e, extra:false });
        }
    });

    addAhaToActionQueue(u);

    if (G.extraTurns && G.extraTurns.length) {
        const seen = new Set();
        G.extraTurns = G.extraTurns.filter(e => {
            const key = e.charId + (e.isSpirit ? '_spirit' : '');
            if (seen.has(key)) return false;
            seen.add(key);
            return e.fighter && e.fighter.alive && (!e.isSpirit || (e.fighter.spirit && e.fighter.spirit.alive));
        });
        G.extraTurns.forEach(e => {
            u.push({ type:'ally', charId:e.charId, name:e.name + ' ⭐', avatar:e.avatar || 'spirit', spd:9999, av:0, fighter:e.fighter, isSpirit:e.isSpirit || false, extra:true });
        });
        G.extraTurns = [];
    }

    u.sort((a, b) => a.av - b.av);
    G.actionQueue = u;
    G.currentActionIdx = 0;
};

function addToTeam(charId) {

function renderActionBar() {
    const c = document.getElementById('actionBar');
    const q = G.actionQueue || [];
    if (q.length === 0) {
        c.innerHTML = '<span class="label">第' + (G.round + 1) + '轮 (0/' + G.roundMaxAV + ')</span>';
        return;
    }
    const cur = q[G.currentActionIdx];
    const curAv = cur ? cur.av : 0;
    const consumed = Math.max(0, curAv - G.roundStartAV);
    let h = '<span class="label">第' + (G.round + 1) + '轮 (' + Math.round(consumed) + '/' + G.roundMaxAV + ')</span>';
    const ms = Math.min(q.length, 10);
    for (let i = 0; i < ms; i++) {
        const it = q[i];
        if (!it) continue;
        const isCur = i === G.currentActionIdx;
        let cls = 'action-slot';
        if (isCur) cls += ' current';
        if (it.extra) cls += ' extra';
        let av = '人';
        if (it.avatar === 'enemy') av = '敌';
        else if (it.avatar === 'spirit') av = '灵';
        else if (it.avatar === 'aha') av = '阿';
        else if (it.avatar) av = it.avatar.charAt(0);
        const displayAv = isCur ? 0 : Math.round(it.av - curAv);
        h += '<div class="' + cls + '"><span class="avatar ' + (it.avatar || '') + '">' + av + '</span>' + it.name + (isCur ? ' 当前' : '') + '<span style="font-size:8px;color:#667799;margin-left:2px;">' + displayAv + '</span></div>';
    }
    if (q.length > 10) h += '<span style="color:#667799;font-size:10px;">+' + (q.length - 10) + '</span>';
    c.innerHTML = h;
}

let currentDetailCharId = null;
let currentDetailSlotIdx = -1;
let showingSpirit = false;

function openCharDetail(slotIdx) {
    currentDetailSlotIdx = slotIdx;
    showingSpirit = false;
    const charId = G.team[slotIdx];
    if (!charId) return;
    currentDetailCharId = charId;
    renderDetailModal();
    document.getElementById('charDetailOverlay').classList.add('show');
}

function closeCharDetail() {
    document.getElementById('charDetailOverlay').classList.remove('show');
}

function toggleDetailSpirit() {
    showingSpirit = !showingSpirit;
    renderDetailModal();
}

function canEdit() {
    return !G.battleActive && !showingSpirit;
}

function isSpdLocked(charId) {
    const bs = BASE_STATS[charId];
    return bs && bs.baseSpd === 0;
}

function formatBonusValue(white, bonus) {
    if (bonus > 0) {
        return white + ' <span style="color:#5fe6a0;">+' + bonus + '</span>';
    } else if (bonus < 0) {
        return white + ' <span style="color:#ff6b6b;">' + bonus + '</span>';
    } else {
        return white;
    }
}

function makeEditableRow(label, charId, key, whiteValue, bonusValue, unit, locked) {
    locked = locked || false;
    const editable = canEdit() && !locked;
    const valueHtml = editable
        ? '<span class="editable-value" data-char-id="' + charId + '" data-key="' + key + '" data-white="' + whiteValue + '" data-bonus="' + bonusValue + '" style="cursor:pointer;' + (bonusValue > 0 ? 'color:#5fe6a0;' : bonusValue < 0 ? 'color:#ff6b6b;' : 'color:#fff;') + '">' + formatBonusValue(whiteValue, bonusValue) + unit + '</span>'
        : '<span style="' + (bonusValue > 0 ? 'color:#5fe6a0;' : bonusValue < 0 ? 'color:#ff6b6b;' : 'color:#fff;') + '">' + formatBonusValue(whiteValue, bonusValue) + unit + (locked ? ' 锁' : '') + '</span>';

    let btns = '';
    if (editable) {
        btns = '<button class="btn btn-sm btn-edit" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:8px;padding:2px 8px;font-size:10px;">编辑</button>' +
            '<button class="btn btn-sm btn-reset" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:6px;padding:2px 8px;font-size:10px;">重置</button>';
    }

    return '<div class="detail-row"><span class="label">' + label + '</span><span class="value">' + valueHtml + btns + '</span></div>';
}

function makeSimpleEditableRow(label, charId, key, currentValue, unit) {
    const editable = canEdit();
    const valueHtml = editable
        ? '<span class="editable-value" data-char-id="' + charId + '" data-key="' + key + '" data-simple="true" style="cursor:pointer;color:#fff;">' + currentValue + unit + '</span>'
        : '<span style="color:#fff;">' + currentValue + unit + '</span>';

    let btns = '';
    if (editable) {
        btns = '<button class="btn btn-sm btn-edit" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:8px;padding:2px 8px;font-size:10px;">编辑</button>' +
            '<button class="btn btn-sm btn-reset" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:6px;padding:2px 8px;font-size:10px;">重置</button>';
    }

    return '<div class="detail-row"><span class="label">' + label + '</span><span class="value">' + valueHtml + btns + '</span></div>';

document.addEventListener('click', function(e) {
    const editBtn = e.target.closest('.btn-edit');
    if (editBtn) {
        e.stopPropagation();
        const charId = editBtn.getAttribute('data-char-id');
        const key = editBtn.getAttribute('data-key');
        const row = editBtn.closest('.detail-row');
        const span = row ? row.querySelector('.editable-value') : null;
        if (!span) return;
        const simple = span.getAttribute('data-simple') === 'true';
        const bonus = parseFloat(span.getAttribute('data-bonus') || '0');
        const current = simple ? span.textContent.replace(/[%]/g, '') : bonus;

        const newVal = prompt('请输入新的 ' + key + ' 值', current);
        if (newVal !== null) {
            const num = parseFloat(newVal);
            if (!isNaN(num)) {
                setBonusStat(charId, key, num);
                renderDetailModal();
                renderAll();
            }
        }
        return;
    }

    const resetBtn = e.target.closest('.btn-reset');
    if (resetBtn) {
        e.stopPropagation();
        const charId = resetBtn.getAttribute('data-char-id');
        const key = resetBtn.getAttribute('data-key');
        resetBonusStat(charId, key);
        renderDetailModal();
        renderAll();
        return;
    }

    const valueSpan = e.target.closest('.editable-value');
    if (valueSpan) {
        const charId = valueSpan.getAttribute('data-char-id');
        const key = valueSpan.getAttribute('data-key');
        const simple = valueSpan.getAttribute('data-simple') === 'true';
        const bonus = parseFloat(valueSpan.getAttribute('data-bonus') || '0');
        const current = simple ? valueSpan.textContent.replace(/[%]/g, '') : bonus;

        const newVal = prompt('请输入新的 ' + key + ' 值', current);
        if (newVal !== null) {
            const num = parseFloat(newVal);
            if (!isNaN(num)) {
                setBonusStat(charId, key, num);
                renderDetailModal();
                renderAll();
            }
        }
    }
});

// ========== 多层好活当赏系统 ==========
function initGoodShowList(fighter) {
    if (!fighter.goodShowList) {
        fighter.goodShowList = [];
    }
    if (!fighter.goodShow) {
        fighter.goodShow = { xiaodian: 0, duration: 0 };
    }
    if (fighter.goodShow.xiaodian > 0 && fighter.goodShowList.length === 0) {
        fighter.goodShowList.push({ xiaodian: fighter.goodShow.xiaodian, duration: fighter.goodShow.duration });
    }
    updateGoodShowSummary(fighter);
}

function updateGoodShowSummary(fighter) {
    if (!fighter.goodShowList) return;
    let total = 0;
    let maxDur = 0;
    fighter.goodShowList = fighter.goodShowList.filter(l => l.duration > 0 && l.xiaodian > 0);
    for (const layer of fighter.goodShowList) {
        total += layer.xiaodian;
        maxDur = Math.max(maxDur, layer.duration);
    }
    fighter.goodShow = { xiaodian: total, duration: maxDur };
}

function addGoodShowLayer(fighter, xiaodian, duration) {
    if (!fighter || !fighter.alive || xiaodian <= 0) return;
    duration = duration || 2;
    initGoodShowList(fighter);
    fighter.goodShowList.push({ xiaodian: xiaodian, duration: duration });
    updateGoodShowSummary(fighter);
}

function getTotalGoodShow(fighter) {
    if (!fighter || !fighter.alive) return 0;
    initGoodShowList(fighter);
    return fighter.goodShow.xiaodian;
}

function hasGoodShow(fighter) {
    return getTotalGoodShow(fighter) > 0;
}

function tickGoodShowLayers(fighter) {
    if (!fighter || !fighter.alive) return;
    initGoodShowList(fighter);
    const removedLayers = [];
    fighter.goodShowList.forEach(layer => {
        layer.duration--;
        if (layer.duration <= 0) {
            removedLayers.push(layer);
        }
    });
    fighter.goodShowList = fighter.goodShowList.filter(l => l.duration > 0);
    updateGoodShowSummary(fighter);

    if (removedLayers.length > 0) {
        const feiying = getAllyById('feiying');
        if (feiying && feiying.alive && fighter.charId !== 'feiying') {
            let totalRemoved = 0;
            removedLayers.forEach(l => { totalRemoved += l.xiaodian; });
            const gained = Math.round(totalRemoved * 0.5);
            if (gained > 0) {
                addGoodShowLayer(feiying, gained, 2);
                onFeiyingGoodShowGained(feiying, gained);
                addLog('系统', '行迹3【开不败】：' + fighter.name + '的好活消失，绯英获得' + gained + '好活', 'buff');
            }
        }
    }
}

var _origGrantGoodShow_feiying = window.grantGoodShow;
window.grantGoodShow = function(fighter, xiaodian) {
    if (!fighter || !fighter.alive || xiaodian <= 0) return;
    initGoodShowList(fighter);

    if (fighter.charId !== 'feiying') {
        const feiying = getAllyById('feiying');
        const cd = CHAR_DATA[fighter.charId];
        if (feiying && feiying.alive && cd && cd.paramNum && cd.paramNum < 146) {
            const half = Math.round(xiaodian * 0.5);
            const remaining = xiaodian - half;
            addGoodShowLayer(fighter, remaining, 2);
            if (half > 0) {
                addGoodShowLayer(feiying, half, 2);
                onFeiyingGoodShowGained(feiying, half);
                addLog('系统', '行迹1【瞰众乐】：绯英从' + fighter.name + '处获得' + half + '好活', 'buff');
            }
            updateGoodShowSummary(fighter);
            return;
        }
    }

    addGoodShowLayer(fighter, xiaodian, 2);
    if (fighter.charId === 'feiying') {
        onFeiyingGoodShowGained(fighter, xiaodian);
    }
    updateGoodShowSummary(fighter);
};

    f.goodShow = { xiaodian: 0, duration: 0 };
};

// ========== 绯英欢愉度 ==========
function getFeiyingHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'feiying' || !fighter.alive) return 0;
    const cd = fighter.critDmg || 0.50;
    return Math.round(cd * 100 * 0.20);
}

function updateFeiyingHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'feiying') return;
    updateFighterStats(fighter);
    fighter.huanleDu = getFeiyingHuanleDu(fighter);
}

// ========== 绯英能量与好活双向转换（无上限） ==========
function onFeiyingEnergyGained(fighter, amount) {
    if (!fighter || fighter.charId !== 'feiying' || !fighter.alive) return;
    if (amount <= 0) return;
    if (fighter._feiyingConverting) return;
    fighter._feiyingConverting = true;

    addGoodShowLayer(fighter, amount, 2);
    addLog('系统', '绯英天赋：获得' + amount + '能量，同步获得' + amount + '好活当赏', 'buff');

    const singleAccum = Math.min(amount, 240);
    fighter.energyAccum = Math.min((fighter.energyAccum || 0) + singleAccum, 480);
    checkFoxTrigger(fighter);

    fighter._feiyingConverting = false;
}

function onFeiyingGoodShowGained(fighter, amount) {
    if (!fighter || fighter.charId !== 'feiying' || !fighter.alive) return;
    if (amount <= 0) return;
    if (fighter._feiyingConverting) return;
    fighter._feiyingConverting = true;

    const actualEnergyGain = Math.round(amount * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + actualEnergyGain, fighter.maxEnergy);
    addLog('系统', '绯英天赋：获得' + amount + '好活，同步获得' + actualEnergyGain + '能量', 'buff');

    const singleAccum = Math.min(actualEnergyGain, 240);
    fighter.energyAccum = Math.min((fighter.energyAccum || 0) + singleAccum, 480);
    checkFoxTrigger(fighter);

    fighter._feiyingConverting = false;
}

// ========== 狐狸老师累计值检查 ==========
function checkFoxTrigger(fighter) {
    if (!fighter || fighter.charId !== 'feiying' || !fighter.alive) return;
    if ((fighter.energyAccum || 0) >= 240) {
        fighter.energyAccum -= 240;
        G.feiyingFoxQueue = G.feiyingFoxQueue || [];
        G.feiyingFoxQueue.push({ charId: 'feiying', name: '狐狸老师', fighter: fighter });
        addLog('系统', '累计能量达240，【狐狸老师】追加攻击已加入队列', 'special');
    }
}

// ========== 狐狸老师追加攻击执行 ==========
function executeFoxAttack(fighter) {
    if (!fighter || !fighter.alive) return;
    addLog('系统', fighter.name + ' 的【狐狸老师】发动追加攻击！', 'skill-use');

    const enemies = getAliveEnemies();
    let totalDmg = 0, totalTrueX = 0;

    enemies.forEach(e => {
        const r = calcDamage(fighter, e, fighter.baseAtk * 1.0, '物理', fighter.label, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        totalDmg += r.finalDmg;
        totalTrueX += r.trueDmgXilian;
    });

    let huanleTotal = 0;
    enemies.forEach(e => {
        if (!e.alive) return;
        const h = calcHuanleDamage(fighter, e, 0.25, '物理');
        e.hp = Math.max(0, e.hp - h.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        huanleTotal += h.finalDmg;
        totalTrueX += h.trueDmgXilian;
    });

    addLog('战斗', '狐狸老师追加攻击 -> 全体 ' + totalDmg + ' 物理伤害 + ' + huanleTotal + ' 欢愉伤害', 'dmg-physical');

    enemies.forEach(e => {
        if (e.alive) {
            e.debuff_fox = 12;
            e.debuff_foxDuration = 3;
        }
    });
    addLog('系统', '行迹2【行裁断】：敌方受到伤害提高12%（3回合）', 'buff');

    const foxEnergyGain = Math.round(10 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + foxEnergyGain, fighter.maxEnergy);
    addLog('系统', '狐狸老师为绯英恢复' + foxEnergyGain + '能量', 'buff');
    onFeiyingEnergyGained(fighter, foxEnergyGain);

    onAllyAttack(fighter);
}

// ========== 绯英普攻 ==========
function executeFeiyingBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【课业·突击检查】', 'skill-use');

// ========== 绯英战技 ==========
function executeFeiyingSkill(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
    G.sp--;

    addLog('系统', fighter.name + ' 使用了【风纪·尺出缭判】', 'skill-use');

    addXiaodian(10);
    addLog('系统', '获得10笑点', 'buff');

    const enemies = getAliveEnemies();
    const targetIdx = enemies.findIndex(e => e.id === target.id);
    if (targetIdx === -1) return;

    let totalDmg = 0, totalTrueX = 0;

    const rMain = calcDamage(fighter, target, fighter.baseAtk * 3.0, '物理', fighter.label, false);
    target.hp = Math.max(0, target.hp - rMain.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败!'); }
    totalDmg += rMain.finalDmg;
    totalTrueX += rMain.trueDmgXilian;

    const adjIndices = [];
    if (targetIdx > 0) adjIndices.push(targetIdx - 1);
    if (targetIdx < enemies.length - 1) adjIndices.push(targetIdx + 1);
    for (const idx of adjIndices) {
        const adj = enemies[idx];
        if (!adj.alive) continue;
        const rAdj = calcDamage(fighter, adj, fighter.baseAtk * 1.5, '物理', fighter.label, false);
        adj.hp = Math.max(0, adj.hp - rAdj.finalDmg);
        if (adj.hp <= 0) { adj.alive = false; addLog('系统', adj.name + ' 被击败!'); }
        totalDmg += rAdj.finalDmg;
        totalTrueX += rAdj.trueDmgXilian;
    }

    if (hasGoodShow(fighter)) {
        let huanleTotal = 0;
        const hitTargets = [target, ...adjIndices.map(i => enemies[i])].filter(t => t && t.alive);
        hitTargets.forEach(t => {
            const h = calcHuanleDamage(fighter, t, 0.16, '物理');
            t.hp = Math.max(0, t.hp - h.finalDmg);
            if (t.hp <= 0) { t.alive = false; addLog('系统', t.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });
        if (huanleTotal > 0) addLog('系统', '欢愉伤害：' + huanleTotal, 'dmg-true');
    }

    addLog('战斗', fighter.name + ' 战技 -> ' + target.name + '及相邻 ' + totalDmg + ' 总伤害', 'dmg-physical');

    const energyGain = Math.round(30 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + energyGain, fighter.maxEnergy);
    onFeiyingEnergyGained(fighter, energyGain);

    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, [target, ...adjIndices.map(i => enemies[i])], true);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

// ========== 绯英终结技 ==========
function executeFeiyingUlt(fighter, mainTarget) {
    if (!fighter || !fighter.alive) return;
    if (fighter.energy < 240) {
        addLog('系统', '能量不足，需要240能量');
        G.isUltInterrupt = false;
        G.ultSelecting[fighter.charId] = false;
        renderAll();
        return;
    }

    addLog('系统', fighter.name + ' 使用了【剑歌·神鬼无赦】', 'skill-use');

    fighter.energy = Math.max(0, fighter.energy - 240);
    addLog('系统', '消耗240能量，剩余' + fighter.energy, 'buff');

    const enemies = getAliveEnemies();
    let totalDmg = 0, totalTrueX = 0;

    enemies.forEach(e => {
        const r = calcDamage(fighter, e, fighter.baseAtk * 1.6, '物理', fighter.label, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        totalDmg += r.finalDmg;
        totalTrueX += r.trueDmgXilian;
    });

    const enemyCount = enemies.filter(e => e.alive).length;
    let bounceCount = 5;
    if (enemyCount >= 3) bounceCount = 6;
    else if (enemyCount === 2) bounceCount = 7;
    else if (enemyCount === 1) bounceCount = 9;

    addLog('系统', '行迹1【瞰众乐】：敌人' + enemyCount + '个，弹射次数' + bounceCount, 'buff');

    const bouncedTargets = [];
    for (let i = 0; i < bounceCount; i++) {
        const aliveEnemies = enemies.filter(e => e.alive);
        if (aliveEnemies.length === 0) break;
        const target = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
        const rBounce = calcDamage(fighter, target, fighter.baseAtk * 1.2, '物理', fighter.label, false);
        if (target.alive) {
            target.hp = Math.max(0, target.hp - rBounce.finalDmg);
            if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败!'); }
        }
        totalDmg += rBounce.finalDmg;
        totalTrueX += rBounce.trueDmgXilian;
        bouncedTargets.push(target);
    }

    if (hasGoodShow(fighter)) {
        const xiaodianForCalc = Math.max(getTotalGoodShow(fighter), 480);
        const savedXiaodian = fighter.goodShow.xiaodian;
        fighter.goodShow.xiaodian = xiaodianForCalc;
        updateGoodShowSummary(fighter);

        let huanleTotal = 0;

        enemies.forEach(e => {
            if (!e.alive) return;
            const h = calcHuanleDamage(fighter, e, 0.24, '物理');
            e.hp = Math.max(0, e.hp - h.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });

        bouncedTargets.forEach(t => {
            if (!t.alive) return;
            const h = calcHuanleDamage(fighter, t, 0.28, '物理');
            t.hp = Math.max(0, t.hp - h.finalDmg);
            if (t.hp <= 0) { t.alive = false; addLog('系统', t.name + ' 被击败!'); }
            huanleTotal += h.finalDmg;
            totalTrueX += h.trueDmgXilian;
        });

        fighter.goodShow.xiaodian = savedXiaodian;
        updateGoodShowSummary(fighter);

        if (huanleTotal > 0) addLog('系统', '欢愉伤害：' + huanleTotal + '（按' + xiaodianForCalc + '好活计算）', 'dmg-true');
    }

    addLog('战斗', fighter.name + ' 终结技 -> 总伤害 ' + totalDmg, 'dmg-physical');

    const ultEnergyGain = Math.round(5 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + ultEnergyGain, fighter.maxEnergy);
    onFeiyingEnergyGained(fighter, ultEnergyGain);

    G.ultSelecting[fighter.charId] = false;
    G.isUltInterrupt = false;
    G.processing = false;
    renderAll();

    if (processPendingUlts()) return;

    const cf = getCurrentFighter();
    if (cf) showSkillSelection(cf);
    else setTimeout(() => processNextAction(), 300);
}

// ========== 初始化绯英 ==========
function initFeiyingFighter(f) {
    f.energyAccum = 0;
    f.goodShowList = [];
    f.goodShow = { xiaodian: 0, duration: 0 };
    f.paramNum = 146;
