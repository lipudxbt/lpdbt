    if (fighter.charId === 'yaoguang') {
        if (fighter.energy < fighter.maxEnergy) {
            addLog('系统', '能量不足');
            G.ultSelecting[fighter.charId] = false;
            G.isUltInterrupt = false;
            return;
        }
        showYaoguangUltTargetChoice(fighter);
        return;
    }
    if (typeof originalExecuteUlt_yao === 'function') originalExecuteUlt_yao(fighter);
};

window.doUlt = function(charId) {
    if (!G.battleActive) return;
    const f = getAllyById(charId);
    if (!f || !f.alive) return;
    if (charId === 'yaoguang') {
        if (f.energy < f.maxEnergy) {
            addLog('系统', '能量不足');
            return;
        }
        showYaoguangUltTargetChoice(f);
        return;
    }
    if (typeof originalDoUlt_yao === 'function') originalDoUlt_yao(charId);
};

window.processPendingUlts = function() {
    if (G.pendingExtraAha && G.pendingExtraAha.length > 0) {
        if (G.isUltInterrupt) return true;
        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return true;
    }
    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;
    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();
    if (f.charId === 'xilian') {
        if ((f.zhuiYi || 0) < (G.xilianIsFirstUlt ? 24 : 12)) {
            addLog('系统', f.name + ' 追忆不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    } else if (f.charId === 'yinlang') {
        // 银狼不检查能量
    } else if (f.charId !== 'yaoguang') {
        if (f.energy < f.maxEnergy) {
            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');
            return processPendingUlts();
        }
    }
    G.isUltInterrupt = true;
    executeUlt(f);
    return true;
};

// 额外阿哈时刻银狼欢愉技替换与隐藏分
function executeExtraAhaMoment(extraAha) {
    G.ahaMomentInProgress = true;
    const huanleFighters = getHuanleFighters().slice().sort((a,b)=>(a.paramNum||999)-(b.paramNum||999));
    addLog('系统', '额外阿哈时刻开始', 'special');

    const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
    if (yinlang && yinlang.invinciblePlayer) {
        yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
    }

    const fixedXiaodian = extraAha.fixedXiaodian || 0;
    const savedXiaodian = G.ahaMoment.xiaodian;
    G.ahaMoment.xiaodian = fixedXiaodian;

    for (const f of huanleFighters) {
        if (!f.alive) continue;
        if (typeof f.huanleSkill === 'function') {
            f.huanleSkill();
        }
    }

    G.ahaMoment.xiaodian = savedXiaodian;

    if (yinlang) {
        yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
    }

    huanleFighters.forEach(f => {
        if (f.alive && typeof grantGoodShow === 'function') {
            grantGoodShow(f, fixedXiaodian);
        }
    });
    addLog('系统', '额外阿哈时刻结束', 'special');
    G.ahaMomentInProgress = false;
    G.isUltInterrupt = false;
    G.processing = false;
    renderAll();
    if (processPendingUlts()) return;
    const cf = getCurrentFighter();
    if (cf) showSkillSelection(cf);
    else setTimeout(() => processNextAction(), 100);
}

/* ==================== js/10_huohua_lightcone.js ==================== */
// ============================================================
// 火花专属光锥：花花世界迷人眼 效果补丁
// 独立文件，不修改原有文件
// 效果：
// 1. 暴击伤害+48% 永久（在属性面板显示）
// 2. 战技点上限+欢愉角色数（最多+3），火花阵亡恢复
// 3. 消耗战技点叠层无视防御（永久，最多4层）
// 4. 同回合消耗≥4战技点获得【推流】永久
// 5. 【推流】全体欢愉度提高20%
// ============================================================

// ========== 备份原函数 ==========
var originalUpdateFighterStats_hc = window.updateFighterStats;
var originalCalcHuanleDamage_hc = window.calcHuanleDamage;
var originalGetFighterHuanleDu_hc = window.getFighterHuanleDu;
var originalConsumeSP_hc = window.consumeSP;
var originalBuildActionQueue_hc = window.buildActionQueue;

// ========== 工具：获取队伍中欢愉角色数量 ==========
function getHuanleCountInTeam() {
    return G.fighters.filter(f => f.alive && f.path === '欢愉').length;
}

// ========== 更新战技点上限 ==========
function updateMaxSP() {
    const huohua = getAllyById('huohua');
    if (huohua && huohua.alive && huohua.hasLC) {
        const huanleCount = getHuanleCountInTeam();
        G.maxSp = 5 + Math.min(huanleCount, 3);
    } else {
        G.maxSp = 5;
    }
    // 如果当前战技点超过新上限，则限制
    if (G.sp > G.maxSp) G.sp = G.maxSp;
}

// ========== 覆盖 updateFighterStats：加入光锥暴伤+48% ==========
window.updateFighterStats = function(f) {
    if (!f || !f.alive) return;

    // 调用原函数获取基础计算
    originalUpdateFighterStats_hc(f);

    // 火花光锥永久暴击伤害+48%
    if (f.charId === 'huohua' && f.hasLC) {
        f.critDmg += 0.48;
        // 同步到忆灵（如果有）
        if (f.spirit && f.spirit.alive) {
            f.spirit.critDmg = f.critDmg;
        }
    }
};

// ========== 覆盖 calcHuanleDamage：加入无视防御 ==========
window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '火';
    // 调用原函数（但原函数可能已经被爻光覆盖，这里我们直接调用现有的 calcHuanleDamage）
    // 注意：由于覆盖顺序，这里的 calcHuanleDamage 可能是爻光版或原版，
    // 我们直接在调用前修改 defender.def 来模拟无视防御，这样不影响原函数内部逻辑。
    const originalDef = defender.def;
    if (attacker.charId === 'huohua' && attacker.hasLC && attacker.huohuaLCStacks && attacker.huohuaLCStacks > 0) {
        const ignorePercent = Math.min(attacker.huohuaLCStacks, 4) * 0.05;
        defender.def = defender.def * (1 - ignorePercent);
    }
    // 调用当前全局的 calcHuanleDamage（可能是原版或爻光覆盖版，但已包含物理支持）
    const result = originalCalcHuanleDamage_hc(attacker, defender, skillMultiplier, element);
    // 恢复防御
    defender.def = originalDef;
    return result;
};

// ========== 覆盖 getFighterHuanleDu：加入推流加成 ==========
window.getFighterHuanleDu = function(fighter) {
    if (!fighter || !fighter.alive) return 0;

    // 调用原函数获取基础欢愉度
    let huanleDu = originalGetFighterHuanleDu_hc(fighter);

    // 推流：全队欢愉度提高20%（若有火花推流）
    const huohua = getAllyById('huohua');
    if (huohua && huohua.alive && huohua.hasLC && huohua.tuiLiu) {

/* ==================== js/17_secret_skills.js ==================== */
// ===== js/17_secret_skills.js =====
// 秘技异步循环 + 大招打断处理
// 真珠秘技在战斗开始前独立处理
// ★ 修复：
//   1. 日志文字"秘技阶段" → "开局阶段"
//   2. 额外回合/额外阿哈/阿哈时刻进行中：秘技循环只等待，绝不碰 DOM
//   3. 兜底：卡死 5 秒后强制结束

console.log('[SecretSkills] loaded');

var originalStartBattle_secret = window.startBattle;

// 秘技循环等待计时（防死循环）
var _secretWaitStart = 0;
var _SECRET_MAX_WAIT_MS = 8000;

// ========== 秘技异步循环 ==========
function executeAllSecretSkillsAsync(callback) {
    if (G._secretSkillsRun) {
        if (callback) callback();
        return;
    }
    G._secretSkillsRun = true;
    G.isInSecretExecution = true;
    G._secretCallback = callback;
    G._secretIdx = 0;
    G._secretFighters = G.fighters.slice();
    G._secretWaitingUlt = false;
    _secretWaitStart = 0;
    secretRunNext();
}

function secretRunNext() {
    if (!G._secretSkillsRun) return;
    if (!G.isInSecretExecution) return;

    // ★ 关键：额外回合/额外阿哈/阿哈时刻进行中 → 只等待，不碰 DOM
    var blocked = G.zhenzhuExtraTurnActive || G.extraAhaActive || G.ahaMomentInProgress || G.extraTurnPendingStart;
    if (blocked) {
        if (_secretWaitStart === 0) _secretWaitStart = Date.now();
        // 兜底：等待超时（8秒）→ 强制结束秘技循环
        if (Date.now() - _secretWaitStart > _SECRET_MAX_WAIT_MS) {
            console.warn('[Secret] 等待超时，强制结束秘技循环');
            G.isInSecretExecution = false;
            G._secretSkillsRun = false;
            _secretWaitStart = 0;
            var cb0 = G._secretCallback;
            G._secretCallback = null;
            if (cb0) cb0();
            return;
        }
        setTimeout(secretRunNext, 200);
        return; // ★ 不覆写 DOM
    }
    _secretWaitStart = 0;

    // 有大招待处理/正在处理，暂停秘技循环（也不碰 DOM）
    if (G._secretWaitingUlt
        || G.isUltInterrupt
        || (G.ultSelecting && Object.values(G.ultSelecting).some(v => v))
        || G.ultChoiceOpen) {
        setTimeout(secretRunNext, 200);
        return;
    }

    // 刷新界面为"秘技继续中"（只在真正要执行下一个秘技时才覆写）
    var c1 = document.getElementById('skillButtons');
    if (c1 && G._secretIdx < G._secretFighters.length) {
        var nextF = G._secretFighters[G._secretIdx];
        if (nextF) {
            c1.innerHTML = '<span style="color:#f0c060;font-size:13px;">' + nextF.name + ' 秘技准备中...</span>';
        }
    }

    // 检查排队大招
    if (G.pendingUlts && G.pendingUlts.length > 0) {
        if (secretTryProcessUlt()) {
            G._secretWaitingUlt = true;
            return;
        }
    }

    if (G._secretIdx >= G._secretFighters.length) {
        console.log('[Secret] all done');
        G.isInSecretExecution = false;
        G._secretSkillsRun = false;
        var cb = G._secretCallback;
        G._secretCallback = null;
        if (cb) cb();
        return;
    }

    var f = G._secretFighters[G._secretIdx];
    G._secretIdx++;
    if (!f || !f.alive) { setTimeout(secretRunNext, 0); return; }

    var pauseMs = 1000;
    var label = f.name + ' 秘技释放中...';

    try {
        switch (f.charId) {
            case 'qingge': executeQinggeSecret(f); break;
            case 'xilian': executeXilianSecret(f); break;
            case 'changye': executeChangyeSecret(f); break;
            case 'fengjin': executeFengjinSecret(f); break;
            case 'huohua': executeHuohuaSecret(f); break;
            case 'yaoguang': executeYaoguangSecret(f); pauseMs = 2000; break;
            case 'yinlang': executeYinlangSecret(f); break;
            case 'feiying': executeFeiyingSecret(f); break;
            case 'aha': executeAhaSecret(f); break;
        }
    } catch(e) {
        console.error('[Secret] error in', f.charId, e);
    }

    var c = document.getElementById('skillButtons');
    if (c) c.innerHTML = '<span style="color:#f0c060;font-size:13px;">' + label + '</span>';
    setTimeout(secretRunNext, pauseMs);
}

// ========== 尝试处理排队大招 ==========
function secretTryProcessUlt() {
    // ★ 额外回合/额外阿哈/阿哈时刻/额外回合待启动 → 暂不处理大招
    if (G.zhenzhuExtraTurnActive || G.extraAhaActive || G.ahaMomentInProgress || G.extraTurnPendingStart) {
        return false;
    }
    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    var head = G.pendingUlts[0];
    if (!head) return false;

    var f = getAllyById(head.charId);
    if (!f || !f.alive) { G.pendingUlts.shift(); return false; }

    var canUlt = false;
    if (f.charId === 'xilian') canUlt = (f.zhuiYi || 0) >= (G.xilianIsFirstUlt ? 24 : 12);
    else if (f.charId === 'yinlang') canUlt = (f.hiddenScore || 0) >= 60 && !f.invinciblePlayer;
    else if (f.charId === 'aha') canUlt = (f.yuanli || 0) >= 8;
    else if (f.charId === 'feiying') canUlt = f.energy >= 240;
    else canUlt = f.energy >= f.maxEnergy;

    if (!canUlt) { G.pendingUlts.shift(); return false; }

    G.pendingUlts.shift();
    G._secretWaitingUlt = true;
    G.isUltInterrupt = true;
    G.ultSelecting = G.ultSelecting || {};
    G.ultSelecting[f.charId] = true;
    G._pendingSecretUlt = true;

    if (typeof window.executeUlt === 'function') {
        window.executeUlt(f);
    }
    return true;
}

// ========== 大招执行完后继续秘技 ==========
window.continueSecretPhase = function() {
    if (!G._secretSkillsRun) return;
    G._secretWaitingUlt = false;
    G.isInSecretExecution = true;
    setTimeout(function() {
        secretRunNext();
    }, 200);
};

window.executeAllSecretSkills = function() {
    executeAllSecretSkillsAsync(function() {
        if (typeof renderAll === 'function') renderAll();
    });
};

// ========== startBattle hook ==========
window.startBattle = function() {
    G.isInSecretExecution = true;
    G._secretSkillsExecuted = true;
    originalStartBattle_secret();

    var zz = getAllyById('zhenzhu');
    if (zz && zz.alive) {
        try { executeZhenzhuSecret(zz); } catch(e) { console.error('[Secret] zhenzhu error', e); }
    }

    setTimeout(function() {
        executeAllSecretSkillsAsync(function() {
            setTimeout(function() {
                G.isInSecretExecution = false;
                if (typeof renderAll === 'function') renderAll();
                if (G.battleActive) {
                    if (typeof buildActionQueue === 'function') buildActionQueue();
                    G.currentActionIdx = 0;
                    if (typeof processPendingUlts === 'function') {
                        if (processPendingUlts()) return;
                    }
                    setTimeout(function() {
                        if (typeof processNextAction === 'function') processNextAction();
                    }, 300);
                }
            }, 300);
        });
    }, 100);
};

// ========== 各角色秘技实现 ==========

function executeQinggeSecret(f) {
    f.av = f.av * 0.8;
    addQinggeAtmosphere(6, f);
    G.fieldEffects.qinggeSecretDmgBuff = { duration: 2, value: 30 };
    addLog('系统', '晴歌秘技触发：行动提前20%，获得6气氛值，全体伤害提高30%');
}

function executeXilianSecret(f) {
    G.fieldEffects.xilianField = { desc: '附加24%真实伤害', duration: 2 };
    addLog('系统', '昔涟秘技触发：展开战技结界');
}

function executeChangyeSecret(f) {
    var baseCd = f.baseCritDmg || 0.50;
    var mc = G.team.filter(function(id) { return id !== null; }).length;
    var t3 = mc >= 4 ? 0.65 : mc === 3 ? 0.50 : mc === 2 ? 0.15 : 0.05;
    var critBonus = baseCd * 0.24 + t3;
    G.fighters.forEach(function(fighter) {
        if (fighter.spirit && fighter.spirit.alive) {
            fighter.buffs = fighter.buffs || {};
            fighter.buffs.changyeSkill = { desc: '忆灵暴伤+' + Math.round(critBonus * 100) + '%', duration: 2, critDmgBonus: critBonus };
        }
    });
    addYiZhiToChangye(1, '秘技');
    addLog('系统', '长夜月秘技触发：忆灵暴伤提高，获得1忆质');
}

function executeFengjinSecret(f) {
    var heal = Math.round(f.baseHp * 0.30 + 600);
    G.fighters.forEach(function(fighter) {
        if (fighter.alive) {
            var oldHp = fighter.hp;
            fighter.hp = Math.min(fighter.maxHp, fighter.hp + heal);
            if (fighter.hp > oldHp) {
                G.fengjinCumulativeHeal += fighter.hp - oldHp;
            }
        }
    });
    G.fengjinSecretHpBuff = { duration: 2 };
    G.fighters.forEach(function(fighter) {
        if (!fighter.alive) return;
        if (!fighter._secretHpBonus) {
            var bonus = Math.round(fighter.baseHp * 0.20);
            fighter.maxHp += bonus;
            fighter.hp += bonus;
            fighter._secretHpBonus = bonus;
        }
    });
    addLog('系统', '风堇秘技触发：全队回复' + heal + '生命，生命上限提高20%');
}

function executeHuohuaSecret(f) {
    var enemies = getAliveEnemies();
    var totalDmg = 0;
    enemies.forEach(function(e) {
        var r = calcDamage(f, e, f.baseAtk * 0.5, '火', f.label || f.name, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
        totalDmg += r.finalDmg;
    });
    if (totalDmg > 0) addLog('战斗', '火花秘技造成 ' + totalDmg + ' 伤害');
    G.sp = Math.min(G.sp + 2, G.maxSp);
    addLog('系统', '火花秘技触发：恢复2战技点');
}

function executeYaoguangSecret(f) {
    if (G.yaoguangField && G.yaoguangField.duration > 0) {
        G.yaoguangField.duration = 3;
    } else {
        G.yaoguangField = { duration: 3, bonusPercent: 20, owner: f.charId };
    }
    f.energy = Math.min(f.energy + Math.round(30 * (1 + getEnergyRechargeBonus(f))), f.maxEnergy);
    addXiaodian(3);
    addLog('系统', '爻光秘技触发：自动展开结界，获得3笑点');
}

function executeYinlangSecret(f) {
    var enemies = getAliveEnemies();
    if (enemies.length === 0) return;
    var savedGoodShow = f.goodShow;
    f.goodShow = { xiaodian: 99, duration: 2 };
    var totalHuanle = 0;
    enemies.forEach(function(e) {
        var r = calcHuanleDamage(f, e, 0.90, '虚数');
        if (e.alive) {
            e.hp = Math.max(0, e.hp - r.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
        }
        totalHuanle += r.finalDmg;

    addLog('系统', '银狼秘技触发：欢愉伤害 ' + totalHuanle);

function executeFeiyingSecret(f) {

        G.fieldEffects.qinggeSecretDmgBuff.duration--;
        if (G.fieldEffects.qinggeSecretDmgBuff.duration <= 0) G.fieldEffects.qinggeSecretDmgBuff = null;
    }
    if (G.fengjinSecretHpBuff && G.fengjinSecretHpBuff.duration > 0) {
        G.fengjinSecretHpBuff.duration--;
        if (G.fengjinSecretHpBuff.duration <= 0) {
            G.fighters.forEach(function(fighter) {
                if (fighter.alive && fighter._secretHpBonus) {
                    fighter.maxHp -= fighter._secretHpBonus;
                    if (fighter.hp > fighter.maxHp) fighter.hp = fighter.maxHp;
                    fighter._secretHpBonus = 0;
                }
            });
            G.fengjinSecretHpBuff = null;
        }
    }
    if (typeof originalBuildActionQueue_secret === 'function') originalBuildActionQueue_secret();
};

function getYinlangHuanleDu(fighter) {
    if (!fighter || fighter.charId !== 'yinlang' || !fighter.alive) return 0;
    let bonus = 0;
    if (fighter.spd >= 160) {
        bonus += 50;
        const over = Math.min(fighter.spd - 160, 100);
        bonus += over * 2;
    }
    return bonus;

function addYinlangHiddenScore(fighter, amount) {

function updateYinlangHiddenScoreStats(fighter) {
    if (!fighter || fighter.charId !== 'yinlang') return;

    if (score * 0.004 > 1.0) {
        const overflowScore = score - 250;
        cdBonus = overflowScore * 0.008;
    }
    fighter.hiddenScoreCritRate = crBonus;
    fighter.hiddenScoreCritDmg = cdBonus;
}

var _origCalcDamage_yinlang = window.calcDamage;

window.updateFighterStats = function(f) {
    if (!f || !f.alive) return;
    _origUpdateFighterStats_yinlang(f);
    if (f.charId === 'yinlang') {
        const baseSpd = f.baseSpdRecord || 110;
        const targetSpd = f.hasLC ? Math.round(baseSpd * 1.18) : baseSpd;
        if (f.spd !== targetSpd) {
            if (!f._ylSpeedFixed) {
                f._ylSpeedFixed = true;
                console.log('[YL-DIAG] 速度修正: baseSpdRecord=' + baseSpd + ' hasLC=' + f.hasLC + ' 原spd=' + f.spd + ' → ' + targetSpd);
            }
            f.spd = targetSpd;
        }
        updateYinlangHiddenScoreStats(f);
        if (f.hiddenScoreCritRate) f.critRate = Math.min(f.critRate + f.hiddenScoreCritRate, 1.0);
        if (f.hiddenScoreCritDmg) f.critDmg += f.hiddenScoreCritDmg;
    }
    if (f.elemImaginary === undefined) f.elemImaginary = f.baseElemImaginary || 0;
};

window.calcDamage = function(attacker, defender, baseDmg, element, sourceLabel, isSpirit) {
    isSpirit = isSpirit || false;
    updateFighterStats(attacker);
    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    let dmgBonus = 1;
    if (element === '冰') dmgBonus += (attacker.elemIce || 0) / 100;
    else if (element === '风') dmgBonus += (attacker.elemWind || 0) / 100;
    else if (element === '火') dmgBonus += (attacker.elemFire || 0) / 100;
    else if (element === '物理') dmgBonus += (attacker.elemPhysical || 0) / 100;
    else if (element === '虚数') dmgBonus += (attacker.elemImaginary || 0) / 100;
    else dmgBonus += (attacker.elemOther || 0) / 100;
    if (attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    if (isSpirit && attacker.charId === 'changye' && G.changyeInDarkMystery) dmgBonus += 0.60;
    const cy = getAllyById('changye');
    if (cy && cy.alive && cy.spirit && cy.spirit.alive && (attacker.charId === 'changye' || (isSpirit && attacker.charId === 'changye'))) dmgBonus += 0.50;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let finalDmg = baseDmg * defMulti * resistMulti * dmgBonus * critMulti;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    finalDmg *= vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }
    if (sourceLabel && finalDmg > 0) recordDamage(sourceLabel, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.calcHuanleDamage = function(attacker, defender, skillMultiplier, element) {
    element = element || '虚数';
    updateFighterStats(attacker);
    if (attacker.charId === 'yinlang') updateYinlangHuanleDu(attacker);
    recalculateHuanleDu();
    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    if (attacker.charId === 'yinlang' && attacker.hasLC) ignoreDef += 20;
    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);
    const base = 7535.107 * skillMultiplier;
    const huanleDuPercent = attacker.huanleDu || 0;
    const huanleMulti = 1 + huanleDuPercent / 100;
    const zengxiaoMulti = 1 + G.zengxiao / 100;
    let xiaodian;
    if (G.ahaMomentInProgress) xiaodian = getCurrentXiaodian();
    else xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);
    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);
    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;
    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;
    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;
    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);
    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;
    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }
    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
};

window.getFighterHuanleDu = function(fighter) {
    if (!fighter || !fighter.alive) return 0;
    if (fighter.charId === 'yinlang') return (fighter.bonusHuanle || 0) + getYinlangHuanleDu(fighter);
    if (typeof _origGetFighterHuanleDu_yinlang === 'function') return _origGetFighterHuanleDu_yinlang(fighter);
    return fighter.huanleDu || 0;
};

function executeYinlangBasic(fighter, target) {
    if (!fighter || !fighter.alive || !target || !target.alive) return;
    addLog('系统', fighter.name + ' 使用了【拳头硬了！】', 'skill-use');
    const r = calcDamage(fighter, target, fighter.baseAtk * 1.0, '虚数', fighter.label || fighter.name, false);
    target.hp = Math.max(0, target.hp - r.finalDmg);
    if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
    addLog('战斗', fighter.name + ' 普攻 -> ' + target.name + ' ' + r.finalDmg + ' 伤害', 'dmg-imaginary');
    G.sp = Math.min(G.sp + 1, G.maxSp);

    if (fighter.hasLC) {
        fighter.basicCount = (fighter.basicCount || 0) + 1;
        if (fighter.basicCount >= 3) {
            fighter.basicCount = 0;
            fighter.lcXiaodianTriggered = false;
            addLog('系统', '光锥可触发次数已重置');
        }
    }

    if (fighter.goodShow && fighter.goodShow.duration > 0) {
        const h = calcHuanleDamage(fighter, target, 0.40, '虚数');
        target.hp = Math.max(0, target.hp - h.finalDmg);
        if (target.hp <= 0) { target.alive = false; addLog('系统', target.name + ' 被击败'); }
        addLog('系统', '欢愉伤害：' + h.finalDmg, 'dmg-true');
    }
    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, [target], false);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeYinlangSkill(fighter) {
    if (!fighter || !fighter.alive) return;
    if (G.sp <= 0) { addLog('系统', '战技点不足'); return; }
    G.sp--;
    addLog('系统', fighter.name + ' 使用了【Shoot属性大爆发】', 'skill-use');
    addXiaodian(5);
    const enemies = getAliveEnemies();
    let totalDmg = 0;
    enemies.forEach(e => {
        const r = calcDamage(fighter, e, fighter.baseAtk * 1.6, '虚数', fighter.label, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
        totalDmg += r.finalDmg;
    });
    addLog('战斗', fighter.name + ' 战技 -> 全体 ' + totalDmg + ' 总伤害', 'dmg-imaginary');
    if (fighter.goodShow && fighter.goodShow.duration > 0) {
        let huanleTotal = 0;
        enemies.forEach(e => {
            if (!e.alive) return;
            const h = calcHuanleDamage(fighter, e, 0.40, '虚数');
            e.hp = Math.max(0, e.hp - h.finalDmg);
            if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败'); }
            huanleTotal += h.finalDmg;
        });
        if (huanleTotal > 0) addLog('系统', '欢愉伤害：' + huanleTotal, 'dmg-true');
    }
    if (typeof triggerDajiDali === 'function') triggerDajiDali(fighter, enemies, true);
    onAllyAttack(fighter);
    advanceActionValue();
    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeYinlangUlt(fighter) {
    if (!fighter || !fighter.alive) return;

    if ((fighter.hiddenScore || 0) < 60) {
        addLog('系统', '银狼隐藏分不足（' + (fighter.hiddenScore || 0) + '/60），无法启动无敌玩家');
        G.isUltInterrupt = false;
        G.ultSelecting = G.ultSelecting || {};
        G.ultSelecting[fighter.charId] = false;
        G.pendingUlts = (G.pendingUlts || []).filter(u => u.charId !== 'yinlang');
        G.processing = false;
        const cf = getCurrentFighter();
        if (cf && cf.alive) {
            showSkillSelection(cf);
        }
        renderAll();
        return;
    }

    addLog('系统', fighter.name + ' 使用了【无敌玩家，启动！】', 'skill-use');
    fighter.hiddenScore = Math.max(0, (fighter.hiddenScore || 0) - 60);
    addLog('系统', '消耗60隐藏分，当前隐藏分 ' + fighter.hiddenScore);
    fighter.invinciblePlayer = true;
    fighter.invincibleBasicCount = 0;
    fighter.blindboxFixedProb = 1.0;
    fighter.hiddenScore = Math.min((fighter.hiddenScore || 0) + 20, 300);
    addLog('系统', '行迹3触发：获得20隐藏分，当前 ' + fighter.hiddenScore);

    if (fighter.hasLC && !fighter.lcXiaodianTriggered) {
        fighter.lcXiaodianTriggered = true;
        addXiaodian(20);
        addLog('系统', '光锥触发：获得20笑点');
    }

    if (typeof applyImmediateAction === 'function') {
        applyImmediateAction(fighter, { reason: '无敌玩家启动' });
    }

    G.yinlangInvincibleField = { owner: fighter.charId, active: true };
    addLog('系统', '银狼进入无敌玩家状态，结界展开');
    G.ultSelecting = {};
    G.isUltInterrupt = false;
    G.processing = false;
    G.pendingUlts = G.pendingUlts.filter(u => u.charId !== 'yinlang');
    renderAll();

    // ★★★ 核心修复：判断当前行动者是否正在选技能
    //   - activeActorId 为空或就是银狼 → 立即启动强普
    //   - activeActorId 是别人 → 银狼排队，恢复当前行动者面板，等它行动完
    const prevActiveId = G.activeActorId;
    const isYinlangTurn = (!prevActiveId || prevActiveId === fighter.charId);

    if (isYinlangTurn) {
        G.currentActionIdx = 0;
        setTimeout(() => processNextAction(), 300);
    } else {
        const cf = getAllyById(prevActiveId);
        if (cf && cf.alive) {
            setTimeout(() => showSkillSelection(cf), 300);
        }
    }
}

function showYinlangUltTargetChoice(fighter) {
    if (!fighter || !fighter.alive) return;
    const c = document.getElementById('skillButtons');
    let h = '<span style="color:#ffd966;font-size:13px;">银狼终结技 - 选择目标:</span>';
    h += '<button class="btn btn-primary" data-ally-id="' + fighter.charId + '" data-char-id="' + fighter.charId + '" style="display:flex;flex-direction:column;align-items:flex-start;min-width:120px;padding:4px 10px;">' +
        '<span>' + fighter.name + '</span><span style="font-size:9px;color:#7aa9ff;">隐藏分 ' + (fighter.hiddenScore || 0) + '</span></button>';
    h += '<button class="btn btn-warning" id="btnYinlangUltRelease">释放</button>';
    c.innerHTML = h;

    document.getElementById('btnYinlangUltRelease').addEventListener('click', function() {
        this.disabled = true;
        executeYinlangUlt(fighter);
    });

    document.querySelector('button[data-ally-id="' + fighter.charId + '"]').addEventListener('click', function() {
        this.disabled = true;
        executeYinlangUlt(fighter);
    });
}

let yinlangEnhancedState = null;

function startYinlangEnhancedBasic(fighter) {
    if (!fighter || !fighter.alive) return;
    G.yinlangEnhancedInProgress = true;
    yinlangEnhancedState = {
        phase: 'burst',
        currentSegment: 0,
        totalSegments: 100,
        accumulatedDamage: 0,
        blindboxCount: 0,
        pendingBlindbox: false,
        fighter: fighter
    };
    fighter.enhancedBasicPhase = 0;
    fighter.blindboxTriggerCount = 0;
    addLog('系统', '银狼强化普攻开始：奖励关「狼尊时刻」', 'skill-use');
    continueYinlangEnhancedBasic();
}

function continueYinlangEnhancedBasic() {
    if (!yinlangEnhancedState) return;
    const state = yinlangEnhancedState;
    const fighter = state.fighter;
    if (!fighter || !fighter.alive) return;

    if (state.phase === 'burst') {
        const availableTargets = getAliveEnemies();
        if (availableTargets.length === 0) {
            executeYinlangFinalHit(fighter, state.accumulatedDamage);
            return;
        }

        let targetSegment = 50;
        if (state.blindboxCount === 1) targetSegment = 75;
        else if (state.blindboxCount === 2) targetSegment = 100;

        const endSegment = Math.min(targetSegment, state.currentSegment + 5);
        while (state.currentSegment < endSegment) {
            state.currentSegment++;
            const target = availableTargets[Math.floor(Math.random() * availableTargets.length)];
            const extraLayers = Math.min(Math.floor((fighter.hiddenScore || 0) / 60), 2);
            const damageMult = 0.024 * (1 + extraLayers * 0.15);
            let r;
            if (fighter.goodShow && fighter.goodShow.xiaodian > 0) {
                r = calcHuanleDamage(fighter, target, damageMult, '虚数');
            } else {
                r = calcDamage(fighter, target, fighter.baseAtk * damageMult, '虚数', fighter.label, false);
            }
            if (target.alive) {
                target.hp = Math.max(0, target.hp - r.finalDmg);
                if (target.hp <= 0) target.alive = false;
            }
            state.accumulatedDamage += r.finalDmg;
        }
        updateYinlangBurstLog(fighter, state.accumulatedDamage);

        if (state.currentSegment >= targetSegment) {
            state.phase = 'pause';
            state.blindboxCount++;
            showYinlangBlindboxButton(fighter);
        } else {
            setTimeout(() => continueYinlangEnhancedBasic(), 30);
        }
    }
}

function triggerYinlangBlindbox() {
    if (!yinlangEnhancedState || yinlangEnhancedState.phase !== 'pause') return;
    const state = yinlangEnhancedState;
    const fighter = state.fighter;
    if (!fighter || !fighter.alive) return;

    executeYinlangBlindbox(fighter, state.accumulatedDamage);

    if (state.blindboxCount < 3) {
        state.phase = 'burst';
        setTimeout(() => continueYinlangEnhancedBasic(), 30);
    } else {
        state.phase = 'final';
        setTimeout(() => {
            executeYinlangFinalHit(fighter, state.accumulatedDamage);
        }, 30);
    }
}

function updateYinlangBurstLog(fighter, totalDamage) {
    const logContent = document.getElementById('logContent');
    if (!logContent) return;
    const existing = Array.from(logContent.children).find(div => div.classList.contains('yinlang-burst-log'));
    if (existing) {
        existing.innerHTML = '<span class="time">[实时]</span><span class="dmg-imaginary">弹射进行中，总伤害：' + totalDamage + '</span>';
    } else {
        const div = document.createElement('div');
        div.className = 'log-entry yinlang-burst-log';
        div.innerHTML = '<span class="time">[实时]</span><span class="dmg-imaginary">弹射进行中，总伤害：' + totalDamage + '</span>';
        logContent.appendChild(div);
        logContent.parentElement.scrollTop = logContent.parentElement.scrollHeight;
    }
}

    const enemies = getAliveEnemies();
    if (enemies.length === 0) {
        G.yinlangEnhancedInProgress = false;
        yinlangEnhancedState = null;
        fighter.invincibleBasicCount = (fighter.invincibleBasicCount || 0) + 1;

        if (fighter.hasLC) {
            fighter.basicCount = (fighter.basicCount || 0) + 1;
            if (fighter.basicCount >= 3) {
                fighter.basicCount = 0;
                fighter.lcXiaodianTriggered = false;
                addLog('系统', '光锥可触发次数已重置');

        }

        if (fighter.invincibleBasicCount >= 3) {

        const interval = calcActionValue(fighter.spd);

        renderAll();
        if (processPendingUlts()) return;

        setTimeout(() => processNextAction(), 300);
        return;
    }

    const perEnemy = 1.0 / enemies.length;
    let normalDamage = 0;
    enemies.forEach(e => {
        let r;
        if (fighter.goodShow && fighter.goodShow.xiaodian > 0) {
            r = calcHuanleDamage(fighter, e, perEnemy, '虚数');
        } else {
            r = calcDamage(fighter, e, fighter.baseAtk * perEnemy, '虚数', fighter.label, false);
        }
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) e.alive = false;
        normalDamage += r.finalDmg;
    });

    const totalAllDamage = accumulatedDamage + normalDamage;
    addLog('战斗', '银狼强化普攻最后一击普通伤害：' + normalDamage, 'dmg-imaginary');
    if (accumulatedDamage > 0) {
        addLog('系统', '强化普攻欢愉伤害总计：' + accumulatedDamage, 'dmg-true');
    }
    addLog('战斗', '银狼强化普攻总伤害：' + totalAllDamage, 'dmg-imaginary');

    yinlangEnhancedState = null;
    G.yinlangEnhancedInProgress = false;
    fighter.invincibleBasicCount = (fighter.invincibleBasicCount || 0) + 1;

    if (fighter.hasLC) {
        fighter.basicCount = (fighter.basicCount || 0) + 1;
        if (fighter.basicCount >= 3) {
            fighter.basicCount = 0;
            fighter.lcXiaodianTriggered = false;
            addLog('系统', '光锥可触发次数已重置');
        }
    }

    if (fighter.invincibleBasicCount >= 3) {
        fighter.invinciblePlayer = false;
        fighter.hiddenScore = 0;
        G.yinlangInvincibleField = null;
        addLog('系统', '银狼退出无敌玩家状态，隐藏分清空');
    }

    const interval = calcActionValue(fighter.spd);
    fighter.av += interval;

    buildActionQueue();
    G.currentActionIdx = 0;

    renderAll();

    if (processPendingUlts()) {
        return;
    }

    G.processing = false;
    renderAll();
    setTimeout(() => processNextAction(), 300);
}

function executeYinlangBlindbox(fighter, totalDmg) {
    const targetList = getAliveEnemies();
    if (targetList.length === 0) return;
    const skillMult = 0.90 / targetList.length;
    let huanleTotal = 0;
    targetList.forEach(e => {
        const r = calcHuanleDamage(fighter, e, skillMult, '虚数');
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) e.alive = false;
        huanleTotal += r.finalDmg;
    });
    if (yinlangEnhancedState) {
        yinlangEnhancedState.accumulatedDamage += huanleTotal;
    }
    addLog('系统', '头号补给盲盒欢愉伤害：' + huanleTotal, 'dmg-true');

}

function triggerBlindboxEffect(fighter, totalDmg) {
    let sp = G.sp;
    let maxSp = G.maxSp;
    let hiddenScore = fighter.hiddenScore || 0;
    let bombProb = sp < maxSp ? 0.5 + 0.4 * (1 - sp / maxSp) : 0;
    let beanProb = hiddenScore < 300 ? 0.3 * (1 - hiddenScore / 300) + 0.05 : 0.05;
    let swordProb = Math.max(0, 1 - bombProb - beanProb);
    const totalProb = swordProb + bombProb + beanProb;
    swordProb /= totalProb;
    bombProb /= totalProb;
    beanProb /= totalProb;
    const roll = Math.random();
    if (roll < swordProb) {
        const enemies = getAliveEnemies();
        if (enemies.length === 0) return;
        const highestHpEnemy = enemies.sort((a,b) => b.hp - a.hp)[0];
        const trueDmg = Math.round(totalDmg * 0.20);
        highestHpEnemy.hp = Math.max(0, highestHpEnemy.hp - trueDmg);
        if (highestHpEnemy.hp <= 0) highestHpEnemy.alive = false;
        addLog('系统', '超超超大剑触发，对 ' + highestHpEnemy.name + ' 造成 ' + trueDmg + ' 真实伤害', 'dmg-true');
    } else if (roll < swordProb + bombProb) {
        G.sp = Math.min(G.sp + 2, G.maxSp);
        addLog('系统', '爆爆爆炸蛋触发，恢复2战技点');
    } else {
        addXiaodian(3);
        addLog('系统', '怪怪怪味豆触发，获得3笑点');
    }
}

function isYinlangSpecialLocked() {

}

function flushPendingBlindboxQueue() {
    if (!G._pendingBlindboxQueue || G._pendingBlindboxQueue.length === 0) return;
    if (G._blindboxFlushing) return;
    if (isYinlangSpecialLocked()) return;

    const q = G._pendingBlindboxQueue.slice();
    G._pendingBlindboxQueue = [];
    const yinlang = getAllyById('yinlang');
    if (!yinlang || !yinlang.alive) {
        G._blindboxFlushing = false;
        return;
    }

    G._blindboxFlushing = true;
    console.log('[Yinlang] 开始触发累积盲盒 ' + q.length + ' 个');
    if (q.length > 1) {
        addLog('系统', '银狼盲盒连击！共 ' + q.length + ' 个', 'special');
    }

    let idx = 0;
    function nextOne() {
        if (isYinlangSpecialLocked()) {
            const remain = q.slice(idx);
            G._pendingBlindboxQueue = remain.concat(G._pendingBlindboxQueue);
            G._blindboxFlushing = false;
            return;
        }
        if (idx >= q.length) {
            G._blindboxFlushing = false;
            return;
        }
        const item = q[idx];
        idx++;
        if (Math.random() < item.chance) {
            executeYinlangBlindboxFromConsume(yinlang);
        }
        setTimeout(nextOne, 1000);
    }
    nextOne();
}

        const extraAha = G.pendingExtraAha.shift();
        G.isUltInterrupt = true;
        executeExtraAhaMoment(extraAha);
        return true;

    if (!G.pendingUlts || G.pendingUlts.length === 0) return false;
    if (G.isUltInterrupt) return true;

    const next = G.pendingUlts.shift();
    const f = getAllyById(next.charId);
    if (!f || !f.alive) return processPendingUlts();

    if (f.charId === 'yinlang') {
        if ((f.hiddenScore || 0) < 60) {
            addLog('系统', '隐藏分不足，终结技跳过', 'special');
            return processPendingUlts();

            addLog('系统', f.name + ' 能量不足，终结技跳过', 'special');

    G.isUltInterrupt = true;

// ============================================================
// 欢愉系统模块：阿哈时刻、笑点、欢愉伤害、欢愉度
// 最终修复：欢愉度独立计算，伤害使用攻击者自身欢愉度
// 保存为 js/07_huanle.js
// ============================================================

function initHuanleFields() {
    if (G.huanleDu === undefined) G.huanleDu = 0;
    if (G.zengxiao === undefined) G.zengxiao = 0;
    if (!G.ahaMoment) {
        G.ahaMoment = {
            active: false,
            spd: 0,
            av: 0,
            xiaodian: 0,
            scheduledNewXiaodian: 0
        };
    }
    if (!G.goodShowList) G.goodShowList = [];
    if (!G.pendingExtraAha) G.pendingExtraAha = [];
    if (G.ahaMomentInProgress === undefined) G.ahaMomentInProgress = false;
    if (G.yinlangEnhancedInProgress === undefined) G.yinlangEnhancedInProgress = false;
    if (G.huohuaTrapInProgress === undefined) G.huohuaTrapInProgress = false;
}

function getHuanleFighters() {
    return G.fighters.filter(f => f.alive && f.path === '欢愉');
}

function getAhaSpeed() {
    const huanleFighters = getHuanleFighters();
    if (huanleFighters.length === 0) return 0;
    const sorted = huanleFighters.slice().sort((a, b) => b.spd - a.spd);
    let speed = 80;
    const weights = [0.2, 0.1, 0.05, 0.02];
    for (let i = 0; i < sorted.length && i < 4; i++) {
        speed += weights[i] * sorted[i].spd;
    }
    return Math.round(speed * 100) / 100;
}

// 不再使用全局汇总欢愉度，删除 recalculateHuanleDu 或保留为空
function recalculateHuanleDu() {
    // 此函数已弃用，欢愉度按角色独立计算
    // 保留空函数避免其他文件报错
}

function addXiaodian(amount) {
    if (!G.ahaMoment) {
        G.ahaMoment = { active: false, spd: 0, av: 0, xiaodian: 0, scheduledNewXiaodian: 0 };
    }
    G.ahaMoment.xiaodian += amount;

    // 银狼同步隐藏分（1笑点=1隐藏分）
    const yinlang = getAllyById('yinlang');
    if (yinlang && yinlang.alive && typeof onYinlangGetXiaodian === 'function') {
        onYinlangGetXiaodian(yinlang, amount);
    }
}

function getCurrentXiaodian() {
    return G.ahaMoment && G.ahaMoment.active ? G.ahaMoment.xiaodian : 0;
}

function calcHuanleDamage(attacker, defender, skillMultiplier, element) {
    element = element || '火';
    updateFighterStats(attacker);
    // 确保攻击者自身欢愉度已更新
    if (attacker.path === '欢愉') {
        if (attacker.charId === 'huohua' && typeof updateHuohuaHuanleDu === 'function') updateHuohuaHuanleDu(attacker);
        if (attacker.charId === 'yaoguang' && typeof updateYaoguangHuanleDu === 'function') updateYaoguangHuanleDu(attacker);
        if (attacker.charId === 'yinlang' && typeof updateYinlangHuanleDu === 'function') updateYinlangHuanleDu(attacker);
    }

    let ignoreDef = 0;
    const qg = getAllyById('qingge');
    if (qg && qg.alive && qg.spirit && qg.spirit.alive && qg.spirit.birdCount >= 3) {
        ignoreDef = 15 + G.qinggeAtmosphere * 0.5;
    }
    if (attacker.charId === 'yinlang' && attacker.hasLC) ignoreDef += 20;

    const originalDef = defender.def;
    if (ignoreDef > 0) defender.def = defender.def * (1 - ignoreDef / 100);

    const base = 7535.107 * skillMultiplier;

    // 使用攻击者自身欢愉度
    const huanleDuPercent = attacker.huanleDu || 0;
    const huanleMulti = 1 + huanleDuPercent / 100;

    const zengxiaoMulti = 1 + G.zengxiao / 100;

    let xiaodian;
    if (G.ahaMomentInProgress) {
        xiaodian = getCurrentXiaodian();
    } else {
        xiaodian = (attacker.goodShow && attacker.goodShow.duration > 0) ? attacker.goodShow.xiaodian : 0;
    }
    const xiaodianMulti = 1 + (5 * xiaodian) / (xiaodian + 240);

    const def = defender.def || 900;
    const defMulti = 1 - def / (def + 1000);

    let resist = defender.resist || 0;
    if (element !== '风' && element !== '冰') resist += 0.2;
    let pen = 0;
    if (G.yaoguangPenetration && G.yaoguangPenetration.duration > 0) pen = G.yaoguangPenetration.value / 100;
    const effectiveResist = resist * (1 - pen);
    const resistMulti = 1 - effectiveResist;

    const cr = attacker.critRate || 0.05;
    const cd = attacker.critDmg || 0.50;
    const isCrit = Math.random() < cr;
    const critMulti = isCrit ? (1 + cd) : 1;

    let vulnMulti = 1;
    if (defender.debuff_zhian && defender.debuff_zhian > 0) vulnMulti *= (1 + defender.debuff_zhian / 100);
    if (defender.debuff_geshou && defender.debuff_geshou > 0) vulnMulti *= (1 + defender.debuff_geshou / 100);
    if (defender.debuff_xiongxing && defender.debuff_xiongxing > 0) vulnMulti *= (1 + defender.debuff_xiongxing / 100);
    if (G.fieldEffects.xilianBlank) vulnMulti *= 1.10;

    let finalDmg = base * huanleMulti * zengxiaoMulti * xiaodianMulti * defMulti * resistMulti * critMulti * vulnMulti;
    finalDmg = Math.round(finalDmg);

    let trueDmgXilian = 0;
    if (G.fieldEffects.xilianField) trueDmgXilian = Math.round(finalDmg * 0.24);
    finalDmg += trueDmgXilian;

    if (G.fieldEffects.qinggeSecretDmgBuff && G.fieldEffects.qinggeSecretDmgBuff.duration > 0) {
        finalDmg = Math.round(finalDmg * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
        trueDmgXilian = Math.round(trueDmgXilian * (1 + G.fieldEffects.qinggeSecretDmgBuff.value / 100));
    }

    if (finalDmg > 0) recordDamage(attacker.label || attacker.name, finalDmg);
    defender.def = originalDef;
    return { finalDmg, trueDmgQingge: 0, trueDmgXilian, isCrit };
}

function initAhaMoment() {
    initHuanleFields();
    // 不再需要全局欢愉度汇总
    const huanleFighters = getHuanleFighters();
    G.ahaMoment.active = huanleFighters.length > 0;
    if (G.ahaMoment.active) {
        G.ahaMoment.spd = getAhaSpeed();
        G.ahaMoment.av = calcActionValue(G.ahaMoment.spd);
        G.ahaMoment.xiaodian = 0;
        G.ahaMoment.scheduledNewXiaodian = 0;
    } else {
        G.ahaMoment.spd = 0;
        G.ahaMoment.av = 0;
        G.ahaMoment.xiaodian = 0;
    }

    huanleFighters.forEach(f => {
        if (typeof grantGoodShow === 'function') {
            grantGoodShow(f, 20);
        }
    });
}

function addAhaToActionQueue(queue) {
    if (G.ahaMoment && G.ahaMoment.active) {
        queue.push({
            type: 'aha',
            charId: 'aha_moment',
            name: '阿哈时刻',
            avatar: 'aha',
            spd: G.ahaMoment.spd,
            av: G.ahaMoment.av,
            extra: false
        });
    }
}

function processAhaAction() {
    if (!G.ahaMoment.active) return;

    const huanleFighters = getHuanleFighters()
        .slice()
        .sort((a, b) => (a.paramNum || 999) - (b.paramNum || 999));

    addLog('系统', '阿哈时刻开始', 'special');

    const yinlang = huanleFighters.find(f => f.charId === 'yinlang');
    if (yinlang && yinlang.invinciblePlayer) {
        yinlang.huanleSkill = yinlang.enhancedHuanleSkill;
    }

    G.ahaMomentInProgress = true;
    const currentXiaodian = G.ahaMoment.xiaodian;

    for (const f of huanleFighters) {
        if (!f.alive) continue;
        if (typeof f.huanleSkill === 'function') {
            f.huanleSkill();
        }
    }

    G.ahaMomentInProgress = false;

    if (yinlang) {
        yinlang.huanleSkill = function() { executeYinlangHuanleSkill(yinlang); };
    }

    const totalXiaodian = G.ahaMoment.xiaodian;
    huanleFighters.forEach(f => {
        if (f.alive && typeof grantGoodShow === 'function') {
            grantGoodShow(f, totalXiaodian);
        }
    });

    const huanleCount = huanleFighters.length;
    const newXiaodian = huanleCount;
    G.ahaMoment.scheduledNewXiaodian = newXiaodian;
    G.ahaMoment.xiaodian = 0;

    addLog('系统', '阿哈时刻结束，好活当赏按' + totalXiaodian + '笑点计算，为下一次储存' + newXiaodian + '笑点', 'special');

    advanceAhaActionValue();
}

function advanceAhaActionValue() {
    const cur = G.actionQueue[G.currentActionIdx];
    if (!cur || cur.type !== 'aha') return;

    cur.av += calcActionValue(G.ahaMoment.spd);
    G.ahaMoment.av = cur.av;

    G.actionQueue.sort((a, b) => a.av - b.av);
    const idx = G.actionQueue.findIndex(u => u.type === 'aha');
    G.currentActionIdx = idx !== -1 ? idx : 0;

    const topAv = G.actionQueue[0]?.av || 0;
    while (topAv - G.roundStartAV >= G.roundMaxAV) {
        G.roundStartAV += G.roundMaxAV;
        G.round++;
        if (G.round === 1) G.roundMaxAV = 150;
        addLog('系统', '进入第 ' + (G.round + 1) + ' 轮 (' + G.roundMaxAV + '行动值)', 'special');
    }
}

// 最终 buildActionQueue：完整重建，确保阿哈时刻加入、战技点上限、欢愉度独立更新
window.buildActionQueue = function() {
    // 更新火花专武战技点上限
    const huohua = getAllyById('huohua');
    if (huohua && huohua.alive && huohua.hasLC) {
        const huanleCount = getHuanleFighters().length;
        G.maxSp = 5 + Math.min(huanleCount, 3);
    } else {
        G.maxSp = 5;
    }
    if (G.sp > G.maxSp) G.sp = G.maxSp;

    // 更新每个欢愉角色的自身欢愉度
    getHuanleFighters().forEach(f => {
        if (f.charId === 'huohua' && typeof updateHuohuaHuanleDu === 'function') updateHuohuaHuanleDu(f);
        if (f.charId === 'yaoguang' && typeof updateYaoguangHuanleDu === 'function') updateYaoguangHuanleDu(f);
        if (f.charId === 'yinlang' && typeof updateYinlangHuanleDu === 'function') updateYinlangHuanleDu(f);
    });

    // 自动初始化阿哈时刻
    if (!G.ahaMoment || G.ahaMoment.active === undefined) {
        initAhaMoment();
    }
    if (getHuanleFighters().length > 0 && (!G.ahaMoment.active || G.ahaMoment.spd === 0)) {
        initAhaMoment();
    }

    const u = [];

    G.fighters.forEach(f => {
        if (!f.alive) return;

        if (f.charId === 'qingge' && G.qinggeFeverActive) {
            if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
                u.push({ type:'ally', charId:f.charId, name:f.spirit.name, avatar:'spirit', spd:f.spirit.spd, av:f.spirit.av, fighter:f, isSpirit:true, extra:false });
            }
            return;
        }

        u.push({ type:'ally', charId:f.charId, name:f.name, avatar:f.avatar, spd:f.spd, av:f.av, fighter:f, isSpirit:false, extra:false });

        if (f.spirit && f.spirit.alive && f.spirit.spd > 0) {
            u.push({ type:'ally', charId:f.charId, name:f.spirit.name, avatar:'spirit', spd:f.spirit.spd, av:f.spirit.av, fighter:f, isSpirit:true, extra:false });
        }
    });

    G.enemies.forEach(e => {
        if (e.alive) {
            u.push({ type:'enemy', enemyId:e.id, name:e.name, avatar:'enemy', spd:e.spd, av:e.av, enemy:e, extra:false });
        }
    });

    addAhaToActionQueue(u);

    if (G.extraTurns && G.extraTurns.length) {
        const seen = new Set();
        G.extraTurns = G.extraTurns.filter(e => {
            const key = e.charId + (e.isSpirit ? '_spirit' : '');
            if (seen.has(key)) return false;
            seen.add(key);
            return e.fighter && e.fighter.alive && (!e.isSpirit || (e.fighter.spirit && e.fighter.spirit.alive));
        });
        G.extraTurns.forEach(e => {
            u.push({ type:'ally', charId:e.charId, name:e.name + ' ⭐', avatar:e.avatar || 'spirit', spd:9999, av:0, fighter:e.fighter, isSpirit:e.isSpirit || false, extra:true });
        });
        G.extraTurns = [];
    }

    u.sort((a, b) => a.av - b.av);
    G.actionQueue = u;
    G.currentActionIdx = 0;
};

function renderActionBar() {
    const c = document.getElementById('actionBar');
    const q = G.actionQueue || [];
    if (q.length === 0) {
        c.innerHTML = '<span class="label">第' + (G.round + 1) + '轮 (0/' + G.roundMaxAV + ')</span>';
        return;
    }
    const cur = q[G.currentActionIdx];
    const curAv = cur ? cur.av : 0;
    const consumed = Math.max(0, curAv - G.roundStartAV);
    let h = '<span class="label">第' + (G.round + 1) + '轮 (' + Math.round(consumed) + '/' + G.roundMaxAV + ')</span>';
    const ms = Math.min(q.length, 10);
    for (let i = 0; i < ms; i++) {
        const it = q[i];
        if (!it) continue;
        const isCur = i === G.currentActionIdx;
        let cls = 'action-slot';
        if (isCur) cls += ' current';
        if (it.extra) cls += ' extra';
        let av = '人';
        if (it.avatar === 'enemy') av = '敌';
        else if (it.avatar === 'spirit') av = '灵';
        else if (it.avatar === 'aha') av = '阿';
        else if (it.avatar) av = it.avatar.charAt(0);
        const displayAv = isCur ? 0 : Math.round(it.av - curAv);
        h += '<div class="' + cls + '"><span class="avatar ' + (it.avatar || '') + '">' + av + '</span>' + it.name + (isCur ? ' 当前' : '') + '<span style="font-size:8px;color:#667799;margin-left:2px;">' + displayAv + '</span></div>';
    }
    if (q.length > 10) h += '<span style="color:#667799;font-size:10px;">+' + (q.length - 10) + '</span>';
    c.innerHTML = h;
}

function renderEnemyBar() {
    const c = document.getElementById('enemyBar');
    let h = '';
    G.enemies.forEach((e, idx) => {
        if (!e.alive) return;
        const pct = Math.round(e.hp / e.maxHp * 100);
        const debtPct = (e.ahaDebt && e.baseMaxHp) ? Math.round(e.ahaDebt / e.baseMaxHp * 100) : 0;
        const tag = e.type === 'normal' ? '小怪' : '精英';
        const tc = e.type === 'normal' ? '#66aa88' : '#ff9966';
        // 血条：红色填充 hp，右侧银灰色负债
        let barHtml = '<div class="hp-track" style="position:relative;">';
        barHtml += '<div class="fill" style="width:' + pct + '%;"></div>';
        if (debtPct > 0) {
            barHtml += '<div style="position:absolute;right:0;top:0;bottom:0;width:' + debtPct + '%;background:linear-gradient(90deg, rgba(180,180,180,0.6), rgba(200,200,200,0.85));border-radius:0 6px 6px 0;"></div>';
        }
        barHtml += '<div class="label">' + pct + '%</div></div>';
        h += '<div class="enemy-item" onclick="openEnemyDetail(\'' + e.id + '\')" style="cursor:pointer;"><div class="name"><span>' + e.name + '</span><span class="tag" style="background:' + tc + ';color:#0b0e14;">' + tag + '</span></div>' + barHtml + '<div class="hp-text">HP ' + Math.round(e.hp) + ' / ' + Math.round(e.maxHp) + (debtPct > 0 ? ' <span style="color:#c0c0c0;">负债' + Math.round(e.ahaDebt) + '</span>' : '') + '</div></div>';
    });
    if (!h) h = '<span style="color:#667799;">没有敌人</span>';
    c.innerHTML = h;
}

function renderLog() {
    const c = document.getElementById('logContent');
    let h = '';
    G.log.slice(-50).forEach(e => {
        h += '<div class="log-entry"><span class="time">[' + e.time + ']</span><span class="' + e.type + '">' + e.text + '</span></div>';
    });
    c.innerHTML = h;
    const p = document.getElementById('logPanel');
    if (p) p.scrollTop = p.scrollHeight;
}

function renderDamageStats() {
    const t = G.damageStats.total;
    document.getElementById('totalDmgDisplay').textContent = t.toLocaleString();
    const c = document.getElementById('dmgBreakdown');
    const s = Object.entries(G.damageStats.bySource).sort((a, b) => b[1] - a[1]);
    let h = '';
    s.forEach(([n, d]) => {
        const p = t > 0 ? (d / t * 100) : 0;
        h += '<span class="item">' + n + ': ' + d.toLocaleString() + ' <span style="color:#ffd966;">' + p.toFixed(1) + '%</span></span>';
    });
    c.innerHTML = h || '<span style="color:#667799;">暂无伤害数据</span>';
}

function updateInfo() {
    // ★ 用 class 找，因为 header 和 rail 里都有
    document.querySelectorAll('.round-display').forEach(function(el) {
        el.textContent = G.round + 1;
    });
    document.querySelectorAll('.round-max').forEach(function(el) {
        el.textContent = G.roundMaxAV;
    });

    // ★ 消耗值实时显示
    var consumed = Math.max(0, Math.round((G.globalAv || 0) - (G.roundStartAV || 0)));
    document.querySelectorAll('.round-consumed').forEach(function(el) {
        el.textContent = consumed;
    });

    document.getElementById('spDisplay').textContent = G.sp;
    const spMaxElement = document.getElementById('spMaxDisplay');
    if (spMaxElement) spMaxElement.textContent = G.maxSp;
    if (G.sp > G.maxSp) G.sp = G.maxSp;
    document.getElementById('spDisplay').textContent = G.sp;
    document.getElementById('targetDisplay').textContent = getAliveEnemies().length + '个敌人';

    const xdSpan = document.getElementById('xiaodianDisplay');
    if (xdSpan) {
        if (G.ahaMoment && G.ahaMoment.active) {

            xdSpan.style.display = 'inline';
        } else {
            xdSpan.style.display = 'none';
        }
    }
}

// ============================================================
// 角色详情弹窗 + 敌人详情弹窗 + 属性编辑
// 保存为 js/06_ui_detail.js
// ★ 新增：
//   1. 战斗中详情面板实时刷新（保留滚动位置）
//   2. 忆灵面板读忆灵自己的属性（含长夜月战技暴伤）
//   3. 忆灵增益区显示

let currentDetailCharId = null;
let currentDetailSlotIdx = -1;
let showingSpirit = false;

let _detailLastRefresh = 0;
const DETAIL_REFRESH_INTERVAL = 150;

function openCharDetail(slotIdx) {
    currentDetailSlotIdx = slotIdx;
    showingSpirit = false;
    const charId = G.team[slotIdx];
    if (!charId) return;
    currentDetailCharId = charId;
    renderDetailModal();
    document.getElementById('charDetailOverlay').classList.add('show');
}

function closeCharDetail() {
    document.getElementById('charDetailOverlay').classList.remove('show');
}

function toggleDetailSpirit() {
    showingSpirit = !showingSpirit;
    renderDetailModal();
}

function canEdit() {
    return !G.battleActive && !showingSpirit;
}

function isSpdLocked(charId) {
    const bs = BASE_STATS[charId];
    return bs && bs.baseSpd === 0;
}

function formatBonusValue(white, bonus) {
    if (bonus > 0) {
        return white + ' <span style="color:#5fe6a0;">+' + bonus + '</span>';
    } else if (bonus < 0) {
        return white + ' <span style="color:#ff6b6b;">' + bonus + '</span>';
    } else {
        return white;
    }
}

function makeEditableRow(label, charId, key, whiteValue, bonusValue, unit, locked) {
    locked = locked || false;
    const editable = canEdit() && !locked;
    const valueHtml = editable
        ? '<span class="editable-value" data-char-id="' + charId + '" data-key="' + key + '" data-white="' + whiteValue + '" data-bonus="' + bonusValue + '" style="cursor:pointer;' + (bonusValue > 0 ? 'color:#5fe6a0;' : bonusValue < 0 ? 'color:#ff6b6b;' : 'color:#fff;') + '">' + formatBonusValue(whiteValue, bonusValue) + unit + '</span>'
        : '<span style="' + (bonusValue > 0 ? 'color:#5fe6a0;' : bonusValue < 0 ? 'color:#ff6b6b;' : 'color:#fff;') + '">' + formatBonusValue(whiteValue, bonusValue) + unit + (locked ? ' 锁' : '') + '</span>';

    let btns = '';
    if (editable) {
        btns = '<button class="btn btn-sm btn-edit" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:8px;padding:2px 8px;font-size:10px;">编辑</button>' +
            '<button class="btn btn-sm btn-reset" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:6px;padding:2px 8px;font-size:10px;">重置</button>';
    }

    return '<div class="detail-row"><span class="label">' + label + '</span><span class="value">' + valueHtml + btns + '</span></div>';
}

function makeSimpleEditableRow(label, charId, key, currentValue, unit) {
    const editable = canEdit();
    const valueHtml = editable
        ? '<span class="editable-value" data-char-id="' + charId + '" data-key="' + key + '" data-simple="true" style="cursor:pointer;color:#fff;">' + currentValue + unit + '</span>'
        : '<span style="color:#fff;">' + currentValue + unit + '</span>';

    let btns = '';
    if (editable) {
        btns = '<button class="btn btn-sm btn-edit" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:8px;padding:2px 8px;font-size:10px;">编辑</button>' +
            '<button class="btn btn-sm btn-reset" data-char-id="' + charId + '" data-key="' + key + '" style="margin-left:6px;padding:2px 8px;font-size:10px;">重置</button>';
    }

    return '<div class="detail-row"><span class="label">' + label + '</span><span class="value">' + valueHtml + btns + '</span></div>';
}

function renderDetailModal() {
    const slotIdx = currentDetailSlotIdx;
    const charId = currentDetailCharId;
    if (!charId) return;
    const modal = document.getElementById('charDetailModal');
    const cd = CHAR_DATA[charId];
    const bs = getCharBaseStats(charId, slotIdx);
    const equipped = G_LC_EQUIPPED[slotIdx];
    const lc = LIGHTCONE_STATS[charId];
    const f = G.battleActive ? getAllyById(charId) : null;

    // ★ 战斗中先刷新属性
    if (f && f.alive && typeof updateFighterStats === 'function') {
        updateFighterStats(f);
        if (charId === 'huohua' && typeof updateHuohuaHuanleDu === 'function') updateHuohuaHuanleDu(f);
        if (charId === 'yaoguang' && typeof updateYaoguangHuanleDu === 'function') updateYaoguangHuanleDu(f);
        if (charId === 'yinlang' && typeof updateYinlangHuanleDu === 'function') updateYinlangHuanleDu(f);
        if (charId === 'feiying' && typeof updateFeiyingHuanleDu === 'function') updateFeiyingHuanleDu(f);
        if (charId === 'zhenzhu' && typeof updateZhenzhuHuanleDu === 'function') updateZhenzhuHuanleDu(f);
        if (charId === 'aha' && typeof updateAhaHuanleDu === 'function') updateAhaHuanleDu(f);
    }

    let title = cd.name;
    let bodyHtml = '';

    if (showingSpirit && f && f.spirit && f.spirit.alive) {
        title = f.spirit.name;

        // ★ 优先用忆灵自己的属性，缺失时回退到本体
        const s = f.spirit;
        const spiritHp = Math.round(s.hp);
        const spiritMaxHp = Math.round(s.maxHp);
        const spiritSpd = Math.round(s.spd);
        const spiritAtk = Math.round(s.atk !== undefined ? s.atk : f.atk);
        const spiritDef = Math.round(s.def !== undefined ? s.def : f.def);
        const spiritCritRate = Math.round((s.critRate !== undefined ? s.critRate : f.critRate) * 100);
        const spiritCritDmg = Math.round((s.critDmg !== undefined ? s.critDmg : f.critDmg) * 100);
        const spiritElemIce = Math.round(f.elemIce || 0);
        const spiritElemWind = Math.round(f.elemWind || 0);
        const spiritElemOther = Math.round(f.elemOther || 0);
        const spiritElemFire = Math.round(f.elemFire || 0);
        const spiritElemPhysical = Math.round(f.elemPhysical || 0);
        const spiritElemImaginary = Math.round(f.elemImaginary || 0);
        const spiritHuanleDu = Math.round(f.huanleDu || 0);
        const spiritEnergyRecharge = Math.round(f.energyRecharge || 100);

        // 忆灵身上挂的 buff（长夜月战技）
        let spiritBuffHtml = '';
        if (f.buffs && f.buffs.changyeSkill) {
            spiritBuffHtml = '<div class="section-title">忆灵增益</div>' +
                '<div style="padding:6px 0;">' +
                '<span style="display:inline-block;background:rgba(28,38,56,0.65);border-left:2px solid #6ec6f8;padding:1px 6px;border-radius:3px;font-size:10px;">' +
                f.buffs.changyeSkill.desc +
                '</span></div>';
        }

        bodyHtml = '<div class="detail-row"><span class="label">生命值</span><span class="value">' + spiritHp + ' / ' + spiritMaxHp + '</span></div>' +
            '<div class="detail-row"><span class="label">攻击力</span><span class="value">' + spiritAtk + '</span></div>' +
            '<div class="detail-row"><span class="label">防御力</span><span class="value">' + spiritDef + '</span></div>' +
            '<div class="detail-row"><span class="label">速度</span><span class="value">' + spiritSpd + (spiritSpd === 0 ? ' 锁' : '') + '</span></div>' +
            '<div class="detail-row"><span class="label">欢愉度</span><span class="value">' + spiritHuanleDu + '%</span></div>' +
            '<div class="detail-row"><span class="label">充能效率</span><span class="value">' + spiritEnergyRecharge + '%</span></div>' +
            '<div class="detail-row"><span class="label">暴击率</span><span class="value">' + spiritCritRate + '%</span></div>' +
            '<div class="detail-row"><span class="label">暴击伤害</span><span class="value">' + spiritCritDmg + '%</span></div>' +
            spiritBuffHtml +
            '<div class="section-title">属性伤害加成</div>' +
            '<div class="detail-row"><span class="label">冰属性</span><span class="value">' + spiritElemIce + '%</span></div>' +
            '<div class="detail-row"><span class="label">风属性</span><span class="value">' + spiritElemWind + '%</span></div>' +
            '<div class="detail-row"><span class="label">火属性</span><span class="value">' + spiritElemFire + '%</span></div>' +
            '<div class="detail-row"><span class="label">物理属性</span><span class="value">' + spiritElemPhysical + '%</span></div>' +
            '<div class="detail-row"><span class="label">虚数属性</span><span class="value">' + spiritElemImaginary + '%</span></div>' +
            '<div class="detail-row"><span class="label">其他属性</span><span class="value">' + spiritElemOther + '%</span></div>';
    } else {
        const whiteHp = bs.whiteHp, whiteAtk = bs.whiteAtk, whiteDef = bs.whiteDef, whiteSpd = bs.whiteSpd;
        const spdLocked = isSpdLocked(charId);

        let bonusHp, bonusAtk, bonusDef, bonusSpd;
        let critRateVal, critDmgVal, elemIceVal, elemWindVal, elemOtherVal, elemFireVal, elemPhysicalVal, elemImaginaryVal;
        let huanleDuVal, energyRechargeVal;

        const bonus = getBonusStats(charId);
        const bonusHuanle = bonus.huanleDu || 0;
        const bonusPhysical = bonus.elemPhysical || 0;
        const bonusImaginary = bonus.elemImaginary || 0;
        const bonusEnergyRecharge = bonus.energyRecharge || 0;

        if (f && G.battleActive) {
            bonusHp = Math.round(f.maxHp - whiteHp);
            bonusAtk = Math.round(f.atk - whiteAtk);
            bonusDef = Math.round(f.def - whiteDef);
            bonusSpd = Math.round(f.spd - whiteSpd);
            critRateVal = Math.round(f.critRate * 100);
            critDmgVal = Math.round(f.critDmg * 100);
            elemIceVal = Math.round(f.elemIce || 0);
            elemWindVal = Math.round(f.elemWind || 0);
            elemOtherVal = Math.round(f.elemOther || 0);
            elemFireVal = Math.round(f.elemFire || 0);
            elemPhysicalVal = Math.round(f.elemPhysical || 0);
            elemImaginaryVal = Math.round(f.elemImaginary || 0);
            huanleDuVal = Math.round(getFighterHuanleDu ? getFighterHuanleDu(f) : (f.huanleDu || 0));
            energyRechargeVal = Math.round(f.energyRecharge || 100);
        } else {
            bonusHp = bs.bonusHp;
            bonusAtk = bs.bonusAtk;
            bonusDef = bs.bonusDef;
            bonusSpd = bs.bonusSpd;
            critRateVal = Math.round(bs.baseCritRate * 100);
            critDmgVal = Math.round(bs.baseCritDmg * 100);
            elemIceVal = bs.elemIce || 0;
            elemWindVal = bs.elemWind || 0;
            elemOtherVal = bs.elemOther || 0;
            elemFireVal = bs.elemFire || 0;
            elemPhysicalVal = bonusPhysical;
            elemImaginaryVal = bonusImaginary;
            huanleDuVal = bonusHuanle;
            energyRechargeVal = 100 + bonusEnergyRecharge;
        }

        // 战斗中的 HP 行
        let hpRow = '';
        if (f && G.battleActive) {
            hpRow = '<div class="detail-row"><span class="label">生命值</span><span class="value">' +
                Math.round(f.hp) + ' / ' + Math.round(f.maxHp) +
                (bonusHp !== 0 ? ' <span style="color:' + (bonusHp > 0 ? '#5fe6a0' : '#ff6b6b') + ';">(' + (bonusHp > 0 ? '+' : '') + bonusHp + ')</span>' : '') +
                '</span></div>';
        } else {
            hpRow = makeEditableRow('生命值', charId, 'hp', whiteHp, bonusHp, '');
        }

        // 战斗中的能量行
        let energyRow = '';
        if (f && G.battleActive) {
            energyRow = '<div class="detail-row"><span class="label">能量</span><span class="value">' +
                Math.round(f.energy) + ' / ' + f.maxEnergy +
                '</span></div>';
        }

        // 当前增益
        let buffRow = '';
        if (f && G.battleActive && f.buffs && Object.keys(f.buffs).length > 0) {
            const tags = [];
            for (const k in f.buffs) {
                if (f.buffs[k] && f.buffs[k].desc) {
                    tags.push('<span style="display:inline-block;background:rgba(28,38,56,0.65);border-left:2px solid #6ec6f8;padding:1px 6px;border-radius:3px;margin:2px 2px 0 0;font-size:10px;">' + f.buffs[k].desc + '</span>');
                }
            }
            if (tags.length > 0) {
                buffRow = '<div class="section-title">当前增益</div><div style="padding:6px 0;">' + tags.join('') + '</div>';

        bodyHtml = hpRow +
            makeEditableRow('攻击力', charId, 'atk', whiteAtk, bonusAtk, '') +
            makeEditableRow('防御力', charId, 'def', whiteDef, bonusDef, '') +
            makeEditableRow('速度', charId, 'spd', whiteSpd, bonusSpd, '', spdLocked) +
            energyRow +
            makeSimpleEditableRow('欢愉度', charId, 'huanleDu', huanleDuVal, '%') +
            makeSimpleEditableRow('充能效率', charId, 'energyRecharge', energyRechargeVal, '%') +
            makeSimpleEditableRow('暴击率', charId, 'critRate', critRateVal, '%') +
            makeSimpleEditableRow('暴击伤害', charId, 'critDmg', critDmgVal, '%') +
            buffRow +
            '<div class="section-title">属性伤害加成</div>' +
            makeSimpleEditableRow('冰属性', charId, 'elemIce', elemIceVal, '%') +
            makeSimpleEditableRow('风属性', charId, 'elemWind', elemWindVal, '%') +
            makeSimpleEditableRow('火属性', charId, 'elemFire', elemFireVal, '%') +
            makeSimpleEditableRow('物理属性', charId, 'elemPhysical', elemPhysicalVal, '%') +
            makeSimpleEditableRow('虚数属性', charId, 'elemImaginary', elemImaginaryVal, '%') +
            makeSimpleEditableRow('其他属性', charId, 'elemOther', elemOtherVal, '%') +
            (equipped ? '<div class="section-title">光锥: 已装备</div>' : '<div class="section-title">光锥: 未装备</div>');
    }

    let h = '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<h2 style="margin:0;">' + title + ' <span style="font-size:12px;color:#8899bb;">' + cd.element + '·' + cd.path + '</span></h2>' +
        '<button class="btn btn-danger" id="btnCloseX" style="padding:2px 10px;font-size:16px;line-height:1;">×</button>' +

function initGoodShowList(fighter) {
    if (!fighter.goodShowList) fighter.goodShowList = [];
    if (!fighter.goodShow) fighter.goodShow = { xiaodian: 0, duration: 0 };
    if (fighter.goodShow.xiaodian > 0 && fighter.goodShowList.length === 0) {
        fighter.goodShowList.push({ xiaodian: fighter.goodShow.xiaodian, duration: fighter.goodShow.duration });
    }
    updateGoodShowSummary(fighter);
}

function updateGoodShowSummary(fighter) {
    if (!fighter.goodShowList) return;
    let total = 0;
    let maxDur = 0;
    fighter.goodShowList = fighter.goodShowList.filter(l => l.duration > 0 && l.xiaodian > 0);
    for (const layer of fighter.goodShowList) {
        total += layer.xiaodian;
        maxDur = Math.max(maxDur, layer.duration);
    }
    fighter.goodShow = { xiaodian: total, duration: maxDur };
}

function addGoodShowLayer(fighter, xiaodian, duration) {
    if (!fighter || !fighter.alive || xiaodian <= 0) return;
    duration = duration || 2;
    initGoodShowList(fighter);
    fighter.goodShowList.push({ xiaodian: xiaodian, duration: duration });
    updateGoodShowSummary(fighter);
}

function getTotalGoodShow(fighter) {
    if (!fighter || !fighter.alive) return 0;
    initGoodShowList(fighter);
    return fighter.goodShow.xiaodian;
}

function hasGoodShow(fighter) {
    return getTotalGoodShow(fighter) > 0;
}

function tickGoodShowLayers(fighter) {
    if (!fighter || !fighter.alive) return;
    initGoodShowList(fighter);
    const removedLayers = [];
    fighter.goodShowList.forEach(layer => {
        layer.duration--;
        if (layer.duration <= 0) removedLayers.push(layer);
    });
    fighter.goodShowList = fighter.goodShowList.filter(l => l.duration > 0);
    updateGoodShowSummary(fighter);

    if (removedLayers.length > 0) {
        const feiying = getAllyById('feiying');
        if (feiying && feiying.alive && fighter.charId !== 'feiying') {
            let totalRemoved = 0;
            removedLayers.forEach(l => { totalRemoved += l.xiaodian; });
            const gained = Math.round(totalRemoved * 0.5);
            if (gained > 0) {
                addGoodShowLayer(feiying, gained, 2);
                onFeiyingGoodShowGained(feiying, gained);
                addLog('系统', '行迹3【开不败】：' + fighter.name + '的好活消失，绯英获得' + gained + '好活', 'buff');
            }
        }
    }
}

function onFeiyingEnergyGained(fighter, amount) {

    fighter._feiyingConverting = true;

    addLog('系统', '绯英天赋：获得' + amount + '能量，同步获得' + amount + '好活当赏', 'buff');

    const singleAccum = Math.min(amount, 240);
    fighter.energyAccum = Math.min((fighter.energyAccum || 0) + singleAccum, 480);
    checkFoxTrigger(fighter);

    fighter._feiyingConverting = false;
}

function executeFoxAttack(fighter) {
    if (!fighter || !fighter.alive) return;
    addLog('系统', fighter.name + ' 的【狐狸老师】发动追加攻击！', 'skill-use');

        const r = calcDamage(fighter, e, fighter.baseAtk * 1.0, '物理', fighter.label, false);
        e.hp = Math.max(0, e.hp - r.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        totalDmg += r.finalDmg;
        totalTrueX += r.trueDmgXilian;
    });

    let huanleTotal = 0;
    enemies.forEach(e => {
        if (!e.alive) return;
        const h = calcHuanleDamage(fighter, e, 0.25, '物理');
        e.hp = Math.max(0, e.hp - h.finalDmg);
        if (e.hp <= 0) { e.alive = false; addLog('系统', e.name + ' 被击败!'); }
        huanleTotal += h.finalDmg;
        totalTrueX += h.trueDmgXilian;
    });

    addLog('战斗', '狐狸老师追加攻击 -> 全体 ' + totalDmg + ' 物理伤害 + ' + huanleTotal + ' 欢愉伤害', 'dmg-physical');

    enemies.forEach(e => {
        if (e.alive) {
            e.debuff_fox = 12;
            e.debuff_foxDuration = 3;
        }
    });
    addLog('系统', '行迹2【行裁断】：敌方受到伤害提高12%（3回合）', 'buff');

    const foxEnergyGain = Math.round(10 * (1 + getEnergyRechargeBonus(fighter)));
    fighter.energy = Math.min(fighter.energy + foxEnergyGain, fighter.maxEnergy);
    addLog('系统', '狐狸老师为绯英恢复' + foxEnergyGain + '能量', 'buff');
    onFeiyingEnergyGained(fighter, foxEnergyGain);

    onAllyAttack(fighter);
}

function executeFeiyingBasic(fighter, target) {
